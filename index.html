<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1411">
<meta name="description" content="Rules and directions for every card game — plus party games you only need a deck to run.">
<title>Deck &amp; Rules — every card game, one app</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230d1411'/><text y='72' x='50' font-size='62' text-anchor='middle' fill='%23e8e3d5'>&#9824;</text></svg>">
<style>
:root{
  --bg:#0d1411; --bg-2:#121b17; --card:#16211c; --card-2:#1c2a23;
  --line:#25352c; --line-2:#31463a;
  --ink:#eee9dc; --ink-dim:#a3b0a6; --ink-faint:#6f7d73;
  --felt:#2f9e68; --felt-deep:#1d6b46; --gold:#d9b26a; --red:#d7605f;
  --radius:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--felt)}
:focus-visible{outline:2px solid var(--felt);outline-offset:2px}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
header.top{
  position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 72%,rgba(13,20,17,0));
  padding:14px 0 10px;
}
.brand{display:flex;align-items:baseline;gap:10px;padding:2px 0 12px}
.brand h1{font-family:var(--serif);font-size:23px;letter-spacing:.2px;margin:0;font-weight:600}
.brand .suits{font-size:15px;letter-spacing:2px;color:var(--ink-faint)}
.brand .suits .r{color:#d7605f}
.brand small{margin-left:auto;color:var(--ink-faint);font-size:12px}

.search{position:relative}
.search input{
  width:100%;padding:13px 42px 13px 40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);outline:none;font-size:16px;
}
.search input:focus{border-color:var(--line-2);background:var(--card-2)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--ink-faint);padding:6px 8px;font-size:18px;display:none}
.search.has .clear{display:block}

/* ---------- filter chips ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-dim);font-size:13.5px;white-space:nowrap;transition:.12s;
}
.chip[aria-pressed="true"]{background:var(--felt-deep);border-color:var(--felt);color:#fff}
.chip.reset{border-style:dashed;color:var(--ink-faint)}

.countline{color:var(--ink-faint);font-size:12.5px;padding:10px 2px 6px;display:flex;align-items:center;gap:10px}
.countline button{color:var(--felt);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- game list ---------- */
.list{display:grid;gap:10px}
.gcard-wrap{position:relative}
.gcard{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 46px 14px 15px;transition:.12s;
}
.gcard:active{transform:scale(.994)}
.gcard:hover{border-color:var(--line-2);background:var(--card-2)}
.gcard h3{margin:0 0 3px;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.2px}
.gcard .aka{color:var(--ink-faint);font-size:12px;margin:0 0 6px}
.gcard p.blurb{margin:0 0 9px;color:var(--ink-dim);font-size:14px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11.5px;padding:3px 8px;border-radius:6px;background:#0f1a15;border:1px solid var(--line);color:var(--ink-dim)}
.pill.cat{color:var(--gold);border-color:#3a3320;background:#1a1710}
.fav{
  position:absolute;top:10px;right:8px;padding:8px;font-size:18px;line-height:1;color:var(--ink-faint);
}
.fav[aria-pressed="true"]{color:#d76a6a}

.empty{text-align:center;color:var(--ink-faint);padding:48px 20px;font-size:14.5px}
.empty b{display:block;color:var(--ink-dim);font-family:var(--serif);font-size:18px;margin-bottom:6px}

/* ---------- picker ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel h2{font-family:var(--serif);font-size:17px;margin:0 0 3px;font-weight:600}
.panel .sub{color:var(--ink-faint);font-size:13px;margin:0 0 14px}
.field{margin-bottom:16px}
.field > label{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{
  width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card-2);
  font-size:21px;display:grid;place-items:center;color:var(--ink)
}
.stepper button:disabled{opacity:.3}
.stepper .val{font-family:var(--serif);font-size:26px;min-width:78px;text-align:center}
.stepper .val small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);
  font-size:14px;color:var(--ink-dim)
}
.seg button[aria-pressed="true"]{background:var(--felt-deep);border-color:var(--felt);color:#fff}
.bigbtn{
  width:100%;padding:15px;border-radius:12px;background:var(--felt);color:#06140d;font-weight:650;
  font-size:15.5px;letter-spacing:.2px
}
.bigbtn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink);font-weight:500;margin-top:9px}

/* ---------- detail ---------- */
.detail{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;
  animation:slideup .22s cubic-bezier(.2,.8,.3,1)}
.detail.open{display:block}
@keyframes slideup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.dbar{position:sticky;top:0;background:rgba(13,20,17,.94);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:10px 12px;z-index:2}
.dbar button{padding:8px 10px;border-radius:9px;color:var(--ink-dim);font-size:14px}
.dbar .back{color:var(--felt);font-weight:600}
.dbar .sp{flex:1}
.dwrap{max-width:760px;margin:0 auto;padding:18px 16px 80px}
.dhead h2{font-family:var(--serif);font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:600}
.dhead .aka{color:var(--ink-faint);font-size:13px;margin:0 0 10px}
.dhead .blurb{color:var(--ink-dim);font-size:15.5px;margin:0 0 16px;line-height:1.5}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--card);padding:11px 8px}
.stat b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;
  overflow-wrap:break-word}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint)}
.needs{background:#141d18;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;
  padding:11px 13px;margin-bottom:22px;font-size:14px;color:var(--ink-dim)}
.needs b{color:var(--ink);font-weight:600}
section.rule{margin-bottom:20px}
section.rule h4{font-family:var(--serif);font-size:17.5px;margin:0 0 6px;font-weight:600;color:#fff}
section.rule p{margin:0;color:var(--ink-dim);font-size:15px;line-height:1.62}
.varbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-top:26px}
.varbox h4{font-family:var(--serif);font-size:16px;margin:0 0 9px;font-weight:600}
.varbox ul{margin:0;padding-left:19px;color:var(--ink-dim);font-size:14.5px}
.varbox li{margin-bottom:7px;line-height:1.5}
.related{margin-top:26px}
.related h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin:0 0 9px}

/* ---------- tab bar ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(13,20,17,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{flex:1;padding:11px 4px 12px;color:var(--ink-faint);font-size:10.5px;letter-spacing:.05em;
  display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase}
nav.tabs button .i{font-size:19px;line-height:1}
nav.tabs button[aria-pressed="true"]{color:var(--felt)}
.hide{display:none !important}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(10px);background:var(--card-2);
  border:1px solid var(--line-2);color:var(--ink);padding:9px 15px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.22s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (min-width:720px){
  .list{grid-template-columns:1fr 1fr}
  .brand h1{font-size:26px}
}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="wrap" style="padding-bottom:0">
      <div class="brand">
        <h1>Deck &amp; Rules</h1>
        <span class="suits"><span class="r">&#9829;</span>&#9824;<span class="r">&#9830;</span>&#9827;</span>
        <small id="gcount"></small>
      </div>
      <div class="search" id="searchWrap">
        <span class="ico">&#9906;</span>
        <input id="q" type="search" placeholder="Search games, e.g. euchre, mafia, 4 players" autocomplete="off" spellcheck="false">
        <button class="clear" id="clearQ" aria-label="Clear search">&times;</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- BROWSE -->
    <div id="view-browse">
      <div class="chiprow" id="catRow"></div>
      <div class="countline">
        <span id="resultCount"></span>
        <button id="resetFilters" class="hide">Clear filters</button>
      </div>
      <div class="list" id="list"></div>
    </div>

    <!-- PICKER -->
    <div id="view-picker" class="hide">
      <div class="panel">
        <h2>What can we play?</h2>
        <p class="sub">Tell me the table and I'll shortlist what actually works.</p>

        <div class="field">
          <label>How many people</label>
          <div class="stepper">
            <button id="pMinus" aria-label="Fewer players">&minus;</button>
            <div class="val"><span id="pVal">4</span><small>players</small></div>
            <button id="pPlus" aria-label="More players">+</button>
          </div>
        </div>

        <div class="field">
          <label>How much time</label>
          <div class="seg" id="timeSeg"></div>
        </div>

        <div class="field">
          <label>What kind of night</label>
          <div class="seg" id="vibeSeg"></div>
        </div>

        <button class="bigbtn" id="pickGo">Show me the list</button>
        <button class="bigbtn ghost" id="pickRandom">Just pick one for us</button>
      </div>
      <div class="countline"><span id="pickCount"></span></div>
      <div class="list" id="pickList"></div>
    </div>

    <!-- FAVORITES -->
    <div id="view-favs" class="hide">
      <div class="countline"><span id="favCount"></span></div>
      <div class="list" id="favList"></div>
    </div>
  </main>

  <nav class="tabs">
    <button data-tab="browse" aria-pressed="true"><span class="i">&#9776;</span>Browse</button>
    <button data-tab="picker" aria-pressed="false"><span class="i">&#9819;</span>Pick a game</button>
    <button data-tab="favs" aria-pressed="false"><span class="i">&#9829;</span>Saved</button>
  </nav>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true">
  <div class="dbar">
    <button class="back" id="dBack">&larr; Back</button>
    <span class="sp"></span>
    <button id="dFav" aria-pressed="false">&#9825; Save</button>
  </div>
  <div class="dwrap" id="dBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Deck & Rules — a single-file rules reference for card games.
   Data lives in GAMES below; the app is plain DOM, no dependencies.
   ========================================================================= */
const GAMES = [{"id":"accordion","name":"Accordion","aka":["Idle Year","Methuselah","Tower of Babel"],"cat":"solitaire","players":[1,1],"best":"1","time":[10,20],"age":8,"diff":2,"needs":"1 standard 52-card deck","tags":["solo","quiet","puzzle","brain","one-player"],"blurb":"Squeeze 52 cards down to a single pile. Extremely simple rules, and extremely hard to actually win.","sections":[{"h":"Goal","b":"Compress the entire deck into one pile."},{"h":"Setup","b":"Deal the cards out one at a time in a long row, left to right. You can deal them all first, or deal as you go \u2014 most players deal one at a time and play as opportunities appear."},{"h":"Play","b":"A pile may be moved onto the pile immediately to its left, or three piles to its left, if the top cards match in either SUIT or RANK. Close the gap when you move a pile."},{"h":"Strategy","b":"Long moves (three to the left) are usually better than short ones because they collapse the row faster. Look ahead before making an obvious short move."},{"h":"Winning","b":"Ending with one pile is a win. Fewer than five piles is a good result. Most games end with far more."}],"variants":["Allow moves one or two to the left instead of one or three.","Play 'Idle Year' rules with unlimited redeals of the row.","Set a target: get under five piles to count it as a win."]},{"id":"acey-deucey","name":"Acey Deucey","aka":["In-Between","Red Dog","Sheets","Yablon"],"cat":"casino","players":[2,10],"best":"4-8","time":[15,30],"age":12,"diff":1,"needs":"1 standard deck, chips or coins","tags":["gambling","party","fast","easy-to-teach","big-group","drinking-optional"],"blurb":"Two cards up, and you bet whether the third lands between them. Swingy, dumb, and dangerously fast.","sections":[{"h":"Goal","b":"Win chips from the pot by betting correctly on the spread."},{"h":"Setup","b":"Everyone antes into a central pot. Aces are high (or declared high/low by the player, house rule)."},{"h":"Play","b":"The dealer turns two cards face up in front of the active player. That player bets any amount from one chip up to the current size of the pot on whether the NEXT card will fall strictly between them in rank."},{"h":"Resolution","b":"Turn the third card. Between the two: take your bet's worth from the pot. Outside them: pay your bet into the pot. Exactly matching one of the two cards ('hitting the post'): pay DOUBLE your bet."},{"h":"Consecutive cards","b":"If the two up cards are consecutive in rank there's no gap at all \u2014 the player must pass, or in some houses ante again."},{"h":"Ending","b":"Play until the pot is emptied by a bet-the-pot win, then everyone antes again."}],"variants":["The player calls Ace high or low when an Ace is one of the two cards.","Minimum bet of two chips to speed the game up.","Play with a fixed payout rather than a shared pot."]},{"id":"beggar-my-neighbour","name":"Beggar My Neighbour","aka":["Beat Your Neighbour Out of Doors","Strip Jack Naked"],"cat":"kids","players":[2,4],"best":"2","time":[10,30],"age":5,"diff":1,"needs":"1 standard 52-card deck","tags":["kids","family","no-strategy","two-player","historical"],"blurb":"A Victorian nursery game with no decisions at all. Face cards demand tribute, and the tension of the payoff cards is weirdly gripping.","sections":[{"h":"Goal","b":"Win all the cards."},{"h":"Setup","b":"Deal the deck out evenly, face down. No peeking."},{"h":"Play","b":"Players alternate flipping one card onto a central pile. Keep going until a face card or Ace appears."},{"h":"Paying tribute","b":"When someone plays a Jack, Queen, King or Ace, the next player owes cards: Jack = 1, Queen = 2, King = 3, Ace = 4. They flip that many, one at a time."},{"h":"Counter-attack","b":"If any tribute card is itself a face card or Ace, the payment stops and the obligation flips to the other player, who now owes the new amount. If the tribute is paid in full with no face cards, the player who played the original face card takes the entire pile."},{"h":"Ending","b":"A player with no cards loses. The game is entirely determined by the shuffle \u2014 some deals famously run for thousands of turns."}],"variants":["Add slapping rules to turn it into Egyptian Ratscrew.","Three or four players in a circle, each owing the player to their left.","Cap it with a timer and count cards to decide the winner."]},{"id":"big-two","name":"Big Two","aka":["Deuces","Pusoy Dos","Choh Dai Di"],"cat":"shedding","players":[3,4],"best":"4","time":[15,30],"age":10,"diff":2,"needs":"1 standard 52-card deck","tags":["strategy","climbing","asia","poker-hands","no-equipment"],"blurb":"A climbing game where five-card poker hands beat each other. Bigger, sharper cousin of President.","sections":[{"h":"Goal","b":"Shed all your cards first. Everyone else scores penalty points for cards left."},{"h":"Card order","b":"2 is the highest rank, then A, K, Q, J, 10 down to 3. Suits also rank: spades highest, then hearts, clubs, diamonds. So the 2 of spades is the single best card in the game."},{"h":"Setup","b":"Deal all 52 cards \u2014 13 each with 4 players. The player holding the 3 of diamonds leads first and must include it in their opening play."},{"h":"Play","b":"The leader plays a single, a pair, a triple, or a five-card poker hand. Everyone after must play the SAME TYPE of combination, but higher, or pass. Passing takes you out of that round. When everyone passes, the last player to play leads a fresh combination of any type."},{"h":"Five-card hands","b":"Ranked lowest to highest: straight, flush, full house, four of a kind plus any card, straight flush. Compare by the ranking first, then by the highest card, then by suit."},{"h":"Scoring","b":"The winner scores 0. Everyone else scores 1 point per card left in hand \u2014 doubled if they hold 10 or more cards, tripled at 13. Lowest total after an agreed number of hands wins."}],"variants":["3-player: remove the diamond 3 and 4, deal 16 each.","Some regions rank triples above straights or allow two-card 'bombs'.","Play for chips, settling the point difference each hand."]},{"id":"blackjack","name":"Blackjack","aka":["21","Twenty-One","Pontoon"],"cat":"casino","players":[2,8],"best":"3-6","time":[20,60],"age":12,"diff":1,"needs":"1-6 standard decks, chips or coins","tags":["gambling","easy-to-teach","casino","fast","math"],"blurb":"Beat the dealer without going over 21. The rules take a minute; the correct plays take a chart.","sections":[{"h":"Goal","b":"Get a hand total closer to 21 than the dealer, without exceeding 21."},{"h":"Card values","b":"Number cards are face value. Face cards are 10. Aces are 1 OR 11, whichever helps \u2014 a hand with an ace counted as 11 is called 'soft'."},{"h":"Setup","b":"One player is the dealer (rotate each round in a home game). Everyone else bets. Deal each player two cards face up and the dealer two cards, one up and one down."},{"h":"Blackjack","b":"An Ace plus any 10-value card on the first two cards is a natural blackjack \u2014 it pays 3:2 and beats any other 21."},{"h":"Player options","b":"HIT: take another card, as many times as you like. STAND: keep your total. DOUBLE DOWN: double your bet and take exactly one more card. SPLIT: if your two cards match in rank, split into two hands with a second equal bet. SURRENDER (if allowed): forfeit half your bet and fold."},{"h":"Bust","b":"Go over 21 and you lose immediately, before the dealer even plays. That's the house's real edge."},{"h":"Dealer rules","b":"The dealer reveals their hidden card and must hit until reaching 17 or more, then must stand. Whether the dealer hits a soft 17 varies \u2014 agree before you start."},{"h":"Settlement","b":"Beat the dealer, win even money. Tie (push), keep your bet. Lose, lose your bet. If the dealer busts, everyone still standing wins."}],"variants":["Insurance: when the dealer shows an Ace, bet half your wager that they have blackjack. Statistically a bad bet.","Pontoon (UK/Australia) with different terminology and a five-card trick that wins automatically.","Home rules where the winner becomes the next dealer."]},{"id":"blind-mans-bluff","name":"Blind Man's Bluff","aka":["Indian Poker","Squaw Poker","Forehead Poker"],"cat":"party","players":[3,10],"best":"5-8","time":[15,30],"age":12,"diff":1,"needs":"1 standard deck, chips or tokens","tags":["party","bluffing","easy-to-teach","funny","big-group","drinking-optional"],"blurb":"Everyone sees your card except you. All the reading is in other people's faces.","sections":[{"h":"Goal","b":"Win chips by having the highest card \u2014 or by getting everyone else to fold when you don't."},{"h":"Setup","b":"Everyone antes. Deal one card face down to each player. Without looking at it, hold it against your forehead so everyone else can see it."},{"h":"Play","b":"Starting left of the dealer, players bet, call, raise, or fold, exactly like a single round of poker. You're betting entirely on other people's reactions to your card and on the cards you can see."},{"h":"Showdown","b":"Everyone still in reveals. Highest card wins the pot. Aces high."},{"h":"The tell","b":"The moment someone with a low card sees three face cards around the table, their face gives it away. Watching the watchers is the game."}],"variants":["Deal two cards each for a longer game with two betting rounds.","Play with a rule that the lowest card must drink or take a penalty.","Add a 'blind raise' where you may bump without any information at all."]},{"id":"bs","name":"BS","aka":["Cheat","I Doubt It","Bullsh*t","Liar"],"cat":"shedding","players":[3,8],"best":"4-6","time":[15,30],"age":8,"diff":1,"needs":"1 standard 52-card deck","tags":["party","bluffing","social","easy-to-teach","big-group"],"blurb":"Pure bluffing with almost no rules. Say what you're playing, lie freely, and try not to look like you're lying.","sections":[{"h":"Goal","b":"Be the first player to empty your hand."},{"h":"Setup","b":"Deal the entire deck out. Uneven hands are fine."},{"h":"Play","b":"Play goes in rank order: the first player puts down Aces, the next 2s, the next 3s, and so on up through Kings, then back to Aces. On your turn you place one or more cards FACE DOWN and announce them, e.g. 'three 7s'. You may be telling the truth or lying completely."},{"h":"Calling BS","b":"Any player may call 'BS' immediately after a play. Flip the played cards over. If the player lied, they take the entire discard pile into their hand. If they told the truth, the CALLER takes the whole pile. Then play continues from the next rank."},{"h":"Winning","b":"First to empty their hand wins \u2014 but if someone calls BS on that final play and it was a lie, they pick up the pile and are back in it."}],"variants":["Players may play any rank they choose instead of following sequence, making the game much harder to track.","You must play at least one card per turn \u2014 no passing.","Only the player to the immediate left may call BS."]},{"id":"canasta","name":"Canasta","aka":[],"cat":"rummy","players":[2,6],"best":"4","time":[60,90],"age":12,"diff":3,"needs":"2 standard decks plus 4 jokers, paper for scoring","tags":["strategy","partners","classic","long-game"],"blurb":"Big, meld-heavy partnership rummy from the 1950s. The goal is a canasta: seven of a kind, and the pile is worth fighting for.","sections":[{"h":"Goal","b":"First partnership to 5,000 points."},{"h":"Setup","b":"Shuffle two full decks plus all four jokers (108 cards). Deal 11 cards to each player. Turn one card up to start the discard pile \u2014 if it's a joker, 2, or red 3, bury it and turn another."},{"h":"Wild cards and red threes","b":"Jokers (50 points) and all 2s (20 points) are wild. Red 3s are bonus cards: play them face up immediately and draw a replacement \u2014 each is worth 100 points to your team (all four are worth 800), but only if your team has melded."},{"h":"Melds","b":"Melds are sets of the same rank, three or more, shared with your partner. No runs. A meld may contain at most three wild cards and must always have more natural cards than wild ones. Black 3s can only be melded on your final turn."},{"h":"Opening requirement","b":"Your team's FIRST meld must reach a minimum total based on your current score: below 0 needs 15, 0-1,495 needs 50, 1,500-2,995 needs 90, 3,000+ needs 120."},{"h":"The discard pile","b":"You may take the whole discard pile if you can meld its top card using two natural cards from your hand (or add it to an existing meld). The pile is 'frozen' by a wild card or black 3 on top \u2014 while frozen, you need two natural matching cards from hand, no exceptions."},{"h":"Canastas and going out","b":"A canasta is seven cards of one rank: 500 points if all natural (clean), 300 if it contains a wild (dirty). Your team must have at least one canasta before you can go out. Going out is worth 100 bonus points (200 if you 'go out concealed' \u2014 melding your entire hand at once with a canasta and no prior melds)."},{"h":"Card values","b":"Joker 50, Ace and 2 both 20, K/Q/J/10/9/8 are 10 each, 7 through 4 and black 3 are 5 each. Score melded cards, subtract cards left in hand."}],"variants":["Hand and Foot: each player gets two hands and plays the second after finishing the first.","Samba adds runs (sequences) as legal melds.","Two-player Canasta: deal 15 cards each and draw two cards per turn."]},{"id":"casino","name":"Casino","aka":["Cassino"],"cat":"rummy","players":[2,4],"best":"2","time":[20,30],"age":8,"diff":2,"needs":"1 standard 52-card deck","tags":["two-player","classic","strategy","quiet","math"],"blurb":"A fishing game: capture cards from the table by matching or adding up to them. Quietly one of the sharpest games in the deck.","sections":[{"h":"Goal","b":"First to 21 points across several hands."},{"h":"Card values","b":"Aces are 1. Number cards are face value. Face cards have no numeric value and can only be captured by matching rank."},{"h":"Setup","b":"Deal 4 cards to each player and 4 face up to the table. The rest is the stock; deal 4 more to each player whenever hands run out, but no more to the table."},{"h":"Your turn \u2014 play one card and do one of three things","b":"CAPTURE: take any table card of matching rank, and/or any group of number cards adding up to your card's value. BUILD: place your card on a table card to declare a total you'll capture next turn (e.g. play a 3 on a 5 and announce 'building 8' \u2014 you must hold an 8). TRAIL: just place your card face up on the table, adding to the pool."},{"h":"Builds","b":"You must hold a card capable of capturing any build you make, and you can't trail while you own an unclaimed build. Opponents may capture or increase your build \u2014 a build of 8 can be raised to 10 by adding a 2, if that player holds a 10."},{"h":"Sweeps","b":"If your capture clears the entire table, that's a sweep \u2014 worth 1 extra point. Mark it by turning a card face up in your pile."},{"h":"Scoring","b":"Most cards: 3 points. Most spades: 1 point. The 10 of diamonds ('Big Casino'): 2 points. The 2 of spades ('Little Casino'): 1 point. Each Ace: 1 point. Each sweep: 1 point. Whoever makes the last capture takes any cards left on the table."}],"variants":["Royal Casino: face cards get values (J=11, Q=12, K=13) and can be captured by sums.","Draw Casino: draw a replacement card after every play.","Four-player partnership Casino."]},{"id":"clock-solitaire","name":"Clock Solitaire","aka":["Clock Patience","Hidden Cards","Sundial"],"cat":"solitaire","players":[1,1],"best":"1","time":[5,10],"age":5,"diff":1,"needs":"1 standard 52-card deck","tags":["solo","kids","no-strategy","fast","one-player"],"blurb":"Zero decisions \u2014 the deal decides everything. Good for children and for when you just want to watch something resolve.","sections":[{"h":"Goal","b":"Turn up all four cards at every position on the clock before the fourth King appears."},{"h":"Setup","b":"Deal the entire deck face down into 13 piles of 4: twelve arranged in a circle like a clock face, and one pile in the center."},{"h":"Play","b":"Turn over the top card of the center pile. Slide it face up UNDER the pile matching its number \u2014 Ace goes to 1 o'clock, 2 to 2 o'clock, Jack to 11, Queen to 12, King to the center. Then flip the top card of that pile and repeat."},{"h":"Losing","b":"When the fourth King is turned up, the game ends immediately. If cards are still face down anywhere, you lost."},{"h":"Odds","b":"You win about 1 in 13 games, entirely by chance. There is no skill in this game at all, which is oddly relaxing."}],"variants":["Play with a 'grace' rule allowing one extra flip after the fourth King.","Watch and narrate for a small child \u2014 it's a great counting exercise.","Race two players with two decks side by side."]},{"id":"crazy-eights","name":"Crazy Eights","aka":["Swedish Rummy","Last One","Mau Mau"],"cat":"shedding","players":[2,7],"best":"3-5","time":[10,20],"age":6,"diff":1,"needs":"1 deck (2 decks for 6+ players)","tags":["kids","family","easy-to-teach","fast","no-equipment"],"blurb":"The public-domain original that Uno is built on. Match suit or rank, and eights are wild.","sections":[{"h":"Goal","b":"Be the first to play all your cards."},{"h":"Setup","b":"Deal 5 cards each (7 each with only 2 players). Stack the rest face down and flip the top card to start the discard pile."},{"h":"Play","b":"On your turn, play one card that matches the top of the discard pile in either SUIT or RANK. If you can't, draw from the stock until you can play \u2014 or, in the faster version, draw one card and pass if it doesn't help."},{"h":"Eights are wild","b":"You may play an 8 on anything at any time. When you do, name the suit that must be played next. That's the whole game's leverage \u2014 save one for when you're stuck or about to go out."},{"h":"Ending","b":"First player with no cards wins the hand. If the stock runs out, either reshuffle the discards (leaving the top card) or play until nobody can move."},{"h":"Scoring (optional)","b":"Losers count the cards left in hand: each 8 is 50, face cards are 10, Aces 1, others face value. Play to 100 or 200 points; low score wins."}],"variants":["Crazy Eights Countdown: hand sizes shrink each round from 8 down to 1.","Add action cards like Uno \u2014 2 = draw two, Queen = skip, Ace = reverse.","Mau Mau: the same game with house rules that new players must deduce as they get penalized."]},{"id":"cribbage","name":"Cribbage","aka":["Crib"],"cat":"rummy","players":[2,4],"best":"2","time":[20,40],"age":10,"diff":3,"needs":"1 standard deck and a cribbage board (or paper)","tags":["two-player","strategy","classic","counting","pub"],"blurb":"The pub-table classic. Everything is about combinations that total 15, and half the skill is what you throw away.","sections":[{"h":"Goal","b":"First to 121 points, tracked by pegging around a cribbage board."},{"h":"Card values","b":"Aces are 1, face cards are 10, everything else is face value. For runs, order is A-2-3...J-Q-K."},{"h":"Setup and the crib","b":"Deal 6 cards each (2 players). Each player throws 2 cards face down into 'the crib' \u2014 an extra hand that belongs to the dealer and is scored at the end. Then the non-dealer cuts and the dealer flips the top card: the 'starter' or 'cut'. If it's a Jack, the dealer immediately pegs 2 ('his heels')."},{"h":"The play (pegging)","b":"Starting with the non-dealer, alternate playing cards face up in front of you, calling out the running total. You cannot exceed 31. Score as you go: making the total exactly 15 = 2 points; a pair = 2; three of a kind = 6; four of a kind = 12; completing a run of three or more (in any order) = 1 per card; hitting exactly 31 = 2. If you can't play without going over, say 'go' \u2014 your opponent keeps playing and pegs 1 for the last card. Then reset the count to zero and continue with remaining cards."},{"h":"The show (counting hands)","b":"Non-dealer counts first, then dealer, then the dealer counts the crib. Each hand is its 4 cards plus the shared starter card. Score: every combination totaling 15 = 2 points; every pair = 2; every run of 3+ = 1 per card; 4 cards of one suit = 4 (5 with the starter); Jack matching the starter's suit ('his nobs') = 1."},{"h":"Why the crib matters","b":"The crib is the dealer's bonus hand, so as dealer you throw good cards into it and as non-dealer you throw junk. 5s are gold \u2014 they pair with every 10-value card to make 15."}],"variants":["3-player: deal 5 each plus one card straight to the crib.","4-player partnership: deal 5 each, one card to the crib from each player.","Muggins: if your opponent miscounts their hand, you may claim the points they missed."]},{"id":"durak","name":"Durak","aka":["Fool"],"cat":"trick","players":[2,6],"best":"3-4","time":[20,40],"age":10,"diff":2,"needs":"36 cards (6 through Ace in each suit)","tags":["strategy","classic","russian","elimination","no-equipment"],"blurb":"Russia's national card game. There's no winner \u2014 only a loser, the durak, who is left holding cards when everyone else is out.","sections":[{"h":"Goal","b":"Get rid of all your cards. The last player still holding cards is the fool."},{"h":"Setup","b":"Use a 36-card deck (6 to Ace). Deal 6 cards each. Turn the next card face up and slide it half-under the remaining stock \u2014 its suit is trump for the whole game and that card is the last one drawn."},{"h":"Attack and defend","b":"The player with the lowest trump attacks first; the player to their left defends. The attacker plays a card face up. The defender must beat it with a HIGHER card of the same suit, or with any trump (a trump beats any non-trump; a higher trump beats a lower one)."},{"h":"Piling on","b":"Once a defense is made, the attacker \u2014 and any other player \u2014 may add more attacking cards, but only cards whose RANK already appears on the table. The defender must beat each one. The maximum number of attacks in a bout is 6 (or the defender's hand size, whichever is smaller)."},{"h":"Resolving the bout","b":"If the defender beats everything, all cards go to the discard pile and the defender becomes the next attacker. If the defender gives up, they pick up ALL cards on the table and the attack passes to the player after them."},{"h":"Refilling","b":"After each bout, players draw back up to 6 cards from the stock, attacker first. Once the stock is gone, no one refills, and players who run out of cards are out of the game."}],"variants":["Perevodnoy (transfer) Durak: the defender can pass the attack along by playing a matching rank.","Podkidnoy is the standard 'throw-in' version described above.","Play with a full 52-card deck for longer games."]},{"id":"egyptian-ratscrew","name":"Egyptian Ratscrew","aka":["ERS","Egyptian War","Slap"],"cat":"speed","players":[2,8],"best":"3-5","time":[10,30],"age":8,"diff":1,"needs":"1 standard 52-card deck (short nails recommended)","tags":["fast","chaotic","party","reflexes","loud","kids"],"blurb":"War with slapping. Sting your hand a few times and you'll never forget the slap rules.","sections":[{"h":"Goal","b":"Win every card in the deck."},{"h":"Setup","b":"Deal the entire deck out face down. Players keep their pile face down and never look at it."},{"h":"Play","b":"Going clockwise, each player flips their top card onto a central pile. Keep going until a face card or Ace appears."},{"h":"The face card challenge","b":"When someone plays a face card or Ace, the NEXT player must pay a tribute of cards: Jack = 1 card, Queen = 2, King = 3, Ace = 4. If any of those tribute cards is itself a face card or Ace, the challenge passes to the next player, who now owes the new tribute. If the tribute runs out without another face card, the player who played the ORIGINAL face card takes the whole pile."},{"h":"Slap rules","b":"Anyone may slap the pile at any time \u2014 first hand down takes it. Slap on: DOUBLE (two matching ranks in a row), SANDWICH (matching ranks separated by one card), TOP-BOTTOM (played card matches the bottom card of the pile), and TENS (two consecutive cards adding to 10, no face cards)."},{"h":"Bad slaps","b":"Slap wrongly and you 'burn' \u2014 put one card from your pile face down at the bottom of the center pile. Repeat offenders run out of cards fast."},{"h":"Elimination","b":"Out of cards? You're not out yet \u2014 you get one more chance to slap in. Win a pile and you're back."}],"variants":["Add slap rules: marriage (K then Q), divorce (Q then K), four in a row, or a 'straight' of three sequential cards.","Play with jokers as instant-slap cards.","No-burn rule for young kids so a bad slap just loses the pile."]},{"id":"euchre","name":"Euchre","aka":[],"cat":"trick","players":[4,4],"best":"4","time":[20,40],"age":10,"diff":2,"needs":"24 cards (9 through Ace in each suit)","tags":["strategy","partners","fast","midwest","no-equipment"],"blurb":"The Midwest tavern classic. Short deck, quick hands, and the Jacks change suit on you.","sections":[{"h":"Goal","b":"First team to 10 points. Hands are fast \u2014 a full game takes about 20 minutes."},{"h":"Setup","b":"Strip the deck down to 9, 10, J, Q, K, A in each suit (24 cards). Partners sit across. Deal 5 cards each in packets of 2 and 3, then turn the next card face up \u2014 this is the 'up card'."},{"h":"Naming trump","b":"Starting left of the dealer, each player may 'order up' the up card's suit as trump or pass. If someone orders it up, the dealer picks that card up and discards one. If all four pass, the up card is turned down and a second round begins where each player may name any OTHER suit as trump or pass. If everyone passes again, redeal (or in 'stick the dealer', the dealer must choose)."},{"h":"The Jacks \u2014 this is the part that trips people up","b":"The Jack of the trump suit is the 'right bower' \u2014 the highest card in the game. The Jack of the SAME COLOR suit is the 'left bower' \u2014 second highest, and for this hand it counts as a trump card, not as its printed suit. So if spades are trump, the Jack of clubs IS a spade. Below those: A, K, Q, 10, 9 of trump, then the other suits normally."},{"h":"Play","b":"Player left of the dealer leads. Follow suit if able (remembering the left bower is trump). Highest trump wins, else highest card of the led suit. Five tricks per hand."},{"h":"Scoring","b":"The team that named trump is 'the makers'. Makers take 3 or 4 tricks: 1 point. All 5 tricks (a march): 2 points. If the makers take fewer than 3, they are 'euchred' and the other team scores 2."},{"h":"Going alone","b":"The player who names trump may declare 'alone' \u2014 their partner puts their hand down and sits out. A loner who takes all 5 tricks scores 4 points. 3 or 4 tricks still scores 1."}],"variants":["Stick the dealer: if everyone passes twice, the dealer must name a trump suit.","Add both Jokers or a 'Benny' (the No. 2 card) as the highest trump of all.","Three-handed cutthroat: every player for themselves, loner hands common."]},{"id":"f-the-dealer","name":"F*ck the Dealer","aka":["Screw the Dealer","Guess the Card"],"cat":"party","players":[3,10],"best":"5-8","time":[20,40],"age":21,"diff":1,"needs":"1 standard deck, drinks or forfeits","tags":["party","drinking","adults","easy-to-teach","big-group","luck"],"blurb":"The table guesses cards and the dealer pays for every wrong answer. Nobody wants to be the dealer.","sections":[{"h":"Setup","b":"One player is the dealer. Play moves around the table to their left."},{"h":"The guessing","b":"The dealer asks the next player to guess a card rank. If they're wrong, the dealer tells them 'higher' or 'lower' and they guess again. Wrong twice: the guesser takes a penalty equal to the difference between their second guess and the actual card. Right on either guess: the DEALER takes the penalty \u2014 2 for a first-guess hit, 1 for a second."},{"h":"Rotating the dealer","b":"The dealer keeps dealing until two players in a row guess correctly. Then the deal passes to the left."},{"h":"Ending","b":"Play until the deck runs out. Some groups play three full passes of the deck."},{"h":"Playing it dry","b":"Swap penalties for points against you; highest total loses. Works identically."}],"variants":["Only give 'higher or lower' feedback if the guesser asks for it, at the cost of one penalty.","Suits count: guessing the exact card doubles the dealer's penalty.","Speed round with a 5-second guess timer."]},{"id":"five-card-draw","name":"Five-Card Draw","aka":["Draw Poker"],"cat":"casino","players":[2,6],"best":"4-5","time":[30,90],"age":18,"diff":1,"needs":"1 standard deck, chips or coins","tags":["poker","gambling","easy-to-teach","bluffing","classic","kitchen-table"],"blurb":"The kitchen-table poker your grandfather played. Five cards, one chance to swap, two rounds of betting.","sections":[{"h":"Goal","b":"Win the pot with the best five-card hand, or by betting everyone else out."},{"h":"Setup","b":"Everyone antes one chip into the pot. Deal 5 cards face down to each player."},{"h":"First betting round","b":"Starting left of the dealer, each player checks, bets, calls, raises, or folds. Some groups require 'jacks or better' to open the betting."},{"h":"The draw","b":"Each remaining player discards 0 to 3 cards (some allow 4 if you keep an Ace) and is dealt replacements. Standing pat \u2014 drawing nothing \u2014 is a strong signal, whether or not it's true."},{"h":"Second betting round","b":"Another round of betting starting with the first active player left of the dealer."},{"h":"Showdown","b":"Remaining players reveal. Best five-card hand takes the pot. See the Poker Hand Rankings card if you need it."}],"variants":["Deuces wild, or jokers added as bugs (wild for aces, straights, and flushes only).","Lowball (2-7 or A-5): the worst hand wins.","Anaconda / pass-the-trash: players pass unwanted cards to a neighbor before betting."]},{"id":"freecell","name":"FreeCell","aka":[],"cat":"solitaire","players":[1,1],"best":"1","time":[10,25],"age":10,"diff":2,"needs":"1 standard 52-card deck and table space","tags":["solo","strategy","quiet","brain","puzzle","one-player"],"blurb":"Every card is face up from the start, so there's no luck and no excuse. Nearly every deal is winnable.","sections":[{"h":"Goal","b":"Build all four suits up from Ace to King on the foundations."},{"h":"Setup","b":"Deal all 52 cards face up into eight columns \u2014 four columns of 7 and four of 6. Leave space for four empty 'free cells' and four foundation piles."},{"h":"Free cells","b":"Each free cell holds exactly one card, any card, at any time. It's temporary parking, and managing those four slots is the entire game."},{"h":"Tableau","b":"Build DOWN in alternating colors. You may only move one card at a time \u2014 but with free cells and empty columns you can effectively move a stack. The maximum stack you can move is (free cells + 1) \u00d7 2^(empty columns)."},{"h":"Empty columns","b":"Any card may fill an empty column. Empty columns are far more valuable than free cells, so open one early if you can."},{"h":"Winnability","b":"Of the 32,000 classic Microsoft deals, only one \u2014 game #11982 \u2014 is unsolvable. If you lose, it was almost certainly a mistake, not the shuffle."}],"variants":["Play with 3, 2, or even 1 free cell for a brutal challenge.","Baker's Game: build down in SUIT instead of alternating colors.","Seahaven Towers: ten columns, four free cells, build down in suit."]},{"id":"gin-rummy","name":"Gin Rummy","aka":["Gin"],"cat":"rummy","players":[2,2],"best":"2","time":[20,40],"age":8,"diff":2,"needs":"1 standard 52-card deck, paper for scoring","tags":["two-player","strategy","classic","quiet","no-equipment"],"blurb":"The best two-player card game there is. Build sets and runs, and knock the moment your leftovers are small enough.","sections":[{"h":"Goal","b":"Be first to 100 points across multiple hands."},{"h":"Card values","b":"Face cards are 10, Aces are 1, everything else is face value. Aces are LOW \u2014 A-2-3 is a run, Q-K-A is not."},{"h":"Setup","b":"Deal 10 cards each. Place the rest face down as the stock and flip the top card face up to start the discard pile."},{"h":"Melds","b":"A meld is either a SET (three or four of the same rank) or a RUN (three or more consecutive cards in one suit). Cards not in a meld are 'deadwood', and their total value is your deadwood count."},{"h":"Play","b":"The non-dealer may take the first upcard or pass; if both pass, the non-dealer draws from stock. After that, on your turn draw either the top of the discard pile or the top of the stock, then discard one card. You never lay melds down during play \u2014 you hold everything until you end the hand."},{"h":"Knocking","b":"When your deadwood totals 10 or less, you may knock: discard face down, lay out your melds, and show your deadwood. Your opponent then lays out their melds AND may 'lay off' their own deadwood onto your melds. You score the difference in deadwood."},{"h":"Gin and undercut","b":"Gin means zero deadwood \u2014 you score the opponent's full deadwood plus a 25-point bonus, and they may not lay off. If the opponent's deadwood ends up equal to or LOWER than the knocker's, they undercut: they score the difference plus a 25-point bonus. Never knock lazily."},{"h":"Game bonuses","b":"First to 100 gets a 100-point game bonus, plus 25 per hand won ('box' bonus). If the loser never scored, the winner's total doubles (a shutout, or 'skunk')."}],"variants":["Oklahoma Gin: the first upcard sets the maximum knock value for that hand.","Straight Gin: no knocking allowed \u2014 you must go gin.","Three-player 'cutthroat' with one player sitting out each hand."]},{"id":"go-fish","name":"Go Fish","aka":["Fish","Authors"],"cat":"kids","players":[2,6],"best":"3-4","time":[10,20],"age":4,"diff":1,"needs":"1 standard 52-card deck","tags":["kids","family","easy-to-teach","memory","no-equipment"],"blurb":"The first card game most people ever learn. Ask for cards, collect sets of four, remember what everyone else asked for.","sections":[{"h":"Goal","b":"Collect the most sets of four matching ranks."},{"h":"Setup","b":"Deal 7 cards each (5 each with 4 or more players). The rest goes face down in a pond in the middle."},{"h":"Play","b":"On your turn, ask one specific player for one specific rank: 'Marcus, do you have any sixes?' You must already hold at least one card of that rank. If they have any, they hand over ALL of them and you go again. If they don't, they say 'go fish' and you draw from the pond, ending your turn \u2014 unless you draw exactly what you asked for, in which case you get another turn."},{"h":"Books","b":"Whenever you collect all four of a rank, lay them face up in front of you. That's a book."},{"h":"Ending","b":"The game ends when all 13 books are made, or when the pond is empty and hands run out. Most books wins."}],"variants":["Ask for a card and receive only one, not all of them \u2014 slower and a bit more strategic.","Play with pairs instead of fours for very young children.","Authors: the same game played with a serious face and named sets."]},{"id":"golf","name":"Golf","aka":["Six-Card Golf","Polish Polka","Turtle"],"cat":"rummy","players":[2,8],"best":"3-5","time":[20,40],"age":8,"diff":1,"needs":"1 deck (2 decks for 5+ players), paper for scoring","tags":["family","easy-to-teach","group","fast","memory"],"blurb":"Lowest score wins, like real golf. You only ever see two of your own six cards \u2014 the rest is memory and nerve.","sections":[{"h":"Goal","b":"Lowest total score after nine 'holes' (hands)."},{"h":"Setup","b":"Deal 6 cards to each player, face down in a 2x3 grid in front of them. Without looking at the others, each player peeks at any two of their own cards and turns them face up. Stock face down, one card flipped to start the discard pile."},{"h":"Play","b":"On your turn, draw the top card of the stock or the discard pile. You may either swap it for any one card in your grid (placing the replaced card face up on the discard pile), or \u2014 if you drew from the stock \u2014 discard it immediately. A card drawn from the discard pile must be used."},{"h":"Ending the hand","b":"When a player has all six cards face up, everyone else gets one final turn, then all cards are revealed and scored."},{"h":"Scoring","b":"Aces 1, 2 through 10 face value, Jack and Queen 10, King 0. Here's the trick: any two cards of the same rank in the same COLUMN cancel to 0 points. Stack your matches vertically."}],"variants":["Four-card or nine-card Golf (a 3x3 grid) for shorter or longer games.","Jokers count as -2 points.","Knock version: instead of flipping all six, a player may knock to end the round, and gets penalized if they aren't lowest."]},{"id":"golf-solitaire","name":"Golf Solitaire","aka":["One Foundation","Forty Thieves' cousin"],"cat":"solitaire","players":[1,1],"best":"1","time":[5,10],"age":6,"diff":1,"needs":"1 standard 52-card deck","tags":["solo","fast","easy-to-teach","quiet","one-player"],"blurb":"One long chain, up or down by one. The fastest satisfying solitaire in the deck.","sections":[{"h":"Goal","b":"Clear all 35 tableau cards onto the single foundation pile."},{"h":"Setup","b":"Deal seven columns of five cards each, all face up, overlapping so you can see every card. The bottom card of each column is playable. The remaining 17 cards are the stock."},{"h":"Play","b":"Flip one stock card to start the foundation. Then play any exposed tableau card that is exactly one rank higher OR one rank lower than the current foundation card \u2014 suits are irrelevant. Chain as long as you can."},{"h":"Stuck","b":"When no exposed card fits, flip the next stock card onto the foundation and continue. You get one pass through the stock, no reshuffles."},{"h":"Scoring","b":"Like real golf, count the cards left in the tableau at the end \u2014 lower is better. Zero is a perfect round. Play nine deals as nine holes and total your score."}],"variants":["Allow Kings to wrap around to Aces for an easier chain.","Play with a joker as a wild foundation card.","Deal six columns of six for a harder layout."]},{"id":"hearts","name":"Hearts","aka":["Black Lady","Chase the Lady"],"cat":"trick","players":[3,6],"best":"4","time":[30,60],"age":10,"diff":2,"needs":"1 standard 52-card deck","tags":["strategy","classic","quiet","no-equipment"],"blurb":"A trick-taking game where you want to LOSE. Dodge every heart and the dreaded Queen of Spades \u2014 or take all of them and shoot the moon.","sections":[{"h":"Goal","b":"Have the FEWEST points when someone hits 100. Each heart you capture is 1 point, and the Queen of Spades is 13 points. Points are bad."},{"h":"Setup","b":"Deal the whole deck out evenly \u2014 13 cards each with 4 players. With 3 players remove the 2 of diamonds (17 each). With 5, remove the 2 of diamonds and 2 of clubs (10 each). With 6, remove the 2 of diamonds, 3 of diamonds, 2 of clubs, and 2 of spades (8 each). Aces are high."},{"h":"The passing round","b":"Before play, everyone picks 3 cards and passes them face down. The direction rotates each hand: left, right, across, then no pass at all. Pick up your received cards only after you've passed your own."},{"h":"Play","b":"The lowest club leads \u2014 the 2 of clubs in a full deck, or the lowest club still in it once cards have been stripped for 5 or 6 players. Play proceeds clockwise and you must follow suit if you can. If you can't, you may play anything \u2014 this is how you dump hearts and the Queen of Spades on someone else. Highest card of the led suit wins the trick and leads the next one."},{"h":"Two key restrictions","b":"No hearts or the Queen of Spades may be played on the very first trick. Hearts may not be LED until hearts have been 'broken' (someone has discarded a heart on an earlier trick) \u2014 unless hearts are all you hold."},{"h":"Scoring","b":"After all 13 tricks, count what you captured: 1 point per heart, 13 for the Queen of Spades. That's 26 points on the table each hand. First player to reach 100 ends the game, and the LOWEST score wins."},{"h":"Shooting the moon","b":"If one player takes all 13 hearts AND the Queen of Spades, they score 0 and everyone else takes 26. It's a huge swing and the reason you should never let one player run away with the hearts."}],"variants":["Jack of Diamonds: capturing it subtracts 10 points from your score.","Shooting the sun (taking all 13 tricks) is sometimes worth 52 points to the others instead of 26.","Omnibus Hearts: shooting the moon can be declared to add 26 to everyone else OR subtract 26 from yourself."]},{"id":"horse-race","name":"Horse Race","aka":["Kentucky Derby","Race Horse"],"cat":"party","players":[3,12],"best":"6-10","time":[15,30],"age":12,"diff":1,"needs":"1 standard deck, optional chips for betting","tags":["party","big-group","betting","funny","easy-to-teach","spectator"],"blurb":"The four Aces race up a track of face-down cards. Everyone bets on a suit and yells at a piece of cardboard.","sections":[{"h":"Setup","b":"Pull the four Aces and lay them in a row \u2014 these are the horses. Deal 6 to 8 cards face DOWN in a vertical line beside them; these are the furlong markers, forming the track. Shuffle the rest as the draw pile."},{"h":"Betting","b":"Each player bets on one suit \u2014 with chips, drinks, or just bragging rights. Multiple players can back the same horse."},{"h":"The race","b":"Flip the top card of the draw pile. The Ace matching that card's suit advances one space up the track. Keep flipping."},{"h":"The setback rule","b":"When ALL FOUR horses have passed a furlong marker, flip that marker face up. The horse matching the marker's suit moves BACK one space. This is what makes the race swing wildly at the end."},{"h":"Winning","b":"First Ace to pass the final marker wins. Everyone who backed that suit collects; everyone else pays."}],"variants":["Longer track (10+ markers) for a more dramatic race.","Pari-mutuel betting where the pot splits among winners by stake size.","Assign each player a horse instead of letting them choose."]},{"id":"kings-cup","name":"Kings Cup","aka":["Ring of Fire","Circle of Death","King's Cup","Waterfall"],"cat":"party","players":[4,12],"best":"6-8","time":[30,60],"age":21,"diff":1,"needs":"1 standard deck, one central cup, drinks (works fine with any forfeit instead)","tags":["party","drinking","big-group","adults","easy-to-teach","no-strategy"],"blurb":"Every card is a rule. Spread the deck in a ring around a cup and take turns finding out what happens next.","sections":[{"h":"Setup","b":"Put an empty cup in the middle of the table. Spread the deck face down in an unbroken circle around it. Players sit around the table."},{"h":"Play","b":"Take turns drawing one card. Do what the card says, then place it back outside the ring \u2014 if you break the circle, you take a penalty."},{"h":"The standard rule set","b":"ACE \u2014 Waterfall: everyone starts drinking and no one may stop until the person to their right does. 2 \u2014 You: choose someone. 3 \u2014 Me: it's you. 4 \u2014 Floor: last to touch the floor. 5 \u2014 Guys. 6 \u2014 Chicks. 7 \u2014 Heaven: last to point at the ceiling. 8 \u2014 Mate: pick a partner who matches you for the rest of the game. 9 \u2014 Rhyme: say a word, go around rhyming until someone fails. 10 \u2014 Categories: name a category, go around naming items until someone fails."},{"h":"Face cards","b":"JACK \u2014 Never Have I Ever, or a new rule of your choosing. QUEEN \u2014 Question Master: anyone who answers your question takes the penalty, until the next Queen. KING \u2014 pour some of your drink into the center cup. The person who draws the FOURTH king drinks the whole thing and the game ends."},{"h":"House rules","b":"Everyone plays this differently and everyone insists their version is correct. Agree on the card list out loud before the first draw \u2014 it saves twenty minutes of arguing later."},{"h":"Playing it dry","b":"It works completely without alcohol: swap drinks for a silly forfeit, a point against you, a spoonful of something sour, or a push-up. The card prompts are the actual game."}],"variants":["Assign your own rules to each rank before you start \u2014 the fastest way to a fresh game.","'Jack = make a rule' is the most common house addition.","Play with a soft drink center cup so nobody has to finish anything serious."]},{"id":"kings-corner","name":"Kings in the Corner","aka":["Kings Corners"],"cat":"kids","players":[2,6],"best":"3-4","time":[15,30],"age":6,"diff":1,"needs":"1 standard 52-card deck","tags":["family","kids","easy-to-teach","solitaire-like","quiet"],"blurb":"Group solitaire. Build descending alternating-color stacks in a cross layout, and only Kings unlock the corners.","sections":[{"h":"Goal","b":"Be first to empty your hand. Play multiple rounds to a point total if you like."},{"h":"Setup","b":"Deal 7 cards to each player. Put the rest face down in the middle and flip four cards face up around it \u2014 one at each side, forming a cross."},{"h":"Play","b":"On your turn, draw one card, then make as many plays as you can. Play cards onto the four cross piles in DESCENDING rank and ALTERNATING colors (a red 9 goes on a black 10). You may also move an entire pile onto another pile if it fits the sequence, freeing that spot."},{"h":"The corners","b":"Only a King may start a pile in one of the four corner positions. Once a King is placed there, build down on it in alternating colors like any other pile."},{"h":"Ending","b":"First player to play their last card wins. Everyone else scores penalty points: 10 for each King left in hand, 1 for every other card. Lowest score after an agreed number of rounds wins."}],"variants":["Play to 25 penalty points as the game-ending threshold.","Allow a player to skip drawing if they can already play.","Deal 5 cards for a faster game with more players."]},{"id":"klondike","name":"Klondike Solitaire","aka":["Solitaire","Patience","Classic Solitaire"],"cat":"solitaire","players":[1,1],"best":"1","time":[10,20],"age":8,"diff":1,"needs":"1 standard 52-card deck","tags":["solo","classic","quiet","brain","one-player"],"blurb":"The one that came with your computer. Only about a third of deals are winnable, so losing isn't your fault.","sections":[{"h":"Goal","b":"Build all four suits up from Ace to King in the foundation piles."},{"h":"Setup","b":"Deal seven columns left to right: 1 card in the first, 2 in the second, up to 7 in the seventh. Only the top card of each column is face up. The remaining 24 cards form the stock."},{"h":"The tableau","b":"Build DOWN in alternating colors \u2014 a black 7 goes on a red 8. You may move a single card or an entire face-up sequence. When you move cards off a face-down card, flip it. Empty columns can only be filled by a King (or a sequence headed by a King)."},{"h":"The foundations","b":"Four piles above the tableau, one per suit, built UP from Ace to King. Aces go up as soon as they're available."},{"h":"The stock","b":"Turn cards from the stock to a waste pile \u2014 three at a time in the classic version (only the top one is playable), or one at a time for the easier version. You may typically go through the stock unlimited times when drawing three, or three times when drawing one."},{"h":"Winning","b":"All 52 cards on the foundations. Roughly 80% of deals are theoretically solvable with perfect play and perfect information, but only about 30-45% are won in practice with three-card draw."}],"variants":["Vegas scoring: pay 52 per deal, earn 5 per card on the foundations, limited stock passes.","Draw-one, unlimited passes for a much easier game.","Thoughtful Solitaire: all cards visible from the start, which turns it into a pure puzzle."]},{"id":"mafia","name":"Mafia","aka":["Assassin","Party Mafia"],"cat":"party","players":[7,20],"best":"10-14","time":[20,45],"age":12,"diff":2,"needs":"One card per player (to assign roles) and a moderator","tags":["party","big-group","social-deduction","bluffing","no-deck-needed","hidden-roles","talking"],"blurb":"A social deduction classic. The cards only assign secret roles \u2014 the actual game is the argument.","sections":[{"h":"Goal","b":"The town wins by eliminating every mafia member. The mafia wins when they equal or outnumber the town."},{"h":"Assigning roles with cards","b":"Pick one card per player. Face cards or a chosen suit are the mafia \u2014 a common split is 1 mafia per 3-4 players. For 10 players: 3 mafia (say, three Kings), 1 doctor (an Ace), 1 detective (a Queen), and 5 townspeople (number cards). Shuffle, deal one face down to each player, and have everyone peek without showing anyone."},{"h":"The moderator","b":"One person does NOT get a card \u2014 they run the game. They know every role, narrate the phases, and never lie about the rules (only about nothing). A good moderator makes or breaks this game."},{"h":"Night phase","b":"Moderator: 'Everyone close your eyes.' Then, in order: 'Mafia, open your eyes and agree on a victim.' (They point silently.) 'Mafia, close your eyes.' 'Doctor, open your eyes \u2014 who do you save?' 'Detective, open your eyes \u2014 who do you investigate?' The moderator gives the detective a silent thumbs up or down."},{"h":"Day phase","b":"'Everyone open your eyes.' The moderator announces who died in the night (or that the doctor saved them) and tells a short story about it. The dead player reveals their role and is out \u2014 no talking, no hinting. Then the town debates and votes to eliminate one person they suspect. Majority rules; the eliminated player reveals their card."},{"h":"Repeat","b":"Alternate night and day until one side wins."},{"h":"Moderator tips","b":"Set a talking time limit (3-5 minutes) so the day phase doesn't drag. Have a rule that dead players stay silent and don't react. Ask everyone to make noise during the night phase (tap the table) so the mafia's movement isn't audible."}],"variants":["Add roles: Vigilante (kills at night), Jester (wins if the town votes them out), Bodyguard, Serial Killer.","Mafia with no moderator using a card-based automated night phase.","'One Night' style: a single night and a single vote, for a 10-minute version."]},{"id":"memory","name":"Memory","aka":["Concentration","Pelmanism","Pairs","Match Match"],"cat":"kids","players":[1,8],"best":"2-4","time":[10,20],"age":3,"diff":1,"needs":"1 standard 52-card deck and table space","tags":["kids","family","memory","solo-friendly","quiet","brain"],"blurb":"Flip two, hope they match. The purest working-memory test in the deck, and small children routinely destroy adults at it.","sections":[{"h":"Goal","b":"Collect the most pairs."},{"h":"Setup","b":"Shuffle and lay all 52 cards face down in a grid. For young kids use only 20 or 24 cards (10-12 pairs)."},{"h":"Play","b":"On your turn, flip two cards face up so everyone can see them. If they match in rank, take the pair and go again. If they don't, turn them back face down in exactly the same spots and play passes left."},{"h":"Ending","b":"Play until the table is clear. Most pairs wins."}],"variants":["Match by rank AND color for a harder game.","Solo mode: clear the grid in as few flips as possible and try to beat your record.","Speed Memory: a timer runs and the pair count at time's up decides it."]},{"id":"nertz","name":"Nertz","aka":["Nerts","Pounce","Racing Demon","Peanuts"],"cat":"speed","players":[2,8],"best":"4","time":[20,40],"age":10,"diff":2,"needs":"One full deck per player, each with a DIFFERENT back design","tags":["chaotic","fast","loud","group","party","real-time"],"blurb":"Competitive multiplayer solitaire played all at once, at speed, with everyone shouting. Nobody takes turns.","sections":[{"h":"Goal","b":"First player to 100 points. Every player uses their own deck with a distinct back so cards can be sorted out later."},{"h":"Setup","b":"Each player shuffles their own deck and lays out: a 'Nertz pile' of 13 cards face down with the top one face up, plus 4 cards face up in a row (your work piles). The rest stays in your hand as your stock."},{"h":"Play \u2014 everyone at once","b":"There are no turns. Play as fast as you can. In the middle of the table, anyone may start a communal foundation pile by playing an Ace, then build UP on it in suit (A-2-3...K). Any player may play onto any foundation at any time."},{"h":"Your own tableau","b":"Your 4 work piles build DOWN in alternating colors, like Klondike. You can move whole sequences between work piles. Empty work piles must be refilled from your Nertz pile. Deal three cards at a time from your stock to a personal waste pile, playing the top card whenever it's useful."},{"h":"Calling Nertz","b":"The moment your Nertz pile is empty, slam your hand down and yell 'Nertz!' Play stops immediately, everywhere."},{"h":"Scoring","b":"Each player sorts the middle piles by card back and counts their own: +1 point per card played to the foundations, -2 points for every card still in your Nertz pile. The player who called Nertz gets a +10 bonus."}],"variants":["Team Nertz with partners sharing a score.","Play to 50 for a shorter game.","Solitaire Nertz: a single player racing a timer."]},{"id":"oh-hell","name":"Oh Hell","aka":["Oh Heck","Up and Down the River","Blackout","Nomination Whist"],"cat":"trick","players":[3,7],"best":"4-5","time":[30,50],"age":8,"diff":2,"needs":"1 standard 52-card deck, paper for scoring","tags":["strategy","classic","group","good-for-mixed-skill"],"blurb":"Bid exactly how many tricks you'll take \u2014 no more, no less. Hand sizes grow and shrink, and the dealer isn't allowed to make it easy.","sections":[{"h":"Goal","b":"Most points after the final hand. You only score by nailing your bid exactly."},{"h":"Setup","b":"Hand 1 deals 1 card each, hand 2 deals 2, and so on up to the maximum the deck allows, then back down to 1. (Shorter version: just go up, or just down.) After dealing, flip the next card to set trump; on the last hand where the deck runs out, play with no trump."},{"h":"Bidding","b":"Starting left of the dealer, everyone bids the number of tricks they will take, including 0. The dealer bids last and may NOT bid a number that makes the total bids equal the number of tricks available \u2014 so someone is always going to be wrong. That's the whole game."},{"h":"Play","b":"Left of dealer leads. Follow suit if you can, otherwise play anything. Highest trump wins, else highest card of the led suit."},{"h":"Scoring","b":"Hit your bid exactly: 10 points plus 1 per trick taken. Miss by any amount: 0 points (or in the harsher version, minus 1 per trick over or under). A successful bid of 0 scores 10."}],"variants":["Score 10 + tricks only on exact bids; some groups score 5 + tricks.","No-trump on every hand for a purer skill game.","Blind bidding: everyone bids simultaneously on a count of three."]},{"id":"old-maid","name":"Old Maid","aka":["Scabby Queen","Black Peter"],"cat":"kids","players":[2,8],"best":"3-5","time":[10,15],"age":4,"diff":1,"needs":"51 cards (remove one Queen)","tags":["kids","family","easy-to-teach","bluffing-lite","fast"],"blurb":"Pair everything up and pray you aren't stuck holding the odd Queen at the end.","sections":[{"h":"Goal","b":"Don't be the player left holding the unmatched Queen."},{"h":"Setup","b":"Remove one Queen from the deck (usually a black one), leaving 51 cards. Deal them all out; uneven hands are fine."},{"h":"Play","b":"Everyone starts by laying down any pairs they were dealt. Then, going clockwise, each player fans their cards face down and offers them to the player on their left, who draws one blindly. If it makes a pair, they lay it down."},{"h":"Ending","b":"Play continues until all pairs are laid down and one player is left holding the Old Maid. That player loses; everyone else wins."},{"h":"The real skill","b":"How you hold your fan. Wiggling the Old Maid, or leaving it slightly proud, is the entire game for children."}],"variants":["Remove an Ace or a Joker instead so the 'maid' is a different card.","Play with two odd cards for a bigger group.","Add a rule that the losing player deals the next hand."]},{"id":"palace","name":"Palace","aka":["Shithead","Karma","Idiot","Shed"],"cat":"shedding","players":[2,6],"best":"3-5","time":[15,30],"age":10,"diff":2,"needs":"1 deck (2 decks for 5+ players)","tags":["party","social","easy-to-teach","swingy","no-equipment"],"blurb":"You play from a hand, then from face-up cards, then blind from face-down cards. Special ranks flip the whole game sideways.","sections":[{"h":"Goal","b":"Be the first to get rid of all nine of your cards. The last player left is the loser (and deals next time)."},{"h":"Setup","b":"Deal each player 3 cards face down in a row \u2014 don't look at them. Then 3 more face up on top of those. Then 3 to their hand. Players may swap between their hand and their face-up row before play starts. Remaining cards form the draw pile."},{"h":"Play","b":"The player with the lowest card starts. Play a card equal to or higher than the top of the discard pile. You may play multiple cards of the SAME rank at once. After playing, draw back up to three cards while the draw pile lasts. If you can't play, pick up the entire discard pile and add it to your hand."},{"h":"Special cards","b":"2 \u2014 resets the pile; can be played on anything and the next player may play anything. 10 \u2014 burns the pile: the whole discard pile goes out of the game and the same player plays again. 7 \u2014 the next player must play a 7 or LOWER. (Some groups also use 8 as 'invisible' \u2014 the next player matches the card beneath it.)"},{"h":"Four in a row","b":"If four cards of the same rank end up stacked consecutively on the discard pile \u2014 from one play or several \u2014 the pile burns, exactly like a 10."},{"h":"The three stages","b":"Once the draw pile is gone and your hand is empty, you play from your 3 face-up cards. When those are gone, you play your 3 face-down cards blind, one at a time \u2014 flip it and hope. If it's too low, you pick up the pile and must clear your hand again before going back to the face-down cards."}],"variants":["Add jokers as an unbeatable 'pick up the pile' card for the next player.","Aces can be played on anything and reset the pile, like 2s.","Play with 4 or 5 cards in each row for a longer game."]},{"id":"pitch","name":"Pitch","aka":["Setback","High Low Jack","Auction Pitch"],"cat":"trick","players":[2,7],"best":"4","time":[30,45],"age":10,"diff":2,"needs":"1 standard 52-card deck, paper for scoring","tags":["strategy","classic","partners-optional","no-equipment"],"blurb":"Bid for the right to name trump by 'pitching' your lead card. Only four points exist each hand, so every one of them matters.","sections":[{"h":"Goal","b":"First to 11 points (or 21 for a longer game)."},{"h":"Setup","b":"Deal 6 cards to each player in packets of 3. Aces high."},{"h":"Bidding","b":"Starting left of the dealer, players bid 2, 3, or 4 (the number of points they'll take) or pass. Each bid must beat the last. The dealer may 'steal' a bid by matching it. The winner pitches \u2014 leads their first card, and that card's suit is trump."},{"h":"Play","b":"You must follow suit OR play trump \u2014 trump is always legal. If you can't follow suit and have no trump, play anything. Highest trump wins the trick, otherwise highest card of the led suit."},{"h":"The four points","b":"HIGH: the highest trump dealt, to whoever was dealt it. LOW: the lowest trump dealt, to whoever was dealt it. JACK: the Jack of trump, to whoever captures it in a trick (nobody scores if it wasn't dealt). GAME: total the card values you captured (A=4, K=3, Q=2, J=1, 10=10) and the highest total scores it."},{"h":"Scoring","b":"Everyone scores the points they earned. But if the bidder fails to make their bid, they SUBTRACT the amount they bid \u2014 that's the 'setback'. Going negative is normal and fine."}],"variants":["Partnership Pitch with 4 players in two teams.","10-point Pitch adds the 10 of trump and 3 of trump as scoring cards.","Smudge: bidding 4 and making it scores double."]},{"id":"poker-rankings","name":"Poker Hand Rankings","aka":["Hand Rankings","What Beats What"],"cat":"casino","players":[2,10],"best":"Any","time":[1,2],"age":8,"diff":1,"needs":"Nothing \u2014 this is a reference card","tags":["reference","poker","cheat-sheet"],"blurb":"What beats what, best to worst. Keep this open when you're teaching someone.","sections":[{"h":"1. Royal Flush","b":"A-K-Q-J-10, all the same suit. The best hand in poker and rarer than you think."},{"h":"2. Straight Flush","b":"Five cards in sequence, all one suit \u2014 like 8-7-6-5-4 of hearts."},{"h":"3. Four of a Kind","b":"Four cards of the same rank, plus one kicker."},{"h":"4. Full House","b":"Three of a kind plus a pair. Compare the trips first: 9-9-9-2-2 beats 8-8-8-A-A."},{"h":"5. Flush","b":"Five cards of the same suit, not in sequence. Compare highest card down."},{"h":"6. Straight","b":"Five cards in sequence, mixed suits. Aces play high (A-K-Q-J-10) or low (5-4-3-2-A), but never wrap around."},{"h":"7. Three of a Kind","b":"Three matching cards plus two kickers. Called a set or trips."},{"h":"8. Two Pair","b":"Two different pairs plus a kicker. Compare the higher pair first."},{"h":"9. One Pair","b":"Two matching cards plus three kickers."},{"h":"10. High Card","b":"Nothing at all. Ace-high beats King-high, and so on down."},{"h":"Ties","b":"Suits never break ties in standard poker. If two hands are identical in rank, the pot is split."}],"variants":["In lowball (razz, 2-7), the rankings are inverted and the worst hand wins.","With wild cards, five of a kind exists and beats a royal flush."]},{"id":"president","name":"President","aka":["Scum","Asshole","Daifugo","Landlord","Capitalism"],"cat":"shedding","players":[4,8],"best":"5-7","time":[20,45],"age":12,"diff":1,"needs":"1 standard 52-card deck","tags":["party","big-group","social","drinking-optional","easy-to-teach"],"blurb":"A brutal little climbing game with a social hierarchy attached. Win a hand and the loser hands you their best card next deal.","sections":[{"h":"Goal","b":"Shed your cards first and become President. Finish last and you're the Scum, who has to serve everyone."},{"h":"Card order","b":"2 is highest, then A, K, Q, J, 10, down to 3. Suits don't matter."},{"h":"Setup","b":"Deal the whole deck out as evenly as possible. On the first hand, whoever holds the 3 of clubs leads."},{"h":"Play","b":"The leader plays any single card, or a set of matching cards (a pair, a triple, four of a kind). Everyone after must play the SAME NUMBER of cards at a HIGHER rank, or pass. Once you pass you're out for that round. When everyone else passes, the last player to play clears the pile and leads a fresh one."},{"h":"Finishing order","b":"The first player out is President, second is Vice President, and so on down to Scum (last). Keep the order \u2014 it drives the next hand."},{"h":"The exchange","b":"After the first hand, before play begins: the Scum gives the President their two BEST cards, and the President gives back any two cards they don't want. The Vice Scum and Vice President exchange one card the same way. It's deeply unfair, which is the point."},{"h":"Seating and service","b":"Traditionally the President sits at the head of the table and the Scum shuffles and deals every hand."}],"variants":["Bombs: four of a kind (or a 2) can be played on anything to clear the pile immediately.","Completing a set of four in the pile clears it and the player who did it leads again.","Playing the exact same rank as the last play 'skips' the next player.","As a drinking game, the Scum drinks whenever the President tells them to."]},{"id":"pyramid","name":"Pyramid","aka":["Bluff Pyramid"],"cat":"party","players":[3,10],"best":"5-7","time":[15,30],"age":21,"diff":1,"needs":"1 standard deck, drinks or forfeits","tags":["party","drinking","bluffing","adults","fast","big-group"],"blurb":"A face-down pyramid, a hand of secret cards, and the freedom to lie about all of it.","sections":[{"h":"Setup","b":"Build a face-down pyramid in the middle: 5 cards across the bottom, then 4, 3, 2, and 1 on top. Deal 4 cards face down to each player \u2014 look at them but don't show anyone."},{"h":"Play","b":"Flip the pyramid cards one at a time, working from the bottom row up. When a card is revealed, any player may claim to hold a matching rank, lay a card face DOWN, and assign penalties: 1 for a bottom-row card, up to 5 for the top."},{"h":"Calling bluffs","b":"The person being penalized may call the bluff. Flip the played card: if it matches, the caller takes double. If it was a lie, the bluffer takes double. Either way the card is spent and the bluffer draws a replacement."},{"h":"Ending","b":"The game ends when the top card is flipped and resolved. Some groups then reveal all remaining hands for a final round of penalties."},{"h":"Playing it dry","b":"Use points instead of drinks \u2014 lowest total at the end wins. The bluffing works exactly the same."}],"variants":["Deal a bigger pyramid (6 rows) for a longer game.","Give every player 5 cards for more bluffing material.","'Truth pyramid': no bluffing allowed, pure luck, better for mixed groups."]},{"id":"pyramid-solitaire","name":"Pyramid Solitaire","aka":["Solitaire Thirteen"],"cat":"solitaire","players":[1,1],"best":"1","time":[5,15],"age":8,"diff":2,"needs":"1 standard 52-card deck","tags":["solo","quiet","fast","math","one-player"],"blurb":"Clear a pyramid by pairing cards that add up to 13. Short, tidy, and often unwinnable.","sections":[{"h":"Goal","b":"Remove all 28 cards from the pyramid."},{"h":"Setup","b":"Deal 28 cards face up in a pyramid: 1 card on top, then rows of 2, 3, 4, 5, 6, and 7, each row overlapping the one above. The remaining 24 cards are the stock."},{"h":"Card values","b":"Ace = 1, Jack = 11, Queen = 12, King = 13, everything else face value."},{"h":"Play","b":"Remove any pair of exposed cards totaling 13 \u2014 a 9 with a 4, a Queen wit
