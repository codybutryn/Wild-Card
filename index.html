/* =========================================================================
   Keeping the screen on. A rules page or a score pad is read at a table over
   minutes, not seconds, and a phone that sleeps mid-hand is the single most
   annoying thing this app can do. The lock is dropped the moment both close,
   and re-taken when the tab comes back, since the browser releases it on hide.
   Unsupported or refused is fine and silent -- it is a nicety, not a feature
   to apologise for.
   ========================================================================= */
let wakeLock = null;
const wantsWake = () =>
  $('#detail').classList.contains('open') || $('#scorepad').classList.contains('open');

async function syncWakeLock(){
  try{
    if(wantsWake() && !wakeLock && 'wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if(!wantsWake() && wakeLock){
      const l = wakeLock; wakeLock = null; await l.release();
    }
  }catch(e){ wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') syncWakeLock();
});

/* ---- sharing: the deep links already exist, this just hands one over ---- */
async function shareGame(id){
  const g = GAMES.find(x => x.id === id);
  if(!g) return;
  const url = location.origin + location.pathname + location.search + '#' + id;
  try{
    if(navigator.share){ await navigator.share({ title: g.name, text: g.blurb, url }); }
    else if(navigator.clipboard){ await navigator.clipboard.writeText(url); toast('Link copied'); }
    else toast(url);
  }catch(e){
    if(e && e.name !== 'AbortError') toast('Could not share');
  }
}

/* ---- detail view ---- */
let lastFocus = null;   // what to hand focus back to when the dialog closes
let pushes = 0;         // history entries this app pushed, so Back stays true

function openGame(id, fromPop){
  const g = GAMES.find(x => x.id === id);
  if(!g) return;
  $('#dBody').innerHTML = `
    <div class="dhead">
      <h2>${esc(g.name)}</h2>
      ${g.aka && g.aka.length ? `<p class="aka">also called ${g.aka.map(esc).join(' &middot; ')}</p>` : ''}
      <p class="blurb">${esc(g.blurb)}</p>
    </div>
    <div class="viewtoggle" id="dToggle">
      <button data-mode="cheat" aria-pressed="false">&#9889; Cheat sheet</button>
      <button data-mode="full" aria-pressed="false">&#9776; Full rules</button>
    </div>
    <div id="dContent"></div>
  `;
  const d = $('#detail');
  if(!d.classList.contains('open')) lastFocus = document.activeElement;
  d.dataset.id = id;
  d.classList.add('open');
  document.querySelectorAll('#dToggle button').forEach(b =>
    b.onclick = () => setDetailView(b.dataset.mode));
  setDetailView(g.cheat ? state.detailView : 'full');
  d.scrollTop = 0;
  syncDetailFav(id);
  $('#dScore').classList.toggle('hide', !scoreCfg(g));
  document.body.style.overflow = 'hidden';
  if(!fromPop && location.hash !== '#' + id){ history.pushState({ id }, '', '#' + id); pushes++; }
  $('#dBack').focus();
  syncWakeLock();
}

function syncDetailFav(id){
  const on = state.favs.has(id);
  const b = $('#dFav');
  b.innerHTML = on ? '&#9829; Saved' : '&#9825; Save';
  b.setAttribute('aria-pressed', on);
}

/* Closing is two jobs: tear the view down, and unwind the history entry we
   pushed on the way in. dismissDetail() is the user-facing one — it goes
   back, so the browser's own Back button stays in step. closeDetail() is the
   teardown, called directly only when there is no entry to unwind. */
function closeDetail(){
  const d = $('#detail');
  if(!d.classList.contains('open')) return;
  d.classList.remove('open');
  d.removeAttribute('data-id');
  if(!$('#scorepad').classList.contains('open')) document.body.style.overflow = '';
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
  syncWakeLock();
}

function dismissDetail(){
  if(pushes > 0){ history.back(); return; }   // popstate does the teardown
  if(location.hash) history.replaceState({}, '', location.pathname + location.search);
  closeDetail();
}

function trapFocus(e, root){
  const f = [...root.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(n => n.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

/* =========================================================================
   Swipe deck. Right = save, left = pass, up = full rules.
   Pointer events so one code path covers touch, pen and mouse.
   ========================================================================= */
const SW = { deck: [], history: [], card: null, drag: null, busy: false, settle: null };
const THRESH = 95;      // px before a swipe commits
const VTHRESH = 0.55;   // px/ms flick velocity that commits regardless of distance

function shuffled(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck(includeRated){
  SW.deck = shuffled(GAMES.filter(g =>
    includeRated || (!state.favs.has(g.id) && !state.passed.has(g.id))));
  SW.history = [];
  renderDeck();
}

function swipeCardEl(g){
  const node = el('article', 'scard');
  node.dataset.id = g.id;
  node.innerHTML =
    '<div class="art">' + artFor(g) + '</div>' +
    '<div class="sbody">' +
      '<h3>' + esc(g.name) + '</h3>' +
      (g.aka && g.aka.length ? '<p class="aka">also called ' + g.aka.map(esc).join(' &middot; ') + '</p>' : '<p class="aka"></p>') +
      '<div class="meta">' +
        '<span class="pill cat">' + esc(CATS[g.cat]) + '</span>' +
        '<span class="pill">' + playerLabel(g) + '</span>' +
        '<span class="pill">' + timeLabel(g) + '</span>' +
      '</div>' +
      '<p class="blurb">' + esc(g.blurb) + '</p>' +
      '<div class="hint">&#8593; swipe up for the full rules</div>' +
    '</div>' +
    '<div class="stamp like">SAVE</div>' +
    '<div class="stamp nope">PASS</div>' +
    '<div class="stamp up">RULES</div>';
  return node;
}

function renderDeck(){
  const stack = $('#swipeStack');
  stack.innerHTML = '';
  const rest = SW.deck.length;

  if(!rest){
    const rated = state.favs.size + state.passed.size;
    stack.innerHTML =
      '<div class="swipedone"><b>' + (rated ? "That's the whole deck" : 'Nothing to show') + '</b>' +
      (rated ? 'You\'ve been through every game — ' + state.favs.size + ' saved, ' +
               state.passed.size + ' passed on.' : '') +
      '<br><button id="swReset">Shuffle and go again</button></div>';
    const r = $('#swReset');
    if(r) r.onclick = () => buildDeck(true);
    $('#swipeCount').textContent = '';
    setSwipeBtns(false);
    return;
  }

  // render up to three for depth; index 0 is on top
  SW.deck.slice(0, 3).reverse().forEach((g, i, arr) => {
    const depth = arr.length - 1 - i;   // 0 = top
    const card = swipeCardEl(g);
    card.style.transform = 'scale(' + (1 - depth * 0.04) + ') translateY(' + (depth * 10) + 'px)';
    card.style.zIndex = 10 - depth;
    if(depth === 0){ SW.card = card; attachDrag(card); }
    stack.appendChild(card);
  });

  $('#swipeCount').textContent = rest + ' left in the deck';
  setSwipeBtns(true);
}

function setSwipeBtns(on){
  ['swNope','swInfo','swLike'].forEach(id => { $('#' + id).disabled = !on; });
  $('#swUndo').disabled = !SW.history.length;
}

function attachDrag(card){
  card.addEventListener('pointerdown', e => {
    if(e.button != null && e.button !== 0) return;
    card.setPointerCapture(e.pointerId);
    card.classList.remove('settle');
    SW.drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, t: performance.now() };
  });
  card.addEventListener('pointermove', e => {
    if(!SW.drag) return;
    SW.drag.dx = e.clientX - SW.drag.x;
    SW.drag.dy = e.clientY - SW.drag.y;
    paintDrag(card, SW.drag.dx, SW.drag.dy);
  });
  const end = e => {
    if(!SW.drag) return;
    const { dx, dy, t } = SW.drag;
    const dt = Math.max(1, performance.now() - t);
    SW.drag = null;
    const vx = Math.abs(dx) / dt, vy = Math.abs(dy) / dt;
    const up = dy < 0 && Math.abs(dy) > Math.abs(dx);

    if(up && (dy < -THRESH || vy > VTHRESH)){ resetCard(card); openGame(card.dataset.id); }
    else if(dx > THRESH || (dx > 30 && vx > VTHRESH)) commit('like');
    else if(dx < -THRESH || (dx < -30 && vx > VTHRESH)) commit('pass');
    else resetCard(card);
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

function paintDrag(card, dx, dy){
  const rot = dx / 16;
  card.style.transform = 'translate(' + dx + 'px,' + Math.min(dy, 40) + 'px) rotate(' + rot + 'deg)';
  const up = dy < 0 && Math.abs(dy) > Math.abs(dx);
  card.querySelector('.stamp.like').style.opacity = !up && dx > 0 ? Math.min(1, dx / THRESH) : 0;
  card.querySelector('.stamp.nope').style.opacity = !up && dx < 0 ? Math.min(1, -dx / THRESH) : 0;
  card.querySelector('.stamp.up').style.opacity   = up ? Math.min(1, -dy / THRESH) : 0;
}

function resetCard(card){
  card.classList.add('settle');
  card.style.transform = '';
  ['like','nope','up'].forEach(c => { card.querySelector('.stamp.' + c).style.opacity = 0; });
}

function commit(action){
  const g = SW.deck[0];
  if(!g || SW.busy) return;          // guard against double-taps mid-animation
  SW.busy = true;
  const card = SW.card;
  SW.history.push({ id: g.id, action });
  if(action === 'like'){ state.favs.add(g.id); state.passed.delete(g.id); }
  else { state.passed.add(g.id); state.favs.delete(g.id); }
  persistLists();

  card.classList.add('settle');
  card.style.transform = 'translate(' + (action === 'like' ? 460 : -460) + 'px,40px) rotate(' +
    (action === 'like' ? 26 : -26) + 'deg)';
  card.style.opacity = 0;
  // rebuilding 87 browse cards mid-flight makes the card stutter, and
  // nothing behind the deck is visible while it animates
  SW.settle = setTimeout(() => {
    SW.settle = null;
    SW.deck.shift(); SW.busy = false;
    renderDeck(); renderBrowse(); renderFavs();
  }, 260);

  toast(action === 'like' ? 'Saved to your list' : 'Passed');
}

function undoSwipe(){
  // A commit still in flight has not shifted the deck yet. Cancel its landing
  // rather than ignoring the tap, which would leave the button looking dead.
  if(SW.settle){ clearTimeout(SW.settle); SW.settle = null; SW.busy = false; }

  const last = SW.history.pop();
  if(!last) return;
  if(last.action === 'like') state.favs.delete(last.id); else state.passed.delete(last.id);
  persistLists();

  // only put the card back if the shift already ran; if we just cancelled it,
  // the card never left and unshifting would duplicate it
  const g = GAMES.find(x => x.id === last.id);
  if(g && SW.deck[0] !== g) SW.deck.unshift(g);

  renderDeck(); renderBrowse(); renderFavs();
  toast('Undone');
}

function persistLists(){
  store.set('dr:favs', [...state.favs]);
  store.set('dr:passed', [...state.passed]);
}

/* =========================================================================
   Score pad. Eleven games race to a target, and people currently track that
   on an envelope. One pad covers all of them: the differences that matter are
   the target, whether low or high wins, and whether you score as players or
   as teams -- all of which live in the game's `score` block.

   A game in progress is written to storage after every change, because it has
   to survive a locked phone, a browser tab eviction and a reload mid-hand.
   ========================================================================= */
const scoreCfg = g => g && g.score;
const SP = { input: [] };

function saveScore(){ store.set('dr:score', state.score); renderResumeBar(); }

function totals(){
  const s = state.score;
  return s.names.map((_, i) => s.rounds.reduce((sum, r) => sum + (r[i] || 0), 0));
}

/* Whoever is nearest the target -- which is the SMALLEST number when low
   wins. Returns every index sharing the best score, so a tie reads as a tie
   instead of silently crowning whoever happens to sit first. Empty until
   somebody has actually scored. */
function bestIndices(){
  const t = totals();
  if(!t.length || t.every(v => v === 0)) return [];
  const best = state.score.dir === 'low' ? Math.min(...t) : Math.max(...t);
  return t.reduce((acc, v, i) => (v === best && acc.push(i), acc), []);
}

/* Who has actually won, if anyone. A low-wins game ends when SOMEONE crosses
   the target, and the winner is then the lowest score on the table, not the
   player who crossed it. */
function winners(){
  const s = state.score, t = totals();
  if(!s.rounds.length) return [];
  if(!t.some(v => v >= s.to)) return [];
  return bestIndices();
}

function nameList(idx){
  const n = idx.map(i => state.score.names[i]);
  return n.length < 2 ? (n[0] || '') : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
}

function openScore(id, fromPop){
  const g = GAMES.find(x => x.id === id);
  if(!scoreCfg(g)) return;
  const sp = $('#scorepad');
  if(!sp.classList.contains('open')) lastFocus = document.activeElement;
  $('#spTitle').textContent = g.name;
  sp.dataset.id = id;
  sp.classList.add('open');
  sp.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  if(state.score && state.score.id === id) renderScorePad(); else renderScoreSetup(g);
  if(!fromPop){ history.pushState({ score: id }, '', location.hash || ('#' + id)); pushes++; }
  syncWakeLock();
}

function closeScore(){
  const sp = $('#scorepad');
  if(!sp.classList.contains('open')) return;
  sp.classList.remove('open');
  sp.removeAttribute('data-id');
  if(!$('#detail').classList.contains('open')) document.body.style.overflow = '';
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
  syncWakeLock();
  renderResumeBar();
}

function dismissScore(){
  if(pushes > 0){ history.back(); return; }
  closeScore();
}

/* --- setup: how many, called what, playing to what --------------------- */
function renderScoreSetup(g){
  const cfg = scoreCfg(g);
  const unit = cfg.unit === 'team' ? 'team' : 'player';
  const count = unit === 'team' ? 2 : Math.min(Math.max(g.players[0], 4), g.players[1]);
  $('#spEnd').classList.add('hide');

  const body = $('#spBody');
  body.innerHTML = `
    <div class="spsetup">
      ${cfg.note ? `<p class="spnote">${esc(cfg.note)}</p>` : ''}
      <div class="field">
        <label class="hd">Scoring by</label>
        <div class="seg" id="spUnit">
          <button data-u="player" aria-pressed="${unit === 'player'}">Players</button>
          <button data-u="team" aria-pressed="${unit === 'team'}">Teams</button>
        </div>
      </div>
      <div class="field">
        <label class="hd">How many</label>
        <div class="stepper">
          <button id="spMinus" aria-label="Fewer">&minus;</button>
          <div class="val"><span id="spCount">${count}</span><small id="spUnitWord">${unit}s</small></div>
          <button id="spPlus" aria-label="More">+</button>
        </div>
      </div>
      <div class="field" id="spNames"></div>
      <div class="field">
        <label class="hd">Playing to</label>
        <div class="sprow"><label>Target score</label><input id="spTo" type="number" inputmode="numeric" value="${cfg.to}"></div>
      </div>
      <button class="bigbtn" id="spStart">Start scoring</button>
    </div>`;

  const st = { unit, count };
  const bounds = () => st.unit === 'team' ? [2, 4] : [g.players[0], Math.max(g.players[1], 2)];

  const names = () => {
    const box = $('#spNames');
    box.innerHTML = '<label class="hd">Names</label>';
    for(let i = 0; i < st.count; i++){
      const row = el('div', 'sprow');
      row.innerHTML = `<input type="text" id="spName${i}" placeholder="${st.unit === 'team' ? 'Team ' : 'Player '}${i + 1}" autocomplete="off">`;
      box.appendChild(row);
    }
  };
  const sync = () => {
    const [lo, hi] = bounds();
    st.count = Math.min(hi, Math.max(lo, st.count));
    $('#spCount').textContent = st.count;
    $('#spUnitWord').textContent = st.unit + 's';
    $('#spMinus').disabled = st.count <= lo;
    $('#spPlus').disabled = st.count >= hi;
    document.querySelectorAll('#spUnit button').forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.u === st.unit));
    names();
  };

  document.querySelectorAll('#spUnit button').forEach(b => b.onclick = () => {
    st.unit = b.dataset.u;
    st.count = st.unit === 'team' ? 2 : Math.max(g.players[0], 3);
    sync();
  });
  $('#spMinus').onclick = () => { st.count--; sync(); };
  $('#spPlus').onclick  = () => { st.count++; sync(); };
  sync();

  $('#spStart').onclick = () => {
    const to = Math.abs(parseInt($('#spTo').value, 10)) || cfg.to;
    const names = [];
    for(let i = 0; i < st.count; i++){
      const v = ($('#spName' + i).value || '').trim();
      names.push(v || (st.unit === 'team' ? 'Team ' : 'Player ') + (i + 1));
    }
    state.score = { id: g.id, unit: st.unit, dir: cfg.dir || 'high', to, names, rounds: [] };
    saveScore();
    renderScorePad();
  };
}

/* --- the pad ----------------------------------------------------------- */
function renderScorePad(){
  const s = state.score;
  const g = GAMES.find(x => x.id === s.id);
  const t = totals();
  const lead = bestIndices();
  const won = winners();
  $('#spEnd').classList.remove('hide');

  const togo = i => s.dir === 'low' ? '' : Math.max(0, s.to - t[i]) + ' to go';

  const head = s.names.map((n, i) =>
    `<div class="tot${lead.includes(i) && !won.length ? ' lead' : ''}">
       <div class="who">${esc(n)}</div>
       <div class="num">${t[i]}</div>
       <div class="togo">${togo(i)}</div>
     </div>`).join('');

  const rows = s.rounds.map((r, ri) =>
    `<tr><td>${ri + 1}</td>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('');

  $('#spBody').innerHTML = `
    ${won.length ? `<div class="spwon"><b>${esc(nameList(won))} ${won.length > 1 ? 'tie' : 'wins'}</b>
        ${s.dir === 'low' ? 'Someone crossed ' + s.to + ', and that is the lowest score on the table.'
                          : 'First past ' + s.to + '.'}</div>` : ''}
    <div class="sptotals">${head}</div>
    <div class="spstate">${won.length ? 'Game over — start another from the game page.'
      : `Playing to <b>${s.to}</b>, ${s.dir === 'low' ? 'lowest' : 'highest'} wins${s.rounds.length ? ' · round ' + (s.rounds.length + 1) : ''}`}</div>
    ${g && g.score && g.score.note ? `<p class="spnote">${esc(g.score.note)}</p>` : ''}
    ${s.rounds.length ? `<div class="sphist"><table>
      <thead><tr><th>#</th>${s.names.map(n => `<th>${esc(n)}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table></div>` : ''}
    ${won.length ? '' : `<div class="spentry">
      <h4>Round ${s.rounds.length + 1}</h4>
      ${s.names.map((n, i) => `<div class="sprow"><label for="spIn${i}">${esc(n)}</label>
        <input id="spIn${i}" type="number" inputmode="numeric" step="1" placeholder="0"></div>`).join('')}
      <button class="bigbtn" id="spAdd">Add round</button>
    </div>`}
    ${s.rounds.length ? '<button class="bigbtn ghost" id="spUndo">Undo last round</button>' : ''}`;

  const add = $('#spAdd');
  if(add){
    // enter moves down the column, and commits on the last field
    s.names.forEach((_, i) => {
      const inp = $('#spIn' + i);
      inp.onkeydown = e => {
        if(e.key !== 'Enter') return;
        e.preventDefault();
        const next = $('#spIn' + (i + 1));
        if(next) next.focus(); else add.click();
      };
    });
    add.onclick = () => {
      const vals = s.names.map((_, i) => {
        const raw = ($('#spIn' + i).value || '').trim();
        return raw === '' ? 0 : Math.round(Number(raw)) || 0;
      });
      s.rounds.push(vals);
      saveScore();
      renderScorePad();
      const first = $('#spIn0');
      if(first) first.focus();
    };
  }
  const undo = $('#spUndo');
  if(undo) undo.onclick = () => {
    if(!s.rounds.length) return;
    s.rounds.pop();
    saveScore();
    renderScorePad();
    toast('Round removed');
  };
}

function endScoreGame(){
  state.score = null;
  saveScore();
  const id = $('#scorepad').dataset.id;
  const g = GAMES.find(x => x.id === id);
  if(g) renderScoreSetup(g);
  toast('Score cleared');
}

/* A game in progress is easy to lose track of, so say so wherever you are. */
function renderResumeBar(){
  const bar = $('#resumeBar');
  const s = state.score;
  if(!s || $('#scorepad').classList.contains('open')){ bar.classList.add('hide'); return; }
  const g = GAMES.find(x => x.id === s.id);
  if(!g){ bar.classList.add('hide'); return; }
  const t = totals();
  const lead = bestIndices();
  bar.innerHTML = `<span>Scoring <b>${esc(g.name)}</b> · `
    + (s.rounds.length
        ? `round ${s.rounds.length + 1}`
          + (lead.length === 1 ? ', ' + esc(s.names[lead[0]]) + ' ahead on ' + t[lead[0]]
             : lead.length ? ', tied on ' + t[lead[0]] : '')
        : 'not started')
    + `</span><span class="go">Resume</span>`;
  bar.classList.remove('hide');
  bar.onclick = () => openScore(s.id);
}

/* ---- picker ---- */
function renderPickerControls(){
  $('#pVal').textContent = state.pick.players;
  $('#pMinus').disabled = state.pick.players <= 1;
  $('#pPlus').disabled = state.pick.players >= MAX_PLAYERS;

  const ts = $('#timeSeg'); ts.innerHTML = '';
  TIME_OPTS.forEach(o => {
    const b = el('button', null, o.label);
    b.setAttribute('aria-pressed', state.pick.time === o.id);
    b.onclick = () => { state.pick.time = o.id; updatePick(); };
    ts.appendChild(b);
  });

  const vs = $('#vibeSeg'); vs.innerHTML = '';
  VIBES.forEach(v => {
    const b = el('button', null, v.label);
    b.setAttribute('aria-pressed', state.pick.vibes.has(v.id));
    b.onclick = () => {
      state.pick.vibes.has(v.id) ? state.pick.vibes.delete(v.id) : state.pick.vibes.add(v.id);
      updatePick();
    };
    vs.appendChild(b);
  });
}

function savePick(){
  store.set('dr:pick', { players: state.pick.players, time: state.pick.time, vibes: [...state.pick.vibes] });
}

/* Once a list is on screen it has to keep up with the controls. Leaving it
   stale under changed inputs reads as the app ignoring you. */
function updatePick(){
  savePick();
  renderPickerControls();
  if(state.pickResults) runPicker();
}

function pickResults(){
  const { players, time, vibes } = state.pick;
  return GAMES.filter(g => {
    if(players < g.players[0] || players > g.players[1]) return false;
    if(!fitsTime(g, time)) return false;
    if(vibes.size){
      const active = VIBES.filter(v => vibes.has(v.id));
      if(!active.some(v => v.test(g))) return false;
    }
    return true;
  }).sort((a, b) => {
    // closest to the sweet spot first, then shorter games
    const fit = g => Math.abs(((g.players[0] + g.players[1]) / 2) - players);
    return fit(a) - fit(b) || a.time[0] - b.time[0];
  });
}

/* Name the one control that is actually blocking, rather than listing
   everything the reader could try. */
function pickEmptyMessage(){
  const { players, time } = state.pick;
  const seats = GAMES.filter(g => players >= g.players[0] && players <= g.players[1]);
  if(!seats.length)
    return `<b>Nothing seats ${players}</b>No game here takes a table that size. Try fewer players.`;
  if(!seats.some(g => fitsTime(g, time))){
    const soonest = Math.min(...seats.map(g => Math.round((g.time[0] + g.time[1]) / 2)));
    return `<b>Nothing that short for ${players}</b>The quickest game for this many runs about ${soonest} minutes. Try more time.`;
  }
  return '<b>No match for that kind of night</b>There are games for this table at this length, but none of them fit every vibe you picked. Try dropping one.';
}

function runPicker(){
  const r = pickResults();
  state.pickResults = r;
  renderList($('#pickList'), r, pickEmptyMessage());
  $('#pickCount').textContent = r.length
    ? `${r.length} game${r.length === 1 ? '' : 's'} work for ${state.pick.players} player${state.pick.players === 1 ? '' : 's'}`
    : '';
}

/* ---- tabs ---- */
function setTab(tab){
  state.tab = tab;
  ['browse','swipe','picker','favs'].forEach(t => $('#view-' + t).classList.toggle('hide', t !== tab));
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  $('#searchWrap').classList.toggle('hide', tab !== 'browse');
  $('#catRow').classList.toggle('hide', tab !== 'browse');
  if(tab === 'favs') renderFavs();
  if(tab === 'picker') renderPickerControls();
  if(tab === 'swipe' && !SW.deck.length && !$('#swipeStack').querySelector('.swipedone')) buildDeck(false);
  window.scrollTo(0, 0);
}

/* ---- wire it up ---- */
$('#q').addEventListener('input', e => {
  state.q = e.target.value.trim();
  $('#searchWrap').classList.toggle('has', !!state.q);
  renderBrowse();
});
$('#clearQ').onclick = () => { $('#q').value = ''; state.q = ''; $('#searchWrap').classList.remove('has'); renderBrowse(); $('#q').focus(); };
$('#resetFilters').onclick = () => { state.cat = null; state.q = ''; $('#q').value = ''; $('#searchWrap').classList.remove('has'); renderCats(); renderBrowse(); };
$('#dBack').onclick = dismissDetail;
$('#pMinus').onclick = () => { state.pick.players = Math.max(1, state.pick.players - 1); updatePick(); };
$('#pPlus').onclick  = () => { state.pick.players = Math.min(MAX_PLAYERS, state.pick.players + 1); updatePick(); };
$('#pickGo').onclick = runPicker;
$('#pickRandom').onclick = () => {
  const r = pickResults();
  if(!r.length){ runPicker(); return; }
  openGame(r[Math.floor(Math.random() * r.length)].id);
};
$('#dFav').onclick = () => toggleFav($('#detail').dataset.id);
$('#dShare').onclick = () => shareGame($('#detail').dataset.id);
$('#dScore').onclick = () => openScore($('#detail').dataset.id);
$('#spBack').onclick = dismissScore;
$('#spEnd').onclick = endScoreGame;
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

/* swipe controls */
$('#swLike').onclick = () => commit('like');
$('#swNope').onclick = () => commit('pass');
$('#swInfo').onclick = () => { if(SW.deck[0]) openGame(SW.deck[0].id); };
$('#swUndo').onclick = undoSwipe;

/* saved / not-for-us */
$('#tabSaved').onclick  = () => { state.favView = 'saved';  renderFavs(); };
$('#tabPassed').onclick = () => { state.favView = 'passed'; renderFavs(); };
$('#clearPassed').onclick = () => {
  state.passed.clear(); persistLists(); renderFavs(); renderBrowse();
  toast('Cleared');
};

document.addEventListener('keydown', e => {
  const sp = $('#scorepad');
  if(sp.classList.contains('open')){         // the pad sits above everything
    if(e.key === 'Escape') dismissScore();
    else if(e.key === 'Tab') trapFocus(e, sp);
    return;
  }
  const d = $('#detail');
  if(d.classList.contains('open')){          // the dialog owns the keyboard
    if(e.key === 'Escape') dismissDetail();
    else if(e.key === 'Tab') trapFocus(e, d);
    return;                                  // and nothing reaches the deck
  }
  if(e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); setTab('browse'); $('#q').focus(); }
  if(state.tab === 'swipe'){
    if(e.key === 'ArrowRight') commit('like');
    if(e.key === 'ArrowLeft')  commit('pass');
    if(e.key === 'ArrowUp' && SW.deck[0]){ e.preventDefault(); openGame(SW.deck[0].id); }
    if(e.key === 'z' && (e.metaKey || e.ctrlKey)) undoSwipe();
  }
});
window.addEventListener('popstate', () => {
  if(pushes > 0) pushes--;
  if($('#scorepad').classList.contains('open')){ closeScore(); return; }
  const id = location.hash.slice(1);
  if(id && GAMES.some(g => g.id === id)) openGame(id, true); else closeDetail();
});

/* ---- boot ---- */
GAMES.sort((a, b) => a.name.localeCompare(b.name));
$('#gcount').textContent = GAMES.length + ' games';
renderCats(); renderBrowse(); renderPickerControls(); renderResumeBar();
if(location.hash.slice(1)) openGame(location.hash.slice(1));

/* ---- offline: only when actually served over http(s) ---- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
