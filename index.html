<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1411">
<meta name="description" content="Rules and directions for every card game — plus party games you only need a deck to run.">
<title>Deck &amp; Rules — every card game, one app</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230d1411'/><text y='72' x='50' font-size='62' text-anchor='middle' fill='%23e8e3d5'>&#9824;</text></svg>">
<style>
:root{
  --bg:#0d1411; --bg-2:#121b17; --card:#16211c; --card-2:#1c2a23;
  --line:#25352c; --line-2:#31463a;
  --ink:#eee9dc; --ink-dim:#a3b0a6; --ink-faint:#6f7d73;
  --felt:#2f9e68; --felt-deep:#1d6b46; --gold:#d9b26a; --red:#d7605f;
  --radius:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--felt)}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
header.top{
  position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 72%,rgba(13,20,17,0));
  padding:14px 0 10px;
}
.brand{display:flex;align-items:baseline;gap:10px;padding:2px 0 12px}
.brand h1{font-family:var(--serif);font-size:23px;letter-spacing:.2px;margin:0;font-weight:600}
.brand .suits{font-size:15px;letter-spacing:2px;color:var(--ink-faint)}
.brand .suits .r{color:#d7605f}
.brand small{margin-left:auto;color:var(--ink-faint);font-size:12px}

.search{position:relative}
.search input{
  width:100%;padding:13px 42px 13px 40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);outline:none;font-size:16px;
}
.search input:focus{border-color:var(--line-2);background:var(--card-2)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--ink-faint);padding:6px 8px;font-size:18px;display:none}
.search.has .clear{display:block}

/* ---------- filter chips ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-dim);font-size:13.5px;white-space:nowrap;transition:.12s;
}
.chip[aria-pressed="true"]{background:var(--felt-deep);border-color:var(--felt);color:#fff}
.chip.reset{border-style:dashed;color:var(--ink-faint)}

.countline{color:var(--ink-faint);font-size:12.5px;padding:10px 2px 6px;display:flex;align-items:center;gap:10px}
.countline button{color:var(--felt);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- game list ---------- */
.list{display:grid;gap:10px}
.gcard{
  position:relative;display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 46px 14px 15px;transition:.12s;
}
.gcard:active{transform:scale(.994)}
.gcard:hover{border-color:var(--line-2);background:var(--card-2)}
.gcard h3{margin:0 0 3px;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.2px}
.gcard .aka{color:var(--ink-faint);font-size:12px;margin:0 0 6px}
.gcard p.blurb{margin:0 0 9px;color:var(--ink-dim);font-size:14px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11.5px;padding:3px 8px;border-radius:6px;background:#0f1a15;border:1px solid var(--line);color:var(--ink-dim)}
.pill.cat{color:var(--gold);border-color:#3a3320;background:#1a1710}
.fav{
  position:absolute;top:10px;right:8px;padding:8px;font-size:18px;line-height:1;color:var(--ink-faint);
}
.fav[aria-pressed="true"]{color:#d76a6a}

.empty{text-align:center;color:var(--ink-faint);padding:48px 20px;font-size:14.5px}
.empty b{display:block;color:var(--ink-dim);font-family:var(--serif);font-size:18px;margin-bottom:6px}

/* ---------- picker ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel h2{font-family:var(--serif);font-size:17px;margin:0 0 3px;font-weight:600}
.panel .sub{color:var(--ink-faint);font-size:13px;margin:0 0 14px}
.field{margin-bottom:16px}
.field > label{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{
  width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card-2);
  font-size:21px;display:grid;place-items:center;color:var(--ink)
}
.stepper button:disabled{opacity:.3}
.stepper .val{font-family:var(--serif);font-size:26px;min-width:78px;text-align:center}
.stepper .val small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);
  font-size:14px;color:var(--ink-dim)
}
.seg button[aria-pressed="true"]{background:var(--felt-deep);border-color:var(--felt);color:#fff}
.bigbtn{
  width:100%;padding:15px;border-radius:12px;background:var(--felt);color:#06140d;font-weight:650;
  font-size:15.5px;letter-spacing:.2px
}
.bigbtn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink);font-weight:500;margin-top:9px}

/* ---------- detail ---------- */
.detail{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;
  animation:slideup .22s cubic-bezier(.2,.8,.3,1)}
.detail.open{display:block}
@keyframes slideup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.dbar{position:sticky;top:0;background:rgba(13,20,17,.94);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:10px 12px;z-index:2}
.dbar button{padding:8px 10px;border-radius:9px;color:var(--ink-dim);font-size:14px}
.dbar .back{color:var(--felt);font-weight:600}
.dbar .sp{flex:1}
.dwrap{max-width:760px;margin:0 auto;padding:18px 16px 80px}
.dhead h2{font-family:var(--serif);font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:600}
.dhead .aka{color:var(--ink-faint);font-size:13px;margin:0 0 10px}
.dhead .blurb{color:var(--ink-dim);font-size:15.5px;margin:0 0 16px;line-height:1.5}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--card);padding:11px 8px}
.stat b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;
  overflow-wrap:break-word}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint)}
.needs{background:#141d18;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;
  padding:11px 13px;margin-bottom:22px;font-size:14px;color:var(--ink-dim)}
.needs b{color:var(--ink);font-weight:600}
section.rule{margin-bottom:20px}
section.rule h4{font-family:var(--serif);font-size:17.5px;margin:0 0 6px;font-weight:600;color:#fff}
section.rule p{margin:0;color:var(--ink-dim);font-size:15px;line-height:1.62}
.varbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-top:26px}
.varbox h4{font-family:var(--serif);font-size:16px;margin:0 0 9px;font-weight:600}
.varbox ul{margin:0;padding-left:19px;color:var(--ink-dim);font-size:14.5px}
.varbox li{margin-bottom:7px;line-height:1.5}
.related{margin-top:26px}
.related h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin:0 0 9px}

/* ---------- cheat sheet ---------- */
.viewtoggle{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:4px;margin-bottom:20px}
.viewtoggle button{flex:1;padding:8px;border-radius:8px;color:var(--ink-faint);font-size:13.5px}
.viewtoggle button[aria-pressed="true"]{background:var(--card-2);color:var(--ink);font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.cheat{animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cheatrow{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:10px}
.cheatrow h5{margin:0 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-faint);font-weight:600}
.cheatrow p{margin:0;font-size:15.5px;line-height:1.45;color:var(--ink)}
.cheatrow.gotcha{border-left:3px solid var(--gold);background:#1a1710}
.cheatrow.gotcha h5{color:var(--gold)}
.keygrid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;margin-bottom:10px}
.keygrid div{background:var(--card);padding:10px 14px;font-size:14.5px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums}
.keygrid div b{color:var(--ink);font-weight:600}
.cheatfoot{color:var(--ink-faint);font-size:12.5px;text-align:center;padding:14px 0 0}
.cheatfoot button{color:var(--felt);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- swipe deck ---------- */
.swipewrap{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.swipestack{position:relative;width:100%;max-width:400px;height:min(66vh,540px);margin-bottom:14px}
.scard{
  position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:20px;
  overflow:hidden;display:flex;flex-direction:column;will-change:transform;touch-action:none;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.85);user-select:none;-webkit-user-select:none;
}
.scard.settle{transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s}
.scard .art{flex:0 0 52%;position:relative;background:#0b120e}
.scard .art svg{display:block;width:100%;height:100%}
.scard .art img{display:block;width:100%;height:100%;object-fit:cover}
.scard .art::after{content:'';position:absolute;inset:auto 0 0 0;height:56px;
  background:linear-gradient(180deg,rgba(22,33,28,0),var(--card))}
.sbody{flex:1;padding:2px 18px 16px;display:flex;flex-direction:column;min-height:0}
.sbody h3{font-family:var(--serif);font-size:25px;margin:0 0 3px;font-weight:600;line-height:1.15}
.sbody .aka{color:var(--ink-faint);font-size:11.5px;margin:0 0 9px}
.sbody .meta{margin-bottom:10px}
.sbody .blurb{color:var(--ink-dim);font-size:14.5px;line-height:1.5;margin:0;overflow:hidden}
.sbody .hint{margin-top:auto;padding-top:10px;color:var(--ink-faint);font-size:12px;text-align:center;
  letter-spacing:.03em}
.stamp{
  position:absolute;top:22px;padding:6px 14px;border-radius:9px;font-weight:800;font-size:19px;
  letter-spacing:.09em;border:3px solid;opacity:0;pointer-events:none;
}
/* stamps sit on the trailing edge so they stay on screen as the card flies off */
.stamp.like{left:18px;color:#4ad48c;border-color:#4ad48c;transform:rotate(-14deg)}
.stamp.nope{right:18px;color:#e0716f;border-color:#e0716f;transform:rotate(14deg)}
.stamp.up{left:50%;top:auto;bottom:26px;margin-left:-58px;color:var(--gold);border-color:var(--gold);
  transform:none;font-size:15px}
.swipebtns{display:flex;align-items:center;justify-content:center;gap:14px}
.swipebtns button{
  width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:22px;color:var(--ink-dim);transition:.12s
}
.swipebtns button:active{transform:scale(.92)}
.swipebtns button.sm{width:44px;height:44px;font-size:16px}
.swipebtns .nope{color:#e0716f;border-color:#4a2b2b}
.swipebtns .like{color:#4ad48c;border-color:#26452f}
.swipebtns .info{color:var(--gold);border-color:#3f3722}
.swipebtns button:disabled{opacity:.32}
.swipedone{text-align:center;padding:40px 24px;color:var(--ink-faint);font-size:14.5px}
.swipedone b{display:block;font-family:var(--serif);font-size:21px;color:var(--ink-dim);margin-bottom:8px}
.swipedone button{margin-top:16px;padding:11px 20px;border-radius:11px;border:1px solid var(--line-2);
  color:var(--ink);font-size:14px}
.swipecount{color:var(--ink-faint);font-size:12px;text-align:center;padding:12px 0 0}

/* ---------- saved / not-for-us toggle ---------- */
.segbar{display:flex;gap:8px;padding:2px 0 4px}
.segbar button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-dim);font-size:13.5px}
.segbar button[aria-pressed="true"]{background:var(--felt-deep);border-color:var(--felt);color:#fff}

/* ---------- tab bar ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(13,20,17,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{flex:1;padding:11px 4px 12px;color:var(--ink-faint);font-size:10.5px;letter-spacing:.05em;
  display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase}
nav.tabs button .i{font-size:19px;line-height:1}
nav.tabs button[aria-pressed="true"]{color:var(--felt)}
.hide{display:none !important}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(10px);background:var(--card-2);
  border:1px solid var(--line-2);color:var(--ink);padding:9px 15px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.22s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (min-width:720px){
  .list{grid-template-columns:1fr 1fr}
  .brand h1{font-size:26px}
}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="wrap" style="padding-bottom:0">
      <div class="brand">
        <h1>Deck &amp; Rules</h1>
        <span class="suits"><span class="r">&#9829;</span>&#9824;<span class="r">&#9830;</span>&#9827;</span>
        <small id="gcount"></small>
      </div>
      <div class="search" id="searchWrap">
        <span class="ico">&#9906;</span>
        <input id="q" type="search" placeholder="Search games, e.g. euchre, mafia, 4 players" autocomplete="off" spellcheck="false">
        <button class="clear" id="clearQ" aria-label="Clear search">&times;</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- BROWSE -->
    <div id="view-browse">
      <div class="chiprow" id="catRow"></div>
      <div class="countline">
        <span id="resultCount"></span>
        <button id="resetFilters" class="hide">Clear filters</button>
      </div>
      <div class="list" id="list"></div>
    </div>

    <!-- SWIPE / DISCOVER -->
    <div id="view-swipe" class="hide">
      <div class="swipewrap">
        <div class="swipestack" id="swipeStack"></div>
        <div class="swipebtns" id="swipeBtns">
          <button class="sm" id="swUndo" title="Undo" aria-label="Undo last swipe">&#8630;</button>
          <button class="nope" id="swNope" title="Pass" aria-label="Pass on this game">&#10005;</button>
          <button class="info" id="swInfo" title="Rules" aria-label="Read the rules">&#8593;</button>
          <button class="like" id="swLike" title="Save" aria-label="Save this game">&#9829;</button>
        </div>
        <div class="swipecount" id="swipeCount"></div>
      </div>
    </div>

    <!-- PICKER -->
    <div id="view-picker" class="hide">
      <div class="panel">
        <h2>What can we play?</h2>
        <p class="sub">Tell me the table and I'll shortlist what actually works.</p>

        <div class="field">
          <label>How many people</label>
          <div class="stepper">
            <button id="pMinus" aria-label="Fewer players">&minus;</button>
            <div class="val"><span id="pVal">4</span><small>players</small></div>
            <button id="pPlus" aria-label="More players">+</button>
          </div>
        </div>

        <div class="field">
          <label>How much time</label>
          <div class="seg" id="timeSeg"></div>
        </div>

        <div class="field">
          <label>What kind of night</label>
          <div class="seg" id="vibeSeg"></div>
        </div>

        <button class="bigbtn" id="pickGo">Show me the list</button>
        <button class="bigbtn ghost" id="pickRandom">Just pick one for us</button>
      </div>
      <div class="countline"><span id="pickCount"></span></div>
      <div class="list" id="pickList"></div>
    </div>

    <!-- FAVORITES -->
    <div id="view-favs" class="hide">
      <div class="segbar">
        <button id="tabSaved" aria-pressed="true">&#9829; Saved</button>
        <button id="tabPassed" aria-pressed="false">&#10005; Not for us</button>
      </div>
      <div class="countline">
        <span id="favCount"></span>
        <button id="clearPassed" class="hide">Clear all</button>
      </div>
      <div class="list" id="favList"></div>
    </div>
  </main>

  <nav class="tabs">
    <button data-tab="browse" aria-pressed="true"><span class="i">&#9776;</span>Browse</button>
    <button data-tab="swipe" aria-pressed="false"><span class="i">&#9824;</span>Discover</button>
    <button data-tab="picker" aria-pressed="false"><span class="i">&#9819;</span>Pick</button>
    <button data-tab="favs" aria-pressed="false"><span class="i">&#9829;</span>Saved</button>
  </nav>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true">
  <div class="dbar">
    <button class="back" id="dBack">&larr; Back</button>
    <span class="sp"></span>
    <button id="dFav" aria-pressed="false">&#9825; Save</button>
  </div>
  <div class="dwrap" id="dBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Deck & Rules — a single-file rules reference for card games.
   Data lives in GAMES below; the app is plain DOM, no dependencies.
   ========================================================================= */
const GAMES = [{"id":"accordion","name":"Accordion","aka":["Idle Year","Methuselah","Tower of Babel"],"cat":"solitaire","players":[1,1],"best":"1","time":[10,20],"age":8,"diff":2,"needs":"1 standard 52-card deck","tags":["solo","quiet","puzzle","brain","one-player"],"blurb":"Squeeze 52 cards down to a single pile. Extremely simple rules, and extremely hard to actually win.","sections":[{"h":"Goal","b":"Compress the entire deck into one pile."},{"h":"Setup","b":"Deal the cards out one at a time in a long row, left to right. You can deal them all first, or deal as you go \u2014 most players deal one at a time and play as opportunities appear."},{"h":"Play","b":"A pile may be moved onto the pile immediately to its left, or three piles to its left, if the top cards match in either SUIT or RANK. Close the gap when you move a pile."},{"h":"Strategy","b":"Long moves (three to the left) are usually better than short ones because they collapse the row faster. Look ahead before making an obvious short move."},{"h":"Winning","b":"Ending with one pile is a win. Fewer than five piles is a good result. Most games end with far more."}],"variants":["Allow moves one or two to the left instead of one or three.","Play 'Idle Year' rules with unlimited redeals of the row.","Set a target: get under five piles to count it as a win."],"cheat":{"goal":"Compress the whole deck into one pile.","setup":"Deal the cards in a long row.","key":["Move a pile onto the one to its left, or three to its left","Must match suit or rank"],"gotcha":"Long moves usually beat short ones \u2014 look ahead before collapsing a gap."}},{"id":"acey-deucey","name":"Acey Deucey","aka":["In-Between","Red Dog","Sheets","Yablon"],"cat":"casino","players":[2,10],"best":"4-8","time":[15,30],"age":12,"diff":1,"needs":"1 standard deck, chips or coins","tags":["gambling","party","fast","easy-to-teach","big-group","drinking-optional"],"blurb":"Two cards up, and you bet whether the third lands between them. Swingy, dumb, and dangerously fast.","sections":[{"h":"Goal","b":"Win chips from the pot by betting correctly on the spread."},{"h":"Setup","b":"Everyone antes into a central pot. Aces are high (or declared high/low by the player, house rule)."},{"h":"Play","b":"The dealer turns two cards face up in front of the active player. That player bets any amount from one chip up to the current size of the pot on whether the NEXT card will fall strictly between them in rank."},{"h":"Resolution","b":"Turn the third card. Between the two: take your bet's worth from the pot. Outside them: pay your bet into the pot. Exactly matching one of the two cards ('hitting the post'): pay DOUBLE your bet."},{"h":"Consecutive cards","b":"If the two up cards are consecutive in rank there's no gap at all \u2014 the player must pass, or in some houses ante again."},{"h":"Ending","b":"Play until the pot is emptied by a bet-the-pot win, then everyone antes again."}],"variants":["The player calls Ace high or low when an Ace is one of the two cards.","Minimum bet of two chips to speed the game up.","Play with a fixed payout rather than a shared pot."],"cheat":{"goal":"Bet whether the third card lands between the first two.","setup":"Ante into a shared pot. Two cards face up.","key":["Bet 1 chip up to the whole pot","Between = take your bet from the pot","Outside = pay it in"],"gotcha":"Hitting one of the two posts costs you DOUBLE your bet."}},{"id":"baccarat","name":"Baccarat","aka":["Punto Banco","Chemin de Fer"],"cat":"casino","players":[1,14],"best":"Any","time":[20,60],"age":18,"diff":1,"needs":"6-8 standard decks, chips","tags":["gambling","casino","easy-to-teach","no-strategy","fast"],"blurb":"The game with no decisions. You bet on Player or Banker, the cards decide themselves, and the house edge is among the lowest anywhere.","sections":[{"h":"Goal","b":"Bet on which of two hands \u2014 Player or Banker \u2014 will finish closer to 9. You are not the 'Player'; those are just the names of the two hands."},{"h":"Card values","b":"Aces are 1. Cards 2 through 9 are face value. 10s and all face cards are ZERO. Totals are taken modulo 10: a hand of 8 + 7 = 15 counts as 5. No hand can bust."},{"h":"The deal","b":"Two cards go to Player, two to Banker. If either hand totals 8 or 9, that's a 'natural' \u2014 both hands stand and the round is over immediately."},{"h":"Player's third card","b":"If no natural, the Player hand draws a third card on a total of 0 through 5, and stands on 6 or 7."},{"h":"Banker's third card","b":"The Banker rule depends on both its total and the Player's third card. Banker stands on 7. Draws on 0-2 always. On 3, draws unless the Player's third card was an 8. On 4, draws only if the Player's third was 2-7. On 5, only if it was 4-7. On 6, only if it was 6 or 7. Nobody memorizes this \u2014 the dealer executes it and there is no decision for you to make."},{"h":"Payouts","b":"Player bet pays 1:1. Banker bet pays 1:1 minus a 5% commission, because Banker wins slightly more often. Tie usually pays 8:1."},{"h":"Which bet to make","b":"House edge is roughly 1.06% on Banker, 1.24% on Player, and about 14% on Tie. The commission on Banker still leaves it the best bet at the table. The Tie bet is the worst wager in the room and pays for the chandeliers."},{"h":"There is no strategy","b":"Every card is dictated by the drawing rules. Scorecards, streak-tracking and 'the shoe is due' are decoration \u2014 each hand is independent."}],"variants":["Chemin de Fer: players take turns being the bank and actually choose whether to draw on 5.","Mini-baccarat: same game, smaller table, faster pace, lower minimums.","EZ Baccarat: no commission on Banker, but a Banker 7 with three cards pushes instead of winning."],"cheat":{"goal":"Bet on Player or Banker finishing closer to 9.","setup":"Two cards each hand. Totals are mod 10.","key":["10s and faces = 0, Ace = 1","8 or 9 = natural, both stand","Player draws on 0-5, stands 6-7","Banker pays 1:1 minus 5%"],"gotcha":"No decisions exist after you bet. Banker ~1.06% edge, Player ~1.24%, Tie ~14% \u2014 never take the tie."}},{"id":"basra","name":"Basra","aka":["Bastra","Basra Turkish","Pishti (related)"],"cat":"rummy","players":[2,4],"best":"2 or 4","time":[20,40],"age":8,"diff":2,"needs":"1 standard 52-card deck, paper for scoring","tags":["classic","middle-east","fishing","family","two-player","strategy"],"blurb":"A Middle Eastern fishing game. Capture cards from the table by matching them \u2014 and clearing the table completely is worth a fortune.","sections":[{"h":"Goal","b":"First to 101 points. Points come from specific captured cards and from clearing the table."},{"h":"Setup","b":"Deal 4 cards to each player and 4 face up to the table. If any of the four table cards is a Jack, bury it and turn another. Deal 4 more to each player whenever hands run out, until the deck is gone."},{"h":"Play","b":"On your turn, play one card face up. If it matches the rank of a table card, you capture that card (and any others of the same rank). If it matches nothing, it stays on the table."},{"h":"Jacks","b":"A Jack captures EVERY card on the table, regardless of rank. It's the cleanup card \u2014 and playing one on an empty or near-empty table wastes it."},{"h":"The seven of diamonds","b":"The 7\u2666 captures all NUMBER cards on the table at once (not Jacks, Queens or Kings). Save it for a crowded table."},{"h":"Basra","b":"Capturing every card on the table with a normal matching card \u2014 not a Jack \u2014 is a 'basra', worth 10 bonus points. A Jack only scores a basra if it takes a single card off the table."},{"h":"Scoring","b":"Most cards overall: 30 points. Each Ace: 1. The 2 of clubs: 2. The 10 of diamonds: 3. Each Jack: 1. Each basra: 10. Whoever made the last capture takes any cards left on the table."}],"variants":["Pishti (Turkish): a close cousin where matching the top of the pile scores the bonus.","Four-player partnership Basra with partners sitting across.","Play to 151 for a longer match."],"cheat":{"goal":"First to 101 points.","setup":"4 cards each, 4 face up (no Jack on the table to start).","key":["Match a rank to capture it","J captures everything","7\u2666 captures all number cards","Basra (clearing the table) = 10"],"gotcha":"A Jack only scores a basra if it takes a single card."}},{"id":"beggar-my-neighbour","name":"Beggar My Neighbour","aka":["Beat Your Neighbour Out of Doors","Strip Jack Naked"],"cat":"kids","players":[2,4],"best":"2","time":[10,30],"age":5,"diff":1,"needs":"1 standard 52-card deck","tags":["kids","family","no-strategy","two-player","historical"],"blurb":"A Victorian nursery game with no decisions at all. Face cards demand tribute, and the tension of the payoff cards is weirdly gripping.","sections":[{"h":"Goal","b":"Win all the cards."},{"h":"Setup","b":"Deal the deck out evenly, face down. No peeking."},{"h":"Play","b":"Players alternate flipping one card onto a central pile. Keep going until a face card or Ace appears."},{"h":"Paying tribute","b":"When someone plays a Jack, Queen, King or Ace, the next player owes cards: Jack = 1, Queen = 2, King = 3, Ace = 4. They flip that many, one at a time."},{"h":"Counter-attack","b":"If any tribute card is itself a face card or Ace, the payment stops and the obligation flips to the other player, who now owes the new amount. If the tribute is paid in full with no face cards, the player who played the original face card takes the entire pile."},{"h":"Ending","b":"A player with no cards loses. The game is entirely determined by the shuffle \u2014 some deals famously run for thousands of turns."}],"variants":["Add slapping rules to turn it into Egyptian Ratscrew.","Three or four players in a circle, each owing the player to their left.","Cap it with a timer and count cards to decide the winner."],"cheat":{"goal":"Win all the cards. No decisions at all.","setup":"Deal the deck out evenly.","key":["J=1, Q=2, K=3, A=4 cards owed","Pay in full = the face-card player takes the pile","No choices exist \u2014 the shuffle decides it"],"gotcha":"A face card in the tribute flips the debt back onto the other player."}},{"id":"bid-whist","name":"Bid Whist","aka":["Bid"],"cat":"trick","players":[4,4],"best":"4","time":[45,90],"age":12,"diff":2,"needs":"1 standard deck plus both jokers, paper for scoring","tags":["strategy","partners","classic","social","talking"],"blurb":"Whist with an auction, a kitty, and the option to declare that LOW cards win. Loud table talk is part of the tradition.","sections":[{"h":"Goal","b":"First partnership to 7 points (some play to 11). Partners sit across."},{"h":"Setup","b":"Use 54 cards \u2014 the full deck plus both jokers. The big joker is the highest trump, the little joker second. Deal 12 cards to each player and 6 face down as the kitty."},{"h":"Bidding","b":"Starting left of the dealer, each player bids or passes. A bid is a number from 1 to 7 \u2014 tricks ABOVE the six-trick 'book' \u2014 plus a direction: UPTOWN (normal, aces high), DOWNTOWN (inverted, aces low and 2s high), or NO-TRUMP. Each bid must be higher, and no-trump outranks a same-numbered suit bid."},{"h":"The kitty","b":"The winning bidder takes the 6-card kitty into their hand, then discards any 6 cards face down. Those discards count toward their side's tricks if they win the contract. Then they name trump (or no-trump) and the direction."},{"h":"Jokers","b":"In a suited contract, the big and little jokers are the top two trump. In no-trump they have no rank at all \u2014 set them aside before play, or by house rule the bidder discards them into the kitty."},{"h":"Play","b":"The bidder leads. Follow suit if you can, otherwise anything. Highest trump wins, else the highest card of the led suit \u2014 reversed if the contract is downtown."},{"h":"Scoring","b":"Six tricks is book and scores nothing. The bidding side scores 1 point per trick above book if they make their bid, and LOSES their bid if they don't ('getting set'). No-trump bids are typically worth double. The defending side scores nothing unless they set the bidders."},{"h":"Boston","b":"Winning all 13 tricks is a Boston. It's worth an automatic game in many houses, and worth talking about for years in all of them."}],"variants":["Play to 11 points for a longer game.","Rise and fly: the losing team gives up their seats to the next pair waiting.","Some groups score no-trump uptown and downtown at different values \u2014 settle it before the first deal."],"cheat":{"goal":"First partnership to 7 points.","setup":"54 cards (both jokers). 12 each, 6-card kitty.","key":["Bid 1-7 above the six-trick book","Uptown = normal, downtown = inverted","No-trump usually scores double","Bidder takes the kitty and discards 6"],"gotcha":"In no-trump the jokers have no rank \u2014 set them aside before play."}},{"id":"big-two","name":"Big Two","aka":["Deuces","Pusoy Dos","Choh Dai Di"],"cat":"shedding","players":[3,4],"best":"4","time":[15,30],"age":10,"diff":2,"needs":"1 standard 52-card deck","tags":["strategy","climbing","asia","poker-hands","no-equipment"],"blurb":"A climbing game where five-card poker hands beat each other. Bigger, sharper cousin of President.","sections":[{"h":"Goal","b":"Shed all your cards first. Everyone else scores penalty points for cards left."},{"h":"Card order","b":"2 is the highest rank, then A, K, Q, J, 10 down to 3. Suits also rank: spades highest, then hearts, clubs, diamonds. So the 2 of spades is the single best card in the game."},{"h":"Setup","b":"Deal all 52 cards \u2014 13 each with 4 players. The player holding the 3 of diamonds leads first and must include it in their opening play."},{"h":"Play","b":"The leader plays a single, a pair, a triple, or a five-card poker hand. Everyone after must play the SAME TYPE of combination, but higher, or pass. Passing takes you out of that round. When everyone passes, the last player to play leads a fresh combination of any type."},{"h":"Five-card hands","b":"Ranked lowest to highest: straight, flush, full house, four of a kind plus any card, straight flush. Compare by the ranking first, then by the highest card, then by suit."},{"h":"Scoring","b":"The winner scores 0. Everyone else scores 1 point per card left in hand \u2014 doubled if they hold 10 or more cards, tripled at 13. Lowest total after an agreed number of hands wins."}],"variants":["3-player: remove the diamond 3 and 4, deal 16 each.","Some regions rank triples above straights or allow two-card 'bombs'.","Play for chips, settling the point difference each hand."],"cheat":{"goal":"Shed all 13 cards.","setup":"Deal the whole deck. Holder of 3\u2666 leads and must include it.","key":["2 is highest, then A, K \u2026 3","Suits rank: \u2660 > \u2665 > \u2663 > \u2666","Five-card hands: straight < flush < full house < quads < straight flush"],"gotcha":"You must match the combination TYPE \u2014 you can't beat a pair with a triple."}},{"id":"blackjack","name":"Blackjack","aka":["21","Twenty-One","Pontoon"],"cat":"casino","players":[2,8],"best":"3-6","time":[20,60],"age":12,"diff":1,"needs":"1-6 standard decks, chips or coins","tags":["gambling","easy-to-teach","casino","fast","math"],"blurb":"Beat the dealer without going over 21. The rules take a minute; the correct plays take a chart.","sections":[{"h":"Goal","b":"Get a hand total closer to 21 than the dealer, without exceeding 21."},{"h":"Card values","b":"Number cards are face value. Face cards are 10. Aces are 1 OR 11, whichever helps \u2014 a hand with an ace counted as 11 is called 'soft'."},{"h":"Setup","b":"One player is the dealer (rotate each round in a home game). Everyone else bets. Deal each player two cards face up and the dealer two cards, one up and one down."},{"h":"Blackjack","b":"An Ace plus any 10-value card on the first two cards is a natural blackjack \u2014 it pays 3:2 and beats any other 21."},{"h":"Player options","b":"HIT: take another card, as many times as you like. STAND: keep your total. DOUBLE DOWN: double your bet and take exactly one more card. SPLIT: if your two cards match in rank, split into two hands with a second equal bet. SURRENDER (if allowed): forfeit half your bet and fold."},{"h":"Bust","b":"Go over 21 and you lose immediately, before the dealer even plays. That's the house's real edge."},{"h":"Dealer rules","b":"The dealer reveals their hidden card and must hit until reaching 17 or more, then must stand. Whether the dealer hits a soft 17 varies \u2014 agree before you start."},{"h":"Settlement","b":"Beat the dealer, win even money. Tie (push), keep your bet. Lose, lose your bet. If the dealer busts, everyone still standing wins."}],"variants":["Insurance: when the dealer shows an Ace, bet half your wager that they have blackjack. Statistically a bad bet.","Pontoon (UK/Australia) with different terminology and a five-card trick that wins automatically.","Home rules where the winner becomes the next dealer."],"cheat":{"goal":"Beat the dealer without going over 21.","setup":"Two cards each, one dealer card face down.","key":["Faces 10, Ace 1 or 11","Blackjack pays 3:2","Dealer must hit to 17","Bust = instant loss, even if the dealer busts after"],"gotcha":"Insurance is a bad bet. So is taking it 'just this once'."}},{"id":"blind-mans-bluff","name":"Blind Man's Bluff","aka":["Indian Poker","Squaw Poker","Forehead Poker"],"cat":"party","players":[3,10],"best":"5-8","time":[15,30],"age":12,"diff":1,"needs":"1 standard deck, chips or tokens","tags":["party","bluffing","easy-to-teach","funny","big-group","drinking-optional"],"blurb":"Everyone sees your card except you. All the reading is in other people's faces.","sections":[{"h":"Goal","b":"Win chips by having the highest card \u2014 or by getting everyone else to fold when you don't."},{"h":"Setup","b":"Everyone antes. Deal one card face down to each player. Without looking at it, hold it against your forehead so everyone else can see it."},{"h":"Play","b":"Starting left of the dealer, players bet, call, raise, or fold, exactly like a single round of poker. You're betting entirely on other people's reactions to your card and on the cards you can see."},{"h":"Showdown","b":"Everyone still in reveals. Highest card wins the pot. Aces high."},{"h":"The tell","b":"The moment someone with a low card sees three face cards around the table, their face gives it away. Watching the watchers is the game."}],"variants":["Deal two cards each for a longer game with two betting rounds.","Play with a rule that the lowest card must drink or take a penalty.","Add a 'blind raise' where you may bump without any information at all."],"cheat":{"goal":"Have the highest card \u2014 or bluff like you do.","setup":"One card each, held on your forehead facing out.","key":["Everyone sees your card except you","One betting round, then reveal"],"gotcha":"You're betting on other people's faces, so watch who's watching you."}},{"id":"bs","name":"BS","aka":["Cheat","I Doubt It","Bullsh*t","Liar"],"cat":"shedding","players":[3,8],"best":"4-6","time":[15,30],"age":8,"diff":1,"needs":"1 standard 52-card deck","tags":["party","bluffing","social","easy-to-teach","big-group"],"blurb":"Pure bluffing with almost no rules. Say what you're playing, lie freely, and try not to look like you're lying.","sections":[{"h":"Goal","b":"Be the first player to empty your hand."},{"h":"Setup","b":"Deal the entire deck out. Uneven hands are fine."},{"h":"Play","b":"Play goes in rank order: the first player puts down Aces, the next 2s, the next 3s, and so on up through Kings, then back to Aces. On your turn you place one or more cards FACE DOWN and announce them, e.g. 'three 7s'. You may be telling the truth or lying completely."},{"h":"Calling BS","b":"Any player may call 'BS' immediately after a play. Flip the played cards over. If the player lied, they take the entire discard pile into their hand. If they told the truth, the CALLER takes the whole pile. Then play continues from the next rank."},{"h":"Winning","b":"First to empty their hand wins \u2014 but if someone calls BS on that final play and it was a lie, they pick up the pile and are back in it."}],"variants":["Players may play any rank they choose instead of following sequence, making the game much harder to track.","You must play at least one card per turn \u2014 no passing.","Only the player to the immediate left may call BS."],"cheat":{"goal":"Empty your hand first.","setup":"Deal the whole deck out.","key":["Play in rank order: A, 2, 3 \u2026 K","Announce what you're playing, lie freely","Wrong call = the caller takes the pile"],"gotcha":"Get caught lying and you take the whole pile \u2014 including on your last card."}},{"id":"cambio","name":"Cambio","aka":["Cabo","Pablo","Golf with Powers","Cactus"],"cat":"rummy","players":[2,8],"best":"4-5","time":[20,40],"age":8,"diff":2,"needs":"1 standard deck (2 decks for 6+ players)","tags":["memory","family","party","bluffing","easy-to-teach","group","fast"],"blurb":"Four face-down cards, a terrible memory, and card powers that let you peek, spy and swap. Lowest total wins.","sections":[{"h":"Goal","b":"Have the lowest total when someone calls Cambio. Play several rounds to an agreed score limit \u2014 say 100 \u2014 and the lowest total wins."},{"h":"Card values","b":"Aces 1, number cards face value, Jacks and Queens 10, KINGS ARE 0 (some play red kings 0 and black kings 13 \u2014 decide first). Low is good."},{"h":"Setup","b":"Deal 4 cards face down to each player in a 2x2 square. Peek at your two nearest cards once, then leave them face down. Stock in the middle, one card flipped to start the discard pile."},{"h":"Your turn","b":"Draw the top stock card. Then either swap it for one of your face-down cards (discarding the old one face up), or discard it directly \u2014 and if it's a power card, use its power. You may also take the top of the DISCARD pile, but only to swap it into your grid."},{"h":"Card powers (on discard from the stock)","b":"7 or 8 \u2014 look at one of your own cards. 9 or 10 \u2014 look at one of anyone else's cards. Jack \u2014 swap any two cards on the table, blind, including your own. Queen \u2014 look at any one card, then optionally swap it with another. Kings have no power; they're just worth zero."},{"h":"Snapping","b":"At any time, any player may 'snap' a card matching the rank of the top discard by slapping it down face up \u2014 that card leaves your grid, shrinking your total. Snap wrong and you take a penalty card from the stock. Some groups let you snap another player's card and hand them one of yours."},{"h":"Calling Cambio","b":"At the start of your turn, instead of drawing, call 'Cambio'. Everyone else gets one final turn, then all cards are revealed. Lowest total wins the round and scores 0; everyone else adds their total. If the caller is NOT lowest, they take a penalty \u2014 usually their total plus 10."}],"variants":["Six cards each for a longer, harder memory test.","Add jokers worth -1 or -2.","No snapping, for a calmer game with young kids.","Golf-style: no powers at all, which is essentially Four-Card Golf."],"cheat":{"goal":"Lowest total when someone calls Cambio.","setup":"4 cards face down each. Peek at two.","key":["Kings = 0, A = 1, J/Q = 10","7/8 peek own \u00b7 9/10 peek theirs","J blind swap \u00b7 Q look then swap"],"gotcha":"Call Cambio without actually being lowest and you take your total plus a 10-point penalty."}},{"id":"canasta","name":"Canasta","aka":[],"cat":"rummy","players":[2,6],"best":"4","time":[60,90],"age":12,"diff":3,"needs":"2 standard decks plus 4 jokers, paper for scoring","tags":["strategy","partners","classic","long-game"],"blurb":"Big, meld-heavy partnership rummy from the 1950s. The goal is a canasta: seven of a kind, and the pile is worth fighting for.","sections":[{"h":"Goal","b":"First partnership to 5,000 points."},{"h":"Setup","b":"Shuffle two full decks plus all four jokers (108 cards). Deal 11 cards to each player. Turn one card up to start the discard pile \u2014 if it's a joker, 2, or red 3, bury it and turn another."},{"h":"Wild cards and red threes","b":"Jokers (50 points) and all 2s (20 points) are wild. Red 3s are bonus cards: play them face up immediately and draw a replacement \u2014 each is worth 100 points to your team (all four are worth 800), but only if your team has melded."},{"h":"Melds","b":"Melds are sets of the same rank, three or more, shared with your partner. No runs. A meld may contain at most three wild cards and must always have more natural cards than wild ones. Black 3s can only be melded on your final turn."},{"h":"Opening requirement","b":"Your team's FIRST meld must reach a minimum total based on your current score: below 0 needs 15, 0-1,495 needs 50, 1,500-2,995 needs 90, 3,000+ needs 120."},{"h":"The discard pile","b":"You may take the whole discard pile if you can meld its top card using two natural cards from your hand (or add it to an existing meld). The pile is 'frozen' by a wild card or black 3 on top \u2014 while frozen, you need two natural matching cards from hand, no exceptions."},{"h":"Canastas and going out","b":"A canasta is seven cards of one rank: 500 points if all natural (clean), 300 if it contains a wild (dirty). Your team must have at least one canasta before you can go out. Going out is worth 100 bonus points (200 if you 'go out concealed' \u2014 melding your entire hand at once with a canasta and no prior melds)."},{"h":"Card values","b":"Joker 50, Ace and 2 both 20, K/Q/J/10/9/8 are 10 each, 7 through 4 and black 3 are 5 each. Score melded cards, subtract cards left in hand."}],"variants":["Hand and Foot: each player gets two hands and plays the second after finishing the first.","Samba adds runs (sequences) as legal melds.","Two-player Canasta: deal 15 cards each and draw two cards per turn."],"cheat":{"goal":"First partnership to 5,000.","setup":"2 decks + 4 jokers, 11 cards each.","key":["Jokers 50, 2s 20 \u2014 all wild","Red 3 = 100 bonus","Clean canasta 500, dirty 300","Opening meld: 50 / 90 / 120 by score"],"gotcha":"You need at least one canasta before your team can go out."}},{"id":"casino","name":"Casino","aka":["Cassino"],"cat":"rummy","players":[2,4],"best":"2","time":[20,30],"age":8,"diff":2,"needs":"1 standard 52-card deck","tags":["two-player","classic","strategy","quiet","math"],"blurb":"A fishing game: capture cards from the table by matching or adding up to them. Quietly one of the sharpest games in the deck.","sections":[{"h":"Goal","b":"First to 21 points across several hands."},{"h":"Card values","b":"Aces are 1. Number cards are face value. Face cards have no numeric value and can only be captured by matching rank."},{"h":"Setup","b":"Deal 4 cards to each player and 4 face up to the table. The rest is the stock; deal 4 more to each player whenever hands run out, but no more to the table."},{"h":"Your turn \u2014 play one card and do one of three things","b":"CAPTURE: take any table card of matching rank, and/or any group of number cards adding up to your card's value. BUILD: place your card on a table card to declare a total you'll capture next turn (e.g. play a 3 on a 5 and announce 'building 8' \u2014 you must hold an 8). TRAIL: just place your card face up on the table, adding to the pool."},{"h":"Builds","b":"You must hold a card capable of capturing any build you make, and you can't trail while you own an unclaimed build. Opponents may capture or increase your build \u2014 a build of 8 can be raised to 10 by adding a 2, if that player holds a 10."},{"h":"Sweeps","b":"If your capture clears the entire table, that's a sweep \u2014 worth 1 extra point. Mark it by turning a card face up in your pile."},{"h":"Scoring","b":"Most cards: 3 points. Most spades: 1 point. The 10 of diamonds ('Big Casino'): 2 points. The 2 of spades ('Little Casino'): 1 point. Each Ace: 1 point. Each sweep: 1 point. Whoever makes the last capture takes any cards left on the table."}],"variants":["Royal Casino: face cards get values (J=11, Q=12, K=13) and can be captured by sums.","Draw Casino: draw a replacement card after every play.","Four-player partnership Casino."],"cheat":{"goal":"First to 21 points.","setup":"Deal 4 each and 4 face up to the table.","key":["Most cards 3, most spades 1","10\u2666 = 2, 2\u2660 = 1","Each Ace = 1","Each sweep = 1"],"gotcha":"You must hold a card that can capture any build you make, and can't trail while you own one."}},{"id":"casino-war","name":"Casino War","aka":["War (casino version)"],"cat":"casino","players":[1,6],"best":"Any","time":[10,30],"age":18,"diff":1,"needs":"6 standard decks, chips","tags":["gambling","casino","no-strategy","easy-to-teach","fast"],"blurb":"The children's game War with a betting box attached. The simplest wager in any casino, and the only decision you make is a bad one.","sections":[{"h":"Goal","b":"Get a higher card than the dealer. That's the entire game."},{"h":"Setup","b":"Place a bet. Dealer gives you one card and takes one. Aces are high; suits are irrelevant."},{"h":"Resolution","b":"Your card higher: you win even money. Dealer's card higher: you lose your bet."},{"h":"The tie","b":"On a tie you choose: SURRENDER and forfeit half your bet, or GO TO WAR \u2014 double your wager, the dealer burns three cards, and you each get one more. Win the war and you're paid even money on the RAISE only; your original bet pushes. Tie again and most houses pay a bonus."},{"h":"Which choice is right","b":"Going to war is the better of the two, but only slightly \u2014 surrender is the worse option at almost every table. Overall house edge sits around 2.9% with six decks, higher if you keep surrendering."},{"h":"The tie side bet","b":"Most tables offer a side bet that the round will tie, paying around 10:1. Its house edge is roughly 18%. Skip it."}],"variants":["Home version: play it as regular War for chips, no burning of cards.","Multi-hand Casino War with several boxes against one dealer card.","Progressive tie bonuses at some houses."],"cheat":{"goal":"Beat the dealer's single card.","setup":"One card each. Aces high.","key":["Higher card pays even money","Tie: surrender half, or go to war"],"gotcha":"Going to war pays even money on the RAISE only \u2014 the original bet just pushes. Skip the tie side bet."}},{"id":"chinese-poker","name":"Chinese Poker","aka":["Pusoy","Russian Poker","Thirteen-Card Poker"],"cat":"casino","players":[2,4],"best":"4","time":[30,60],"age":18,"diff":2,"needs":"1 standard deck, chips or a scorepad","tags":["poker","gambling","strategy","asia","no-betting-rounds"],"blurb":"Thirteen cards, three poker hands, one rule you cannot break. No betting rounds \u2014 just arrangement.","sections":[{"h":"Goal","b":"Split 13 cards into three hands that each beat your opponents' equivalent hands. Score is settled in units per row."},{"h":"Setup","b":"Deal 13 cards to each of four players \u2014 the whole deck. With fewer players, just deal 13 each and set the rest aside."},{"h":"Arranging your hands","b":"BACK (bottom): 5 cards, your strongest. MIDDLE: 5 cards. FRONT (top): 3 cards, your weakest \u2014 no straights or flushes count here, only pairs, trips and high card."},{"h":"The one unbreakable rule","b":"Back must be at least as strong as Middle, and Middle at least as strong as Front. Break that order and your hand is 'mis-set' (fouled) \u2014 you lose every row to every opponent automatically. Check twice before you set."},{"h":"Scoring","b":"Compare row against row with each opponent: 1 unit for each row you win, minus 1 for each you lose. Winning all three rows against one player is a 'scoop' and typically earns a bonus unit."},{"h":"Royalties (optional)","b":"Bonus units for premium holdings \u2014 a straight flush in back, four of a kind, trips in front. Agree the table before you deal; every group runs a different chart."},{"h":"Where the skill is","b":"Almost entirely in the split. A monster back hand is wasted if it leaves you nothing for middle and front. Two decent hands and one throwaway usually beats one huge hand and two scraps."}],"variants":["Open-Face Chinese Poker: cards arrive one at a time and must be placed as you receive them \u2014 far more tense.","Pineapple OFC: three cards at a time, place two and discard one.","2-4-6 scoring, where scooping pays progressively more."],"cheat":{"goal":"Beat each opponent row by row.","setup":"13 cards each. Split into back 5, middle 5, front 3.","key":["Back \u2265 middle \u2265 front","1 unit per row won","Scoop all three = bonus"],"gotcha":"Set them out of order and you foul \u2014 you lose every row to everyone automatically."}},{"id":"clock-solitaire","name":"Clock Solitaire","aka":["Clock Patience","Hidden Cards","Sundial"],"cat":"solitaire","players":[1,1],"best":"1","time":[5,10],"age":5,"diff":1,"needs":"1 standard 52-card deck","tags":["solo","kids","no-strategy","fast","one-player"],"blurb":"Zero decisions \u2014 the deal decides everything. Good for children and for when you just want to watch something resolve.","sections":[{"h":"Goal","b":"Turn up all four cards at every position on the clock before the fourth King appears."},{"h":"Setup","b":"Deal the entire deck face down into 13 piles of 4: twelve arranged in a circle like a clock face, and one pile in the center."},{"h":"Play","b":"Turn over the top card of the center pile. Slide it face up UNDER the pile matching its number \u2014 Ace goes to 1 o'clock, 2 to 2 o'clock, Jack to 11, Queen to 12, King to the center. Then flip the top card of that pile and repeat."},{"h":"Losing","b":"When the fourth King is turned up, the game ends immediately. If cards are still face down anywhere, you lost."},{"h":"Odds","b":"You win about 1 in 13 games, entirely by chance. There is no skill in this game at all, which is oddly relaxing."}],"variants":["Play with a 'grace' rule allowing one extra flip after the fourth King.","Watch and narrate for a small child \u2014 it's a great counting exercise.","Race two players with two decks side by side."],"cheat":{"goal":"Turn up all four cards at every hour before the fourth King.","setup":"13 face-down piles of 4 \u2014 twelve in a clock, one in the centre.","key":["Card goes under its matching hour","Kings go to the centre"],"gotcha":"Pure luck \u2014 about a 1 in 13 win rate. There are no decisions."}},{"id":"bridge","name":"Contract Bridge","aka":["Bridge","Rubber Bridge","Duplicate Bridge"],"cat":"trick","players":[4,4],"best":"4","time":[60,180],"age":12,"diff":3,"needs":"1 standard 52-card deck, paper for scoring","tags":["strategy","partners","classic","hard","long-game","quiet","brain"],"blurb":"The deepest game in the deck. An auction decides the contract, then one partner plays both hands while the other watches.","sections":[{"h":"Goal","b":"Bid a contract \u2014 how many tricks your side will take and in what trump suit \u2014 then make it. Bridge is scored over a series of hands; in rubber bridge the first side to win two games wins the rubber."},{"h":"Setup","b":"Partners sit across (traditionally North-South and East-West). Deal all 52 cards, 13 each. Aces are high."},{"h":"The auction","b":"Starting with the dealer, each player bids or passes. A bid names a number (1 through 7) and a strain: clubs, diamonds, hearts, spades, or no-trump. The number means tricks ABOVE six, so '4 hearts' promises 10 of the 13 tricks. Bids must ascend: strains rank clubs < diamonds < hearts < spades < no-trump, so 1NT beats 1 spade, and 2 clubs beats 1NT. Three passes in a row end the auction."},{"h":"Declarer and dummy","b":"The side that made the final bid is the declaring side. Whichever of the two partners FIRST named that strain is the declarer. The player to declarer's left leads, and then declarer's partner lays their whole hand face up on the table \u2014 that's the dummy. Declarer plays both hands; dummy says and does nothing."},{"h":"Play","b":"Follow suit if you can, otherwise play anything. Highest trump wins, else highest card of the led suit. Winner leads next. 13 tricks total."},{"h":"Scoring","b":"Tricks bid AND made score below the line: 20 each in clubs or diamonds, 30 each in hearts or spades, 40 for the first no-trump trick and 30 for each after. Reach 100 below the line and you win a game. Overtricks and bonuses score above the line. Fail to make your contract and the opponents score 50 per undertrick (100 if vulnerable)."},{"h":"Doubling","b":"An opponent may 'double' a contract they think will fail, which multiplies the stakes both ways. The declaring side may 'redouble'. This is where the money is, and where beginners get flattened."},{"h":"Bidding conventions","b":"Serious bridge layers an agreed language on top of the auction \u2014 Stayman, Blackwood, transfers \u2014 so bids describe your hand rather than just claiming tricks. You do not need any of it to play; you need it to compete."}],"variants":["Duplicate bridge: every table plays the same deals, so results compare skill rather than luck. This is how clubs and tournaments run.","Chicago (four-deal bridge): a fixed four-hand cycle instead of an open-ended rubber.","Honeymoon bridge: a two-player adaptation."],"cheat":{"goal":"Bid a contract and make it. First to two games wins the rubber.","setup":"Partners across, 13 cards each, then an auction.","key":["Bid number = tricks ABOVE six","Strain order: \u2663 < \u2666 < \u2665 < \u2660 < NT","Minors 20/trick, majors 30, NT 40 then 30","100 below the line = a game"],"gotcha":"Declarer is whoever FIRST named the final strain, not whoever bid last."}},{"id":"contract-rummy","name":"Contract Rummy","aka":["Liverpool Rummy","Progressive Rummy","Shanghai Rummy","May I","Joker Rummy"],"cat":"rummy","players":[3,8],"best":"4-5","time":[45,90],"age":10,"diff":2,"needs":"2 decks plus jokers (3 decks for 6+ players), paper for scoring","tags":["family","group","melding","classic","long-game","strategy"],"blurb":"Seven deals, and every deal demands a harder combination than the last. The public-domain original behind every 'phases' card game.","sections":[{"h":"Goal","b":"Lowest total score after seven deals. Points are penalties for cards left in your hand."},{"h":"The seven contracts","b":"Deal 1: two sets. Deal 2: one set and one run. Deal 3: two runs. Deal 4: three sets. Deal 5: two sets and one run. Deal 6: one set and two runs. Deal 7: three runs, and you must go out on the same turn you lay them down. A set is 3+ of a rank; a run is 4+ in sequence in one suit."},{"h":"Setup","b":"Deal 10 cards each for the first four deals and 12 for the last three. Stock face down, one card face up. Jokers are wild; some groups also make 2s wild."},{"h":"Your turn","b":"Draw from the stock or take the top discard, then discard one. You may lay down your contract only once you can meet it EXACTLY \u2014 no more, no less \u2014 and only on your turn."},{"h":"May I","b":"This is what makes the game. When it isn't your turn and you want the top discard, you may ask 'May I?'. If the player whose turn it is doesn't want it, you take the discard PLUS a penalty card from the stock. Most groups cap it at three buys per player per deal."},{"h":"After laying down","b":"Once your contract is on the table you may lay off cards onto anyone's melds on subsequent turns. You cannot lay off before you've made your own contract."},{"h":"Scoring","b":"When someone goes out, everyone else counts their hand: joker 15 (or 25), Ace 15, face cards 10, number cards 5. Add it to your running total. Lowest score after deal seven wins."}],"variants":["Shanghai Rummy: buying is unlimited, and jokers may be swapped out of melds.","Add an eighth deal requiring a full-hand meld.","Require runs of exactly four, or allow Aces to run both high and low."],"cheat":{"goal":"Lowest score after seven deals.","setup":"Two decks + jokers. 10 cards for deals 1-4, 12 for 5-7.","key":["1: 2 sets \u00b7 2: set+run \u00b7 3: 2 runs \u00b7 4: 3 sets","5: 2 sets+run \u00b7 6: set+2 runs \u00b7 7: 3 runs","Sets are 3+, runs are 4+"],"gotcha":"Say 'May I?' to buy the discard out of turn \u2014 you also take a penalty card, usually capped at three buys."}},{"id":"crazy-eights","name":"Crazy Eights","aka":["Swedish Rummy","Last One","Mau Mau"],"cat":"shedding","players":[2,7],"best":"3-5","time":[10,20],"age":6,"diff":1,"needs":"1 deck (2 decks for 6+ players)","tags":["kids","family","easy-to-teach","fast","no-equipment"],"blurb":"The public-domain original that Uno is built on. Match suit or rank, and eights are wild.","sections":[{"h":"Goal","b":"Be the first to play all your cards."},{"h":"Setup","b":"Deal 5 cards each (7 each with only 2 players). Stack the rest face down and flip the top card to start the discard pile."},{"h":"Play","b":"On your turn, play one card that matches the top of the discard pile in either SUIT or RANK. If you can't, draw from the stock until you can play \u2014 or, in the faster version, draw one card and pass if it doesn't help."},{"h":"Eights are wild","b":"You may play an 8 on anything at any time. When you do, name the suit that must be played next. That's the whole game's leverage \u2014 save one for when you're stuck or about to go out."},{"h":"Ending","b":"First player with no cards wins the hand. If the stock runs out, either reshuffle the discards (leaving the top card) or play until nobody can move."},{"h":"Scoring (optional)","b":"Losers count the cards left in hand: each 8 is 50, face cards are 10, Aces 1, others face value. Play to 100 or 200 points; low score wins."}],"variants":["Crazy Eights Countdown: hand sizes shrink each round from 8 down to 1.","Add action cards like Uno \u2014 2 = draw two, Queen = skip, Ace = reverse.","Mau Mau: the same game with house rules that new players must deduce as they get penalized."],"cheat":{"goal":"Empty your hand first.","setup":"Deal 5 each (7 for two players). Flip one card up.","key":["Match suit or rank","8s are wild \u2014 name any suit"],"gotcha":"Save one 8 for when you're blocked or about to go out."}},{"id":"cribbage","name":"Cribbage","aka":["Crib"],"cat":"rummy","players":[2,4],"best":"2","time":[20,40],"age":10,"diff":3,"needs":"1 standard deck and a cribbage board (or paper)","tags":["two-player","strategy","classic","counting","pub"],"blurb":"The pub-table classic. Everything is about combinations that total 15, and half the skill is what you throw away.","sections":[{"h":"Goal","b":"First to 121 points, tracked by pegging around a cribbage board."},{"h":"Card values","b":"Aces are 1, face cards are 10, everything else is face value. For runs, order is A-2-3...J-Q-K."},{"h":"Setup and the crib","b":"Deal 6 cards each (2 players). Each player throws 2 cards face down into 'the crib' \u2014 an extra hand that belongs to the dealer and is scored at the end. Then the non-dealer cuts and the dealer flips the top card: the 'starter' or 'cut'. If it's a Jack, the dealer immediately pegs 2 ('his heels')."},{"h":"The play (pegging)","b":"Starting with the non-dealer, alternate playing cards face up in front of you, calling out the running total. You cannot exceed 31. Score as you go: making the total exactly 15 = 2 points; a pair = 2; three of a kind = 6; four of a kind = 12; completing a run of three or more (in any order) = 1 per card; hitting exactly 31 = 2. If you can't play without going over, say 'go' \u2014 your opponent keeps playing and pegs 1 for the last card. Then reset the count to zero and continue with remaining cards."},{"h":"The show (counting hands)","b":"Non-dealer counts first, then dealer, then the dealer counts the crib. Each hand is its 4 cards plus the shared starter card. Score: every combination totaling 15 = 2 points; every pair = 2; every run of 3+ = 1 per card; 4 cards of one suit = 4 (5 with the starter); Jack matching the starter's suit ('his nobs') = 1."},{"h":"Why the crib matters","b":"The crib is the dealer's bonus hand, so as dealer you throw good cards into it and as non-dealer you throw junk. 5s are gold \u2014 they pair with every 10-value card to make 15."}],"variants":["3-player: deal 5 each plus one card straight to the crib.","4-player partnership: deal 5 each, one card to the crib from each player.","Muggins: if your opponent miscounts their hand, you may claim the points they missed."],"cheat":{"goal":"First to 121, pegged around the board.","setup":"Deal 6 each, throw 2 to the dealer's crib, cut a starter card.","key":["15 = 2 pts","Pair = 2, trips = 6, quad = 12","Run = 1/card","31 exactly = 2, last card = 1","His nobs (J matching starter suit) = 1"],"gotcha":"The crib belongs to the dealer \u2014 throw it junk when you're not dealing."}},{"id":"dealers-choice","name":"Dealer's Choice Poker","aka":["Home Poker Variants","Kitchen Table Poker","Wild Card Poker"],"cat":"casino","players":[3,8],"best":"5-7","time":[60,180],"age":18,"diff":2,"needs":"1 standard deck, chips","tags":["poker","gambling","party","funny","big-group","classic","kitchen-table"],"blurb":"The home game where whoever deals picks the game. A menu of the wild, silly variants that never show up in a casino.","sections":[{"h":"How it works","b":"The deal rotates, and the dealer names the game and any wild cards before the cards come out. Announce the ante, the betting structure and the wild cards clearly \u2014 'seven card stud, threes and nines wild, quarter ante' \u2014 and then don't change your mind mid-hand."},{"h":"Baseball","b":"Seven-card stud with 3s and 9s wild. Any 4 dealt face up wins you an extra card immediately. If you're dealt a 3 face up you must match the pot to stay in \u2014 or fold. High-scoring, ridiculous, and the most-played home variant in America."},{"h":"Follow the Queen","b":"Seven-card stud where the wild card is whatever rank is dealt face up immediately after a face-up Queen. If another Queen appears later, the wild rank changes. If a Queen is the last up card, there's no wild card at all. Nobody knows what they have until the last card is out."},{"h":"Anaconda (pass the trash)","b":"Deal 7 cards to each player. Bet. Pass 3 cards to your left. Bet. Pass 2. Bet. Pass 1. Then everyone discards down to five and rolls their cards over one at a time with a betting round after each. Long, tense, and full of information."},{"h":"7-27","b":"Not poker at all. Aces are 1 or 11, face cards are half a point, everything else is face value. Deal one card down and one up. Bet, then anyone may take another card. You're aiming for exactly 7 or exactly 27, and the pot splits between the closest to each. Bust both ways and you're out."},{"h":"Night Baseball","b":"Everyone gets 7 cards face down, unseen. Going around, players flip one card at a time; when your exposed cards beat everything showing, you stop and the next player flips. Betting after each reveal. Threes and nines wild. Pure spectacle."},{"h":"Criss-Cross (Iron Cross)","b":"Deal 5 cards to each player and 5 community cards in a plus shape, face down. Flip them one at a time with betting between. You make your best hand using your own cards plus one full row OR one full column \u2014 never both."},{"h":"House rules that keep it civil","b":"Cap the raises per round. Ban games nobody can explain in thirty seconds. Rotate the deal strictly so no one gets to keep calling their pet game. Declare wild cards before the ante, never after."}],"variants":["Add Guts, Indian Poker or Screw Your Neighbor to the rotation for non-poker breaks.","Dealer antes for the table in the game they call \u2014 keeps people from picking gimmicks every time.","Ban wild cards entirely for a stricter game; the hand values stop meaning anything with three wilds in play."],"cheat":{"goal":"Whoever deals names the game.","setup":"Announce game, wild cards, ante and structure BEFORE dealing.","key":["Baseball: 3s and 9s wild, face-up 4 = extra card","Follow the Queen: wild rank changes on every up Queen","Anaconda: pass 3, 2, 1, then roll cards","7-27: aim for exactly 7 or exactly 27"],"gotcha":"Declare wild cards before the ante, never after."}},{"id":"deck-workout","name":"Deck of Cards Workout","aka":["Suicide Deck","Card Deck Challenge","52 Card Pickup Workout"],"cat":"party","players":[1,12],"best":"1-4","time":[15,40],"age":12,"diff":1,"needs":"1 standard deck and floor space","tags":["solo","fitness","no-deck-needed","group","one-player","easy-to-teach"],"blurb":"Not a game \u2014 the deck is a random workout generator. Each suit is an exercise, each number is your rep count, and the deck decides.","sections":[{"h":"How it works","b":"Assign one exercise to each suit. Shuffle the deck and flip cards one at a time. The card's number is your rep count; do that many of that suit's exercise, then flip the next card. Work through all 52."},{"h":"Values","b":"Number cards are face value. Jack, Queen and King are 10 each. Aces are 11 \u2014 or 15, or a 30-second hold, if you want it to hurt. Jokers are a 60-second plank, a 200m sprint, or 10 burpees, dealer's choice."},{"h":"A standard assignment","b":"Hearts \u2014 push-ups. Spades \u2014 squats. Diamonds \u2014 sit-ups or crunches. Clubs \u2014 jumping jacks or lunges. Roughly 380 total reps across the deck."},{"h":"Scaling it","b":"Too much? Use half the deck, drop face cards to 5, or count Aces as 1. Too easy? Add a weight, cut rest to zero, or run a lap on every Ace. Beginners should start with 26 cards."},{"h":"As a group game","b":"Everyone works from the same flipped card at the same time \u2014 the whole room does 8 squats, then 10 push-ups. Or deal the deck out and race: first person through their stack wins. It's a reliable icebreaker for teams and a genuinely hard workout."},{"h":"Sensible caveats","b":"Warm up first, keep form over speed, stop if something hurts rather than pushing to the last card, and pick exercises you already know how to do. The deck doesn't know anything about your body."}],"variants":["Partner version: one person flips and calls while the other works, then swap every 13 cards.","Red cards = cardio, black cards = strength, for a simpler two-exercise version.","Deck of pain: draw only 20 cards for a 10-minute finisher."],"cheat":{"goal":"Work through 52 cards of reps.","setup":"One exercise per suit. Flip and go.","key":["Numbers = face value","J/Q/K = 10","Ace = 11 (or 15)","Joker = 60s plank or 10 burpees","~380 reps per deck"],"gotcha":"Halve the deck or drop face cards to 5 if you're starting out."}},{"id":"dou-dizhu","name":"Dou Dizhu","aka":["Fight the Landlord","Doudizhu","\u6597\u5730\u4e3b"],"cat":"shedding","players":[3,3],"best":"3","time":[15,30],"age":10,"diff":2,"needs":"1 standard deck plus both jokers (54 cards)","tags":["strategy","climbing","asia","three-player","fast","classic"],"blurb":"China's most-played card game. One player becomes the landlord and takes on the other two at once.","sections":[{"h":"Goal","b":"The landlord wins by shedding all 20 cards first. The two peasants win if EITHER of them empties their hand \u2014 they're a team, even though only one has to finish."},{"h":"Card order","b":"3 is lowest, then 4-5-6-7-8-9-10-J-Q-K-A, then 2, then the black joker, then the red joker on top. Suits are irrelevant."},{"h":"Setup and bidding","b":"Deal 17 cards to each of the three players and leave 3 face down. Players bid 1, 2, or 3 points (or pass) for the right to be landlord. The winner reveals the 3 hidden cards, adds them to their hand, and now holds 20."},{"h":"Play","b":"The landlord leads any legal combination. Each player in turn must beat it with the SAME combination type at a higher rank, or pass. When both others pass, the last player to play leads fresh."},{"h":"Legal combinations","b":"Single. Pair. Triple. Triple plus one single. Triple plus a pair. Straight of 5 or more consecutive singles (3 up to A \u2014 no 2s or jokers). Straight of 3 or more consecutive pairs. Airplane (two or more consecutive triples, optionally with attachments). Four of a kind plus two singles or two pairs."},{"h":"Bombs and the rocket","b":"A bomb is four of a kind. It beats any combination except a higher bomb or the rocket, and can be played on anything. The ROCKET is both jokers together \u2014 it beats absolutely everything and cannot be beaten. Each bomb or rocket played doubles the hand's score."},{"h":"Scoring","b":"The base score is the winning bid, doubled for every bomb and rocket played. If the landlord wins, each peasant pays them that amount. If the peasants win, the landlord pays each of them."}],"variants":["Four-player Dou Dizhu with two decks and two landlords.","'Spring': if the landlord wins without the peasants playing a single card, the score doubles again.","Bidding by 'grabbing the landlord' instead of numeric bids."],"cheat":{"goal":"Landlord sheds 20 cards. Either peasant sheds to win for both.","setup":"17 each, 3 hidden. Bid for landlord, who takes the 3.","key":["Order: 3\u202610, J, Q, K, A, 2, black joker, red joker","Match the combination type, higher rank","Bomb = four of a kind","Rocket = both jokers, unbeatable"],"gotcha":"Every bomb or rocket doubles the hand's score."}},{"id":"durak","name":"Durak","aka":["Fool"],"cat":"trick","players":[2,6],"best":"3-4","time":[20,40],"age":10,"diff":2,"needs":"36 cards (6 through Ace in each suit)","tags":["strategy","classic","russian","elimination","no-equipment"],"blurb":"Russia's national card game. There's no winner \u2014 only a loser, the durak, who is left holding cards when everyone else is out.","sections":[{"h":"Goal","b":"Get rid of all your cards. The last player still holding cards is the fool."},{"h":"Setup","b":"Use a 36-card deck (6 to Ace). Deal 6 cards each. Turn the next card face up and slide it half-under the remaining stock \u2014 its suit is trump for the whole game and that card is the last one drawn."},{"h":"Attack and defend","b":"The player with the lowest trump attacks first; the player to their left defends. The attacker plays a card face up. The defender must beat it with a HIGHER card of the same suit, or with any trump (a trump beats any non-trump; a higher trump beats a lower one)."},{"h":"Piling on","b":"Once a defense is made, the attacker \u2014 and any other player \u2014 may add more attacking cards, but only cards whose RANK already appears on the table. The defender must beat each one. The maximum number of attacks in a bout is 6 (or the defender's hand size, whichever is smaller)."},{"h":"Resolving the bout","b":"If the defender beats everything, all cards go to the discard pile and the defender becomes the next attacker. If the defender gives up, they pick up ALL cards on the table and the attack passes to the player after them."},{"h":"Refilling","b":"After each bout, players draw back up to 6 cards from the stock, attacker first. Once the stock is gone, no one refills, and players who run out of cards are out of the game."}],"variants":["Perevodnoy (transfer) Durak: the defender can pass the attack along by playing a matching rank.","Podkidnoy is the standard 'throw-in' version described above.","Play with a full 52-card deck for longer games."],"cheat":{"goal":"Don't be the last one holding cards.","setup":"36 cards (6-A). Deal 6 each. Turn a card for trump and slide it under the stock.","key":["Lowest trump attacks first","Max 6 attacks per bout","Refill to 6 after each bout, attacker first"],"gotcha":"Extra attacking cards must match a rank already on the table."}},{"id":"egyptian-ratscrew","name":"Egyptian Ratscrew","aka":["ERS","Egyptian War","Slap"],"cat":"speed","players":[2,8],"best":"3-5","time":[10,30],"age":8,"diff":1,"needs":"1 standard 52-card deck (short nails recommended)","tags":["fast","chaotic","party","reflexes","loud","kids"],"blurb":"War with slapping. Sting your hand a few times and you'll never forget the slap rules.","sections":[{"h":"Goal","b":"Win every card in the deck."},{"h":"Setup","b":"Deal the entire deck out face down. Players keep their pile face down and never look at it."},{"h":"Play","b":"Going clockwise, each player flips their top card onto a central pile. Keep going until a face card or Ace appears."},{"h":"The face card challenge","b":"When someone plays a face card or Ace, the NEXT player must pay a tribute of cards: Jack = 1 card, Queen = 2, King = 3, Ace = 4. If any of those tribute cards is itself a face card or Ace, the challenge passes to the next player, who now owes the new tribute. If the tribute runs out without another face card, the player who played the ORIGINAL face card takes the whole pile."},{"h":"Slap rules","b":"Anyone may slap the pile at any time \u2014 first hand down takes it. Slap on: DOUBLE (two matching ranks in a row), SANDWICH (matching ranks separated by one card), TOP-BOTTOM (played card matches the bottom card of the pile), and TENS (two consecutive cards adding to 10, no face cards)."},{"h":"Bad slaps","b":"Slap wrongly and you 'burn' \u2014 put one card from your pile face down at the bottom of the center pile. Repeat offenders run out of cards fast."},{"h":"Elimination","b":"Out of cards? You're not out yet \u2014 you get one more chance to slap in. Win a pile and you're back."}],"variants":["Add slap rules: marriage (K then Q), divorce (Q then K), four in a row, or a 'straight' of three sequential cards.","Play with jokers as instant-slap cards.","No-burn rule for young kids so a bad slap just loses the pile."],"cheat":{"goal":"Win every card.","setup":"Deal the deck out face down. Nobody looks.","key":["J=1, Q=2, K=3, A=4 cards owed","Slap: double, sandwich, top-bottom, adds-to-10"],"gotcha":"Bad slap = burn a card to the bottom of the pile."}},{"id":"euchre","name":"Euchre","aka":[],"cat":"trick","players":[4,4],"best":"4","time":[20,40],"age":10,"diff":2,"needs":"24 cards (9 through Ace in each suit)","tags":["strategy","partners","fast","midwest","no-equipment"],"blurb":"The Midwest tavern classic. Short deck, quick hands, and the Jacks change suit on you.","sections":[{"h":"Goal","b":"First team to 10 points. Hands are fast \u2014 a full game takes about 20 minutes."},{"h":"Setup","b":"Strip the deck down to 9, 10, J, Q, K, A in each suit (24 cards). Partners sit across. Deal 5 cards each in packets of 2 and 3, then turn the next card face up \u2014 this is the 'up card'."},{"h":"Naming trump","b":"Starting left of the dealer, each player may 'order up' the up card's suit as trump or pass. If someone orders it up, the dealer picks that card up and discards one. If all four pass, the up card is turned down and a second round begins where each player may name any OTHER suit as trump or pass. If everyone passes again, redeal (or in 'stick the dealer', the dealer must choose)."},{"h":"The Jacks \u2014 this is the part that trips people up","b":"The Jack of the trump suit is the 'right bower' \u2014 the highest card in the game. The Jack of the SAME COLOR suit is the 'left bower' \u2014 second highest, and for this hand it counts as a trump card, not as its printed suit. So if spades are trump, the Jack of clubs IS a spade. Below those: A, K, Q, 10, 9 of trump, then the other suits normally."},{"h":"Play","b":"Player left of the dealer leads. Follow suit if able (remembering the left bower is trump). Highest trump wins, else highest card of the led suit. Five tricks per hand."},{"h":"Scoring","b":"The team that named trump is 'the makers'. Makers take 3 or 4 tricks: 1 point. All 5 tricks (a march): 2 points. If the makers take fewer than 3, they are 'euchred' and the other team scores 2."},{"h":"Going alone","b":"The player who names trump may declare 'alone' \u2014 their partner puts their hand down and sits out. A loner who takes all 5 tricks scores 4 points. 3 or 4 tricks still scores 1."}],"variants":["Stick the dealer: if everyone passes twice, the dealer must name a trump suit.","Add both Jokers or a 'Benny' (the No. 2 card) as the highest trump of all.","Three-handed cutthroat: every player for themselves, loner hands common."],"cheat":{"goal":"First team to 10 points.","setup":"24 car
