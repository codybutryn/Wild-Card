ds (9-A). Deal 5 each, flip the up card.","key":["3-4 tricks = 1 pt","All 5 = 2 pts","Euchred = 2 to defenders","Loner all 5 = 4 pts"],"gotcha":"The left bower \u2014 the Jack of the same colour \u2014 IS a trump card, not its printed suit."}},{"id":"f-the-dealer","name":"F*ck the Dealer","aka":["Screw the Dealer","Guess the Card"],"cat":"party","players":[3,10],"best":"5-8","time":[20,40],"age":21,"diff":1,"needs":"1 standard deck, drinks or forfeits","tags":["party","drinking","adults","easy-to-teach","big-group","luck"],"blurb":"The table guesses cards and the dealer pays for every wrong answer. Nobody wants to be the dealer.","sections":[{"h":"Setup","b":"One player is the dealer. Play moves around the table to their left."},{"h":"The guessing","b":"The dealer asks the next player to guess a card rank. If they're wrong, the dealer tells them 'higher' or 'lower' and they guess again. Wrong twice: the guesser takes a penalty equal to the difference between their second guess and the actual card. Right on either guess: the DEALER takes the penalty \u2014 2 for a first-guess hit, 1 for a second."},{"h":"Rotating the dealer","b":"The dealer keeps dealing until two players in a row guess correctly. Then the deal passes to the left."},{"h":"Ending","b":"Play until the deck runs out. Some groups play three full passes of the deck."},{"h":"Playing it dry","b":"Swap penalties for points against you; highest total loses. Works identically."}],"variants":["Only give 'higher or lower' feedback if the guesser asks for it, at the cost of one penalty.","Suits count: guessing the exact card doubles the dealer's penalty.","Speed round with a 5-second guess timer."],"cheat":{"goal":"Guess the dealer's card. The dealer pays for your success.","setup":"One dealer, play moves left.","key":["Two guesses, with higher/lower after the first","First-guess hit = dealer takes 2","Second-guess hit = dealer takes 1"],"gotcha":"Two correct guesses in a row and the deal passes on."}},{"id":"five-hundred","name":"Five Hundred","aka":["500","Bid Euchre"],"cat":"trick","players":[3,6],"best":"4 (two partnerships)","time":[45,90],"age":12,"diff":3,"needs":"43 cards \u2014 a standard deck minus the 2s, 3s and black 4s, plus one joker","tags":["strategy","partners","australia","bidding","classic"],"blurb":"Australia's national card game. Euchre's bowers, a bidding auction with a kitty, and a mis\u00e8re bid for when your hand is garbage.","sections":[{"h":"Goal","b":"First partnership to 500 points. Go below -500 and you lose outright."},{"h":"The deck","b":"For four players use 43 cards: remove all 2s and 3s and the black 4s from a standard deck, then add one joker. Deal 10 cards to each player and 3 face down as the kitty."},{"h":"Trump order \u2014 same trick as Euchre","b":"The joker is the highest trump. Then the Jack of trump (right bower), then the Jack of the same-coloured suit (left bower), which counts as trump for the hand. Then A, K, Q, 10, 9 and down. Non-trump suits run A, K, Q, J, 10, 9 normally."},{"h":"Bidding","b":"Bids name a number of tricks (6 to 10) and a trump suit, or no-trump. Values ascend by suit: spades lowest, then clubs, diamonds, hearts, no-trump. Six spades is 40 points; each step up the suit ladder adds 20, and each extra trick adds 100. Ten no-trump is 520."},{"h":"Mis\u00e8re","b":"You may instead bid mis\u00e8re \u2014 you'll win ZERO tricks, playing alone while your partner sits out \u2014 worth 250. Open mis\u00e8re, played with your hand face up on the table, is worth 500 and is the boldest bid in the game."},{"h":"The kitty","b":"The winning bidder takes the 3-card kitty into hand and discards any 3. Nobody else sees them."},{"h":"Play and scoring","b":"Follow suit if you can. Make your contract and score its value; fail and subtract it. The defending side scores 10 points per trick they take (nothing during a mis\u00e8re)."}],"variants":["Three-player 500 with a 33-card deck and no partnerships.","Six-player 500 in two teams of three, using a 63-card deck with 11s, 12s and a second joker.","'Blind' bids made before looking at your hand, worth double."],"cheat":{"goal":"First partnership to 500. Below -500 and you lose.","setup":"43 cards (no 2s, 3s, black 4s, plus a joker). 10 each + 3-card kitty.","key":["Joker > right bower > left bower > A K Q 10 9","6 spades = 40, each suit step +20, each trick +100","Mis\u00e8re 250, open mis\u00e8re 500","Defenders score 10/trick"],"gotcha":"The left bower counts as trump, exactly as in Euchre."}},{"id":"five-card-draw","name":"Five-Card Draw","aka":["Draw Poker"],"cat":"casino","players":[2,6],"best":"4-5","time":[30,90],"age":18,"diff":1,"needs":"1 standard deck, chips or coins","tags":["poker","gambling","easy-to-teach","bluffing","classic","kitchen-table"],"blurb":"The kitchen-table poker your grandfather played. Five cards, one chance to swap, two rounds of betting.","sections":[{"h":"Goal","b":"Win the pot with the best five-card hand, or by betting everyone else out."},{"h":"Setup","b":"Everyone antes one chip into the pot. Deal 5 cards face down to each player."},{"h":"First betting round","b":"Starting left of the dealer, each player checks, bets, calls, raises, or folds. Some groups require 'jacks or better' to open the betting."},{"h":"The draw","b":"Each remaining player discards 0 to 3 cards (some allow 4 if you keep an Ace) and is dealt replacements. Standing pat \u2014 drawing nothing \u2014 is a strong signal, whether or not it's true."},{"h":"Second betting round","b":"Another round of betting starting with the first active player left of the dealer."},{"h":"Showdown","b":"Remaining players reveal. Best five-card hand takes the pot. See the Poker Hand Rankings card if you need it."}],"variants":["Deuces wild, or jokers added as bugs (wild for aces, straights, and flushes only).","Lowball (2-7 or A-5): the worst hand wins.","Anaconda / pass-the-trash: players pass unwanted cards to a neighbor before betting."],"cheat":{"goal":"Best five-card hand takes the pot.","setup":"Ante, deal 5 each. Bet, draw, bet.","key":["Discard up to 3 (some houses allow 4 with an Ace kept)","Two betting rounds total"],"gotcha":"Standing pat \u2014 drawing nothing \u2014 is a huge signal, true or not."}},{"id":"freecell","name":"FreeCell","aka":[],"cat":"solitaire","players":[1,1],"best":"1","time":[10,25],"age":10,"diff":2,"needs":"1 standard 52-card deck and table space","tags":["solo","strategy","quiet","brain","puzzle","one-player"],"blurb":"Every card is face up from the start, so there's no luck and no excuse. Nearly every deal is winnable.","sections":[{"h":"Goal","b":"Build all four suits up from Ace to King on the foundations."},{"h":"Setup","b":"Deal all 52 cards face up into eight columns \u2014 four columns of 7 and four of 6. Leave space for four empty 'free cells' and four foundation piles."},{"h":"Free cells","b":"Each free cell holds exactly one card, any card, at any time. It's temporary parking, and managing those four slots is the entire game."},{"h":"Tableau","b":"Build DOWN in alternating colors. You may only move one card at a time \u2014 but with free cells and empty columns you can effectively move a stack. The maximum stack you can move is (free cells + 1) \u00d7 2^(empty columns)."},{"h":"Empty columns","b":"Any card may fill an empty column. Empty columns are far more valuable than free cells, so open one early if you can."},{"h":"Winnability","b":"Of the 32,000 classic Microsoft deals, only one \u2014 game #11982 \u2014 is unsolvable. If you lose, it was almost certainly a mistake, not the shuffle."}],"variants":["Play with 3, 2, or even 1 free cell for a brutal challenge.","Baker's Game: build down in SUIT instead of alternating colors.","Seahaven Towers: ten columns, four free cells, build down in suit."],"cheat":{"goal":"Build all four suits A to K. Everything is visible.","setup":"All 52 face up in eight columns. Four free cells.","key":["Free cells hold one card each","Build down in alternating colours","Movable stack = (free cells + 1) \u00d7 2^(empty columns)"],"gotcha":"Empty columns are worth far more than free cells \u2014 open one early."}},{"id":"gin-rummy","name":"Gin Rummy","aka":["Gin"],"cat":"rummy","players":[2,2],"best":"2","time":[20,40],"age":8,"diff":2,"needs":"1 standard 52-card deck, paper for scoring","tags":["two-player","strategy","classic","quiet","no-equipment"],"blurb":"The best two-player card game there is. Build sets and runs, and knock the moment your leftovers are small enough.","sections":[{"h":"Goal","b":"Be first to 100 points across multiple hands."},{"h":"Card values","b":"Face cards are 10, Aces are 1, everything else is face value. Aces are LOW \u2014 A-2-3 is a run, Q-K-A is not."},{"h":"Setup","b":"Deal 10 cards each. Place the rest face down as the stock and flip the top card face up to start the discard pile."},{"h":"Melds","b":"A meld is either a SET (three or four of the same rank) or a RUN (three or more consecutive cards in one suit). Cards not in a meld are 'deadwood', and their total value is your deadwood count."},{"h":"Play","b":"The non-dealer may take the first upcard or pass; if both pass, the non-dealer draws from stock. After that, on your turn draw either the top of the discard pile or the top of the stock, then discard one card. You never lay melds down during play \u2014 you hold everything until you end the hand."},{"h":"Knocking","b":"When your deadwood totals 10 or less, you may knock: discard face down, lay out your melds, and show your deadwood. Your opponent then lays out their melds AND may 'lay off' their own deadwood onto your melds. You score the difference in deadwood."},{"h":"Gin and undercut","b":"Gin means zero deadwood \u2014 you score the opponent's full deadwood plus a 25-point bonus, and they may not lay off. If the opponent's deadwood ends up equal to or LOWER than the knocker's, they undercut: they score the difference plus a 25-point bonus. Never knock lazily."},{"h":"Game bonuses","b":"First to 100 gets a 100-point game bonus, plus 25 per hand won ('box' bonus). If the loser never scored, the winner's total doubles (a shutout, or 'skunk')."}],"variants":["Oklahoma Gin: the first upcard sets the maximum knock value for that hand.","Straight Gin: no knocking allowed \u2014 you must go gin.","Three-player 'cutthroat' with one player sitting out each hand."],"cheat":{"goal":"First to 100 across hands.","setup":"Deal 10 each. Stock + one upcard.","key":["Face cards 10, Aces 1 (low)","Knock at 10 deadwood or less","Gin = 0 deadwood, +25 bonus","Undercut = +25 to the opponent"],"gotcha":"Melds stay in your hand \u2014 you never lay them down until you end the hand."}},{"id":"go-fish","name":"Go Fish","aka":["Fish","Authors"],"cat":"kids","players":[2,6],"best":"3-4","time":[10,20],"age":4,"diff":1,"needs":"1 standard 52-card deck","tags":["kids","family","easy-to-teach","memory","no-equipment"],"blurb":"The first card game most people ever learn. Ask for cards, collect sets of four, remember what everyone else asked for.","sections":[{"h":"Goal","b":"Collect the most sets of four matching ranks."},{"h":"Setup","b":"Deal 7 cards each (5 each with 4 or more players). The rest goes face down in a pond in the middle."},{"h":"Play","b":"On your turn, ask one specific player for one specific rank: 'Marcus, do you have any sixes?' You must already hold at least one card of that rank. If they have any, they hand over ALL of them and you go again. If they don't, they say 'go fish' and you draw from the pond, ending your turn \u2014 unless you draw exactly what you asked for, in which case you get another turn."},{"h":"Books","b":"Whenever you collect all four of a rank, lay them face up in front of you. That's a book."},{"h":"Ending","b":"The game ends when all 13 books are made, or when the pond is empty and hands run out. Most books wins."}],"variants":["Ask for a card and receive only one, not all of them \u2014 slower and a bit more strategic.","Play with pairs instead of fours for very young children.","Authors: the same game played with a serious face and named sets."],"cheat":{"goal":"Collect the most books of four.","setup":"Deal 7 each (5 with 4+ players). Rest is the pond.","key":["You must already hold the rank you ask for","Get a card = go again","Draw what you asked for = go again"],"gotcha":"They hand over ALL matching cards, not just one."}},{"id":"golf","name":"Golf","aka":["Six-Card Golf","Polish Polka","Turtle"],"cat":"rummy","players":[2,8],"best":"3-5","time":[20,40],"age":8,"diff":1,"needs":"1 deck (2 decks for 5+ players), paper for scoring","tags":["family","easy-to-teach","group","fast","memory"],"blurb":"Lowest score wins, like real golf. You only ever see two of your own six cards \u2014 the rest is memory and nerve.","sections":[{"h":"Goal","b":"Lowest total score after nine 'holes' (hands)."},{"h":"Setup","b":"Deal 6 cards to each player, face down in a 2x3 grid in front of them. Without looking at the others, each player peeks at any two of their own cards and turns them face up. Stock face down, one card flipped to start the discard pile."},{"h":"Play","b":"On your turn, draw the top card of the stock or the discard pile. You may either swap it for any one card in your grid (placing the replaced card face up on the discard pile), or \u2014 if you drew from the stock \u2014 discard it immediately. A card drawn from the discard pile must be used."},{"h":"Ending the hand","b":"When a player has all six cards face up, everyone else gets one final turn, then all cards are revealed and scored."},{"h":"Scoring","b":"Aces 1, 2 through 10 face value, Jack and Queen 10, King 0. Here's the trick: any two cards of the same rank in the same COLUMN cancel to 0 points. Stack your matches vertically."}],"variants":["Four-card or nine-card Golf (a 3x3 grid) for shorter or longer games.","Jokers count as -2 points.","Knock version: instead of flipping all six, a player may knock to end the round, and gets penalized if they aren't lowest."],"cheat":{"goal":"Lowest score after nine holes.","setup":"6 cards each in a 2x3 grid, face down. Peek at two.","key":["K = 0","A = 1, J/Q = 10","Two matching cards in a COLUMN cancel to 0"],"gotcha":"Stack your matches vertically \u2014 a pair side by side scores full value."}},{"id":"golf-solitaire","name":"Golf Solitaire","aka":["One Foundation","Forty Thieves' cousin"],"cat":"solitaire","players":[1,1],"best":"1","time":[5,10],"age":6,"diff":1,"needs":"1 standard 52-card deck","tags":["solo","fast","easy-to-teach","quiet","one-player"],"blurb":"One long chain, up or down by one. The fastest satisfying solitaire in the deck.","sections":[{"h":"Goal","b":"Clear all 35 tableau cards onto the single foundation pile."},{"h":"Setup","b":"Deal seven columns of five cards each, all face up, overlapping so you can see every card. The bottom card of each column is playable. The remaining 17 cards are the stock."},{"h":"Play","b":"Flip one stock card to start the foundation. Then play any exposed tableau card that is exactly one rank higher OR one rank lower than the current foundation card \u2014 suits are irrelevant. Chain as long as you can."},{"h":"Stuck","b":"When no exposed card fits, flip the next stock card onto the foundation and continue. You get one pass through the stock, no reshuffles."},{"h":"Scoring","b":"Like real golf, count the cards left in the tableau at the end \u2014 lower is better. Zero is a perfect round. Play nine deals as nine holes and total your score."}],"variants":["Allow Kings to wrap around to Aces for an easier chain.","Play with a joker as a wild foundation card.","Deal six columns of six for a harder layout."],"cheat":{"goal":"Clear all 35 tableau cards. Low score wins.","setup":"Seven columns of five, all face up. 17 in stock.","key":["Play one rank up or down from the foundation","One pass through the stock"],"gotcha":"No wrapping between King and Ace unless you agree that house rule."}},{"id":"guts","name":"Guts","aka":["Two-Card Guts","Balls"],"cat":"casino","players":[3,8],"best":"5-6","time":[20,40],"age":18,"diff":1,"needs":"1 standard deck, chips","tags":["gambling","party","fast","bluffing","swingy","adults"],"blurb":"Two cards, one decision: in or out. The pot doubles every time people are wrong, and it gets ugly quickly.","sections":[{"h":"Goal","b":"Win the pot with the best two-card hand \u2014 and stay out of the pots you can't win."},{"h":"Setup","b":"Everyone antes an equal amount. Deal 2 cards face down to each player."},{"h":"The declaration","b":"Everyone takes chips under the table, then holds a closed fist over the middle. On a count of three, all hands open at once: chips means you're IN, empty hand means you're OUT. Simultaneous \u2014 no one gets information from anyone else."},{"h":"Hand rankings","b":"Pairs beat everything, ranked by pair. Otherwise it's high card, then second card, then suit if your house uses suits to break ties. A pair of aces is the nuts; 3-2 offsuit is the worst hand in the deck."},{"h":"Showdown","b":"Everyone who declared in reveals. Best hand wins the pot. Everyone ELSE who was in must match the pot \u2014 so if the pot was 20 and three players were in, the two losers each put in 20."},{"h":"Why it escalates","b":"The pot doesn't reset until exactly one player goes in. Two people going in with confidence can double a pot repeatedly, and a table of five stubborn players can turn a small ante into an enormous pot in four hands."},{"h":"A word on stakes","b":"This is the fastest-escalating card game in common circulation. Set a hard pot cap before the first deal \u2014 most home games use one \u2014 or agree the pot resets after a fixed number of rounds. Play with pennies, matchsticks, or a cap you're all fine losing."}],"variants":["Three-card guts, with three-card poker rankings (straights and flushes count).","Sequential declaration: players declare in turn order instead of simultaneously, which rewards position.","Guts with a 'ghost hand' dealt to the table that everyone in must also beat."],"cheat":{"goal":"Best two-card hand takes the pot.","setup":"Ante, 2 cards each, simultaneous in-or-out declaration.","key":["Pairs beat everything, then high card","Losers who were IN match the whole pot"],"gotcha":"The pot doubles every time two people are wrong. Set a pot cap before you deal."}},{"id":"hand-and-foot","name":"Hand and Foot","aka":["Hand & Foot Canasta"],"cat":"rummy","players":[2,6],"best":"4 (two partnerships)","time":[60,120],"age":10,"diff":2,"needs":"One deck per player plus one extra, all jokers included","tags":["partners","family","long-game","melding","group","classic"],"blurb":"Canasta's friendlier American cousin. You get two hands \u2014 you play the first one to earn the right to pick up the second.","sections":[{"h":"Goal","b":"Highest score after four rounds. Partners sit across."},{"h":"Setup","b":"Shuffle one deck per player plus one extra (5 decks for 4 players), jokers included. Each player gets TWO stacks of 11 cards: the 'hand', which they pick up, and the 'foot', which stays face down and untouched. Traditionally each player deals their opponent's 11 by feel, and dealing exactly 11 without counting earns a bonus."},{"h":"Wild cards and threes","b":"Jokers (50 points) and 2s (20 points) are wild. Red 3s are a 100-point penalty each \u2014 discard them and draw a replacement. Black 3s block: a black 3 on the discard pile stops the next player from taking it."},{"h":"Your turn","b":"Draw two cards from the stock (or take the top 7 of the discard pile if you can meld the top card immediately \u2014 house rules vary), meld as much as you like, then discard one."},{"h":"Melds and books","b":"Melds are three or more cards of the same rank, shared with your partner. No runs. When a meld reaches SEVEN cards it's a book (also called a pile): square it up and mark it. A clean book \u2014 all natural, no wilds \u2014 is 500 points; a dirty book with wilds is 300. Cap wilds at two per book."},{"h":"Getting into your foot","b":"When your hand is empty, you pick up your foot and keep playing. If you emptied your hand by discarding, you must wait until your next turn to start the foot."},{"h":"Going out","b":"To go out, your partnership needs at least two clean books and two dirty books (rules vary \u2014 agree first), you must be playing from your foot, and you must ask your partner's permission. Going out is worth 100."},{"h":"Round minimums","b":"Your team's first meld each round must total: 50 in round one, 90 in round two, 120 in round three, 150 in round four."},{"h":"Card values","b":"Joker 50, Ace and 2 twenty, King through 8 ten, 7 through 4 five. Add your books and melds, subtract cards left in your hand and foot."}],"variants":["Five rounds instead of four, with a 190-point minimum on the last.","Draw-two-discard-one versus draw-one \u2014 the faster version keeps rounds under an hour.","Allow taking the whole discard pile like Canasta instead of the top seven."],"cheat":{"goal":"Highest score after four rounds.","setup":"One deck per player plus one. Two stacks of 11 each \u2014 hand, then foot.","key":["Jokers 50, 2s 20 \u2014 wild","Red 3 = -100","Clean book 500, dirty book 300","Minimums: 50 / 90 / 120 / 150"],"gotcha":"You must be in your foot with the required books before you can go out \u2014 and you must ask your partner."}},{"id":"hearts","name":"Hearts","aka":["Black Lady","Chase the Lady"],"cat":"trick","players":[3,6],"best":"4","time":[30,60],"age":10,"diff":2,"needs":"1 standard 52-card deck","tags":["strategy","classic","quiet","no-equipment"],"blurb":"A trick-taking game where you want to LOSE. Dodge every heart and the dreaded Queen of Spades \u2014 or take all of them and shoot the moon.","sections":[{"h":"Goal","b":"Have the FEWEST points when someone hits 100. Each heart you capture is 1 point, and the Queen of Spades is 13 points. Points are bad."},{"h":"Setup","b":"Deal the whole deck out evenly \u2014 13 cards each with 4 players. With 3 players remove the 2 of diamonds (17 each). With 5, remove the 2 of diamonds and 2 of clubs (10 each). With 6, remove both black 2s (8 each). Aces are high."},{"h":"The passing round","b":"Before play, everyone picks 3 cards and passes them face down. The direction rotates each hand: left, right, across, then no pass at all. Pick up your received cards only after you've passed your own."},{"h":"Play","b":"Whoever holds the 2 of clubs leads it. Play proceeds clockwise and you must follow suit if you can. If you can't, you may play anything \u2014 this is how you dump hearts and the Queen of Spades on someone else. Highest card of the led suit wins the trick and leads the next one."},{"h":"Two key restrictions","b":"No hearts or the Queen of Spades may be played on the very first trick. Hearts may not be LED until hearts have been 'broken' (someone has discarded a heart on an earlier trick) \u2014 unless hearts are all you hold."},{"h":"Scoring","b":"After all 13 tricks, count what you captured: 1 point per heart, 13 for the Queen of Spades. That's 26 points on the table each hand. First player to reach 100 ends the game, and the LOWEST score wins."},{"h":"Shooting the moon","b":"If one player takes all 13 hearts AND the Queen of Spades, they score 0 and everyone else takes 26. It's a huge swing and the reason you should never let one player run away with the hearts."}],"variants":["Jack of Diamonds: capturing it subtracts 10 points from your score.","Shooting the sun (taking all 13 tricks) is sometimes worth 52 points to the others instead of 26.","Omnibus Hearts: shooting the moon can be declared to add 26 to everyone else OR subtract 26 from yourself."],"cheat":{"goal":"Fewest points wins. Points are bad.","setup":"Deal all 52 (13 each). Pass 3 cards \u2014 left, right, across, then none.","key":["Each heart = 1 pt","Q\u2660 = 13 pts","26 pts on the table per hand","Game ends at 100"],"gotcha":"You can't LEAD hearts until hearts are broken, and no hearts or Q\u2660 on the first trick."}},{"id":"horse-race","name":"Horse Race","aka":["Kentucky Derby","Race Horse"],"cat":"party","players":[3,12],"best":"6-10","time":[15,30],"age":12,"diff":1,"needs":"1 standard deck, optional chips for betting","tags":["party","big-group","betting","funny","easy-to-teach","spectator"],"blurb":"The four Aces race up a track of face-down cards. Everyone bets on a suit and yells at a piece of cardboard.","sections":[{"h":"Setup","b":"Pull the four Aces and lay them in a row \u2014 these are the horses. Deal 6 to 8 cards face DOWN in a vertical line beside them; these are the furlong markers, forming the track. Shuffle the rest as the draw pile."},{"h":"Betting","b":"Each player bets on one suit \u2014 with chips, drinks, or just bragging rights. Multiple players can back the same horse."},{"h":"The race","b":"Flip the top card of the draw pile. The Ace matching that card's suit advances one space up the track. Keep flipping."},{"h":"The setback rule","b":"When ALL FOUR horses have passed a furlong marker, flip that marker face up. The horse matching the marker's suit moves BACK one space. This is what makes the race swing wildly at the end."},{"h":"Winning","b":"First Ace to pass the final marker wins. Everyone who backed that suit collects; everyone else pays."}],"variants":["Longer track (10+ markers) for a more dramatic race.","Pari-mutuel betting where the pot splits among winners by stake size.","Assign each player a horse instead of letting them choose."],"cheat":{"goal":"Back the winning suit.","setup":"Four Aces as horses, 6-8 face-down markers as the track.","key":["Flip a card, that suit's Ace advances","Everyone bets on a suit first"],"gotcha":"When all four horses pass a marker, it flips and sends that suit BACK one."}},{"id":"indian-rummy","name":"Indian Rummy","aka":["13-Card Rummy","Paplu"],"cat":"rummy","players":[2,6],"best":"4-6","time":[30,60],"age":10,"diff":2,"needs":"2 decks plus jokers, paper for scoring","tags":["strategy","classic","india","melding","family","group"],"blurb":"Thirteen cards and one hard requirement: you cannot win without a pure sequence, no matter how good the rest of your hand is.","sections":[{"h":"Goal","b":"Arrange all 13 cards into valid sets and sequences and declare before anyone else. Lowest points across hands wins."},{"h":"Setup","b":"Use two decks with jokers. Deal 13 cards to each player. Flip one card from the stock \u2014 that card's rank becomes the WILD JOKER for the hand, in every suit, alongside the printed jokers."},{"h":"Valid groupings","b":"PURE SEQUENCE: 3+ consecutive cards in one suit with NO joker. IMPURE SEQUENCE: same, but using a joker to fill a gap. SET: 3 or 4 cards of the same rank in different suits, jokers allowed."},{"h":"The requirement everyone forgets","b":"A valid declaration needs at least TWO sequences, and at least one of them must be pure. Thirteen beautifully melded cards with no pure sequence is an invalid declaration \u2014 and declaring invalid costs you the maximum penalty."},{"h":"Play","b":"Draw from the stock or the discard pile, then discard one. You always hold 13 cards between turns."},{"h":"Declaring","b":"When your hand is complete, discard your 14th card face down to the 'finish' slot and declare. Lay your hand out in groups for everyone to verify."},{"h":"Scoring","b":"The winner scores 0. Everyone else counts unmatched cards: face cards and Aces 10 each, number cards face value, jokers 0 \u2014 capped at 80 points. A player with no pure sequence at all counts their whole hand, up to that cap."}],"variants":["Points rummy: a single hand played for a fixed value per point.","Pool rummy (101 or 201): players are eliminated when they cross the total.","Deals rummy: a fixed number of deals with chips."],"cheat":{"goal":"Meld all 13 cards and declare.","setup":"Two decks + jokers, 13 cards each. Flip a card to set the wild joker rank.","key":["Need 2+ sequences","At least ONE must be pure (no joker)","Faces and Aces 10, numbers face value, capped at 80"],"gotcha":"No pure sequence means your declaration is invalid and you take the maximum penalty."}},{"id":"irish-snap","name":"Irish Snap","aka":["Snap Rules","Count Snap"],"cat":"speed","players":[3,8],"best":"4-6","time":[10,20],"age":8,"diff":1,"needs":"1 standard 52-card deck","tags":["party","fast","loud","reflexes","drinking-optional","big-group","easy-to-teach"],"blurb":"Count out loud around the table while flipping cards. When the number you say matches the card you flip, everyone dives for the pile.","sections":[{"h":"Goal","b":"Be the first to get rid of all your cards."},{"h":"Setup","b":"Deal the whole deck out face down. Nobody looks at their cards."},{"h":"Play","b":"Going clockwise, players flip their top card into a central pile while calling out the sequence: the first player says 'Ace', the next says 'two', then 'three', up to 'King', then back to 'Ace' again. Keep the rhythm going."},{"h":"The snap","b":"When the card someone flips MATCHES the rank they just called \u2014 they say 'seven' and flip a seven \u2014 everyone slams a hand onto the pile. The LAST person to get their hand down takes the entire pile into their stack."},{"h":"False snaps","b":"Slap when there's no match and you take the pile yourself. In a drinking game the penalty is a drink instead."},{"h":"Winning","b":"Play your last card without having to pick up and you're out \u2014 in the good way. Last player holding cards loses."}],"variants":["Add extra snap conditions: two matching cards in a row, or a Jack.","Count backwards from King for a much harder rhythm.","Silent version where you must slap without anyone calling numbers \u2014 pure card matching."],"cheat":{"goal":"Shed all your cards.","setup":"Deal the deck out. Count aloud A,2,3\u2026K as you flip.","key":["Card matches the number called = everyone slaps","LAST hand down takes the pile"],"gotcha":"False slap and you take the pile yourself."}},{"id":"kalooki","name":"Kalooki","aka":["Kaluki","Caloochi","Kalooki 51","Jamaican Rummy"],"cat":"rummy","players":[2,6],"best":"4","time":[45,75],"age":10,"diff":2,"needs":"2 decks plus 4 jokers, paper for scoring","tags":["melding","classic","group","strategy","caribbean","family"],"blurb":"Rummy with a high price of admission: your first meld has to total 51 points before you can put anything down at all.","sections":[{"h":"Goal","b":"Be first to shed every card. Lowest total penalty across hands wins the game."},{"h":"Card values","b":"Joker 25 (or 50 in some houses), Ace 15, face cards 10, number cards face value. Aces are high or low but never wrap around a corner."},{"h":"Setup","b":"Two decks plus four jokers. Deal 13 to 15 cards each depending on the version. Stock face down, one card face up."},{"h":"The 51 rule","b":"Your FIRST meld must total at least 51 points in one go. Until you make it you cannot lay down anything, cannot lay off on others, and are simply drawing and discarding. Getting there usually takes two jokers or a run of high cards."},{"h":"Melds","b":"Sets of 3+ of a rank (all different suits) or runs of 3+ in a suit. Jokers are wild but a meld may hold only one, and a set of three cannot be two jokers and a card."},{"h":"Buying back a joker","b":"If a joker sits in a meld on the table, any player who holds the actual card it represents may swap it in and take the joker into their hand. This is the move that wins games."},{"h":"Scoring","b":"When someone goes out, everyone else totals the cards left in hand as penalty points. Play an agreed number of rounds, or until someone crosses a limit."}],"variants":["Kalooki 40: a 40-point opening meld instead of 51, which speeds the game up considerably.","Contract Kalooki with escalating requirements each deal.","Super Kalooki: going out in one turn without any prior meld, worth a large bonus."],"cheat":{"goal":"Shed all your cards. Lowest penalty total wins.","setup":"Two decks + 4 jokers, 13-15 cards each.","key":["Joker 25, Ace 15, faces 10","First meld must total 51+","One joker maximum per meld"],"gotcha":"Until you hit 51 you cannot meld or lay off anything at all."}},{"id":"kemps","name":"Kemps","aka":["Canes","Kent","Cash"],"cat":"party","players":[4,8],"best":"6 (three pairs)","time":[20,40],"age":10,"diff":1,"needs":"1 standard deck (2 decks for 8 players)","tags":["party","partners","funny","social","fast","signals","big-group"],"blurb":"You and your partner agree on a secret signal beforehand. Everyone else spends the game watching your face.","sections":[{"h":"Goal","b":"Collect four of a kind and get your partner to call 'Kemps' before anyone else notices. Losing spells out K-E-M-P-S one letter at a time."},{"h":"Before you start","b":"Each pair goes off and privately agrees on a signal \u2014 a wink, a nose scratch, a specific word, tapping the table twice. Make it subtle. The other teams will be looking directly at you all game."},{"h":"Setup","b":"Partners sit apart, not next to each other. Deal 4 cards to each player and 4 face up in the middle. Keep the rest as a stock."},{"h":"Play \u2014 everyone at once","b":"There are no turns. Anyone may swap any number of their cards for the same number of face-up middle cards, at any time. When nobody wants any of the four middle cards, the dealer sweeps them away and flips four new ones."},{"h":"Calling Kemps","b":"When you have four of a kind, signal your partner. If they spot it, they shout 'Kemps!' and your team wins the round. If they miss it, you're stuck holding it while everyone stares at you."},{"h":"Counter-Kemps","b":"If you believe an OPPONENT has four of a kind, shout 'Counter-Kemps!' (or 'Cut!') and name the player. If you're right, THEIR team takes the letter. If you're wrong, yours does."},{"h":"Ending","b":"A team that spells K-E-M-P-S is out. Last team standing wins. Change your signal between games \u2014 everyone has worked out your nose scratch by then."}],"variants":["Silent Kemps: no talking at all, so signals have to be visual.","Play with 5 cards each and five in the middle for a faster, looser game.","Three-player teams for very large groups."],"cheat":{"goal":"Get four of a kind and have your partner call it.","setup":"Pairs sit apart. 4 cards each, 4 face up in the middle.","key":["Agree a secret signal beforehand","Swap freely, no turns","Counter-Kemps an opponent to flip the penalty"],"gotcha":"Wrong Counter-Kemps and YOUR team takes the letter."}},{"id":"killer","name":"Killer","aka":["Wink Murder","Ace of Spades","Murder Wink"],"cat":"party","players":[5,25],"best":"8-15","time":[10,25],"age":8,"diff":1,"needs":"One card per player \u2014 the Ace of Spades is the killer","tags":["party","big-group","hidden-roles","social-deduction","no-deck-needed","icebreaker","kids"],"blurb":"The simplest hidden-role game there is. One killer, one wink at a time, and everyone else trying to catch them looking.","sections":[{"h":"Goal","b":"The killer tries to eliminate everyone without being identified. Everyone else tries to name the killer before they're taken out."},{"h":"Setup with cards","b":"Count out one card per player, making sure the Ace of Spades is among them. For a version with a detective, include the Ace of Hearts too. Shuffle, deal one face down to each player, everyone peeks in secret. Ace of Spades is the killer; Ace of Hearts, if used, is the detective who knows nothing extra but must be the one to accuse."},{"h":"Play","b":"Everyone mingles or sits in a loose circle, making eye contact freely. The killer eliminates people by catching their eye and winking at them. If you're winked at, count silently to five, then die \u2014 dramatically, out loud, and convincingly. Then reveal your card and sit out."},{"h":"Accusing","b":"Any living player may accuse someone at any time \u2014 but you must find a second: another living player who says 'I second that' before the accusation counts. Both accusers point on a count of three. If they name the killer, the game is over. If they're wrong, both accusers are out immediately."},{"h":"Winning","b":"The killer wins when only two players remain. Everyone else wins by correctly naming them."},{"h":"Why the two-accuser rule matters","b":"Without it, people fire off random guesses and the game ends in thirty seconds. Requiring a second forces conversation, which is the entire point."}],"variants":["Two killers for groups over 15 \u2014 they don't know each other's identity, which is chaos.","Long-form Assassin: played over days, where 'killing' means handing your target a specific object or saying a code word.","Wink Murder for kids: seated circle, no accusing rule, just find the winker."],"cheat":{"goal":"The killer eliminates everyone. Everyone else names the killer.","setup":"One card each including the A\u2660 \u2014 that's the killer.","key":["Killer winks to kill","Victims count to five, then die loudly","Accusation needs a second"],"gotcha":"A wrong accusation takes BOTH accusers out \u2014 that's what forces real discussion."}},{"id":"kings-cup","name":"Kings Cup","aka":["Ring of Fire","Circle of Death","King's Cup","Waterfall"],"cat":"party","players":[4,12],"best":"6-8","time":[30,60],"age":21,"diff":1,"needs":"1 standard deck, one central cup, drinks (works fine with any forfeit instead)","tags":["party","drinking","big-group","adults","easy-to-teach","no-strategy"],"blurb":"Every card is a rule. Spread the deck in a ring around a cup and take turns finding out what happens next.","sections":[{"h":"Setup","b":"Put an empty cup in the middle of the table. Spread the deck face down in an unbroken circle around it. Players sit around the table."},{"h":"Play","b":"Take turns drawing one card. Do what the card says, then place it back outside the ring \u2014 if you break the circle, you take a penalty."},{"h":"The standard rule set","b":"ACE \u2014 Waterfall: everyone starts drinking and no one may stop until the person to their right does. 2 \u2014 You: choose someone. 3 \u2014 Me: it's you. 4 \u2014 Floor: last to touch the floor. 5 \u2014 Guys. 6 \u2014 Chicks. 7 \u2014 Heaven: last to point at the ceiling. 8 \u2014 Mate: pick a partner who matches you for the rest of the game. 9 \u2014 Rhyme: say a word, go around rhyming until someone fails. 10 \u2014 Categories: name a category, go around naming items until someone fails."},{"h":"Face cards","b":"JACK \u2014 Never Have I Ever, or a new rule of your choosing. QUEEN \u2014 Question Master: anyone who answers your question takes the penalty, until the next Queen. KING \u2014 pour some of your drink into the center cup. The person who draws the FOURTH king drinks the whole thing and the game ends."},{"h":"House rules","b":"Everyone plays this differently and everyone insists their version is correct. Agree on the card list out loud before the first draw \u2014 it saves twenty minutes of arguing later."},{"h":"Playing it dry","b":"It works completely without alcohol: swap drinks for a silly forfeit, a point against you, a spoonful of something sour, or a push-up. The card prompts are the actual game."}],"variants":["Assign your own rules to each rank before you start \u2014 the fastest way to a fresh game.","'Jack = make a rule' is the most common house addition.","Play with a soft drink center cup so nobody has to finish anything serious."],"cheat":{"goal":"Draw cards, do what they say.","setup":"Deck spread in a ring around a centre cup.","key":["A waterfall \u00b7 2 you \u00b7 3 me \u00b7 4 floor \u00b7 5 guys \u00b7 6 chicks","7 heaven \u00b7 8 mate \u00b7 9 rhyme \u00b7 10 categories","J rule \u00b7 Q question master \u00b7 K pour"],"gotcha":"Fourth King drinks the centre cup and ends the game. Agree the card list out loud first."}},{"id":"kings-corner","name":"Kings in the Corner","aka":["Kings Corners"],"cat":"kids","players":[2,6],"best":"3-4","time":[15,30],"age":6,"diff":1,"needs":"1 standard 52-card deck","tags":["family","kids","easy-to-teach","solitaire-like","quiet"],"blurb":"Group solitaire. Build descending alternating-color stacks in a cross layout, and only Kings unlock the corners.","sections":[{"h":"Goal","b":"Be first to empty your hand. Play multiple rounds to a point total if you like."},{"h":"Setup","b":"Deal 7 cards to each player. Put the rest face down in the middle and flip four cards face up around it \u2014 one at each side, forming a cross."},{"h":"Play","b":"On your turn, draw one card, then make as many plays as you can. Play cards onto the four cross piles in DESCENDING rank and ALTERNATING colors (a red 9 goes on a black 10). You may also move an entire pile onto another pile if it fits the sequence, freeing that spot."},{"h":"The corners","b":"Only a King may start a pile in one of the four corner positions. Once a King is placed there, build down on it in alternating colors like any other pile."},{"h":"Ending","b":"First player to play their last card wins. Everyone else scores penalty points: 10 for each King left in hand, 1 for every other card. Lowest score after an agreed number of rounds wins."}],"variants":["Play to 25 penalty points as the game-ending threshold.","Allow a player to skip drawing if they can already play.","Deal 5 cards for a faster game with more players."],"cheat":{"goal":"Empty your hand.","setup":"7 cards each. Four face-up cards in a cross around the stock.","key":["Build down in alternating colours","Move whole piles to free a spot","Draw one at the start of every turn"],"gotcha":"Only a King may start a corner pile."}},{"id":"klondike","name":"Klondike Solitaire","aka":["Solitaire","Patience","Classic Solitaire"],"cat":"solitaire","players":[1,1],"best":"1","time":[10,20],"age":8,"diff":1,"needs":"1 standard 52-card deck","tags":["solo","classic","quiet","brain","one-player"],"blurb":"The one that came with your computer. Only about a third of deals are winnable, so losing isn't your fault.","sections":[{"h":"Goal","b":"Build all four suits up from Ace to King in the foundation piles."},{"h":"Setup","b":"Deal seven columns left to right: 1 card in the first, 2 in the second, up to 7 in the seventh. Only the top card of each column is face up. The remaining 24 cards form the stock."},{"h":"The tableau","b":"Build DOWN in alternating colors \u2014 a black 7 goes on a red 8. You may move a single card or an entire face-up sequence. When you move cards off a face-down card, flip it. Empty columns can only be filled by a King (or a sequence headed by a King)."},{"h":"The foundations","b":"Four piles above the tableau, one per suit, built UP from Ace to King. Aces go up as soon as they're available."},{"h":"The stock","b":"Turn cards from the stock to a waste pile \u2014 three at a time in the classic version (only the top one is playable), or one at a time for the easier version. You may typically go through the stock unlimited times when drawing three, or three times when drawing one."},{"h":"Winning","b":"All 52 cards on the foundations. Roughly 80% of deals are theoretically solvable with perfect play and perfect information, but only about 30-45% are won in practice with three-card draw."}],"variants":["Vegas scoring: pay 52 per deal, earn 5 per card on the foundations, limited stock passes.","Draw-one, unlimited passes for a much easier game.","Thoughtful Solitaire: all cards visible from the start, which turns it into a pure puzzle."],"cheat":{"goal":"Build all four suits A to K on the foundations.","setup":"Seven columns, 1 to 7 cards, top card face up. 24 in stock.","key":["Tableau builds down, alternating colours","Only a King fills an empty column","Draw 3 (classic) or 1 (easier)"],"gotcha":"Only about a third of three-card-draw deals actually get won. It's usually not you."}},{"id":"mafia","name":"Mafia","aka":["Party Mafia"],"cat":"party","players":[7,20],"best":"10-14","time":[20,45],"age":12,"diff":2,"needs":"One card per player (to assign roles) and a moderator","tags":["party","big-group","social-deduction","bluffing","no-deck-needed","hidden-roles","talking"],"blurb":"A social deduction classic. The cards only assign secret roles \u2014 the actual game is the argument.","sections":[{"h":"Goal","b":"The town wins by eliminating every mafia member. The mafia wins when they equal or outnumber the town."},{"h":"Assigning roles with cards","b":"Pick one card per player. Face cards or a chosen suit are the mafia \u2014 a common split is 1 mafia per 3-4 players. For 10 players: 3 mafia (say, three Kings), 1 doctor (an Ace), 1 detective (a Queen), and 5 townspeople (number cards). Shuffle, deal one face down to each player, and have everyone peek without showing anyone."},{"h":"The moderator","b":"One person does NOT get a card \u2014 they run the game. They know every role, narrate the phases, and never lie about the rules (only about nothing). A good moderator makes or breaks this game."},{"h":"Night phase","b":"Moderator: 'Everyone close your eyes.' Then, in order: 'Mafia, open your eyes and agree on a victim.' (They point silently.) 'Mafia, close your eyes.' 'Doctor, open your eyes \u2014 who do you save?' 'Detective, open your eyes \u2014 who do you investigate?' The moderator gives the detective a silent thumbs up or down."},{"h":"Day phase","b":"'Everyone open your eyes.' The moderator announces who died in the night (or that the doctor saved them) and tells a short story about it. The dead player reveals their role and is out \u2014 no talking, no hinting. Then the town debates and votes to eliminate one person they suspect. Majority rules; the eliminated player reveals their card."},{"h":"Repeat","b":"Alternate night and day until one side wins."},{"h":"Moderator tips","b":"Set a talking time limit (3-5 minutes) so the day phase doesn't drag. Have a rule that dead players stay silent and don't react. Ask everyone to make noise during the night phase (tap the table) so the mafia's movement isn't audible."}],"variants":["Add roles: Vigilante (kills at night), Jester (wins if the town votes them out), Bodyguard, Serial Killer.","Mafia with no moderator using a card-based automated night phase.","'One Night' style: a single night and a single vote, for a 10-minute version."],"cheat":{"goal":"Town kills all mafia. Mafia reach parity with the town.","setup":"One card each. Kings = mafia, Ace = doctor, Queen = detective, numbers = town.","key":["~1 mafia per 3-4 players","10 players: 3 mafia, 1 doctor, 1 detective, 5 town","Moderator holds no card"],"gotcha":"Dead players say nothing and react to nothing \u2014 the game dies without that rule."}},{"id":"mao","name":"Mao","aka":["Bartok","Mau","The Game Where Nobody Tells You The Rules"],"cat":"party","players":[3,8],"best":"4-6","time":[20,45],"age":12,"diff":2,"needs":"1 standard deck (2 for large groups)","tags":["party","funny","social","deduction","group","cruel"],"blurb":"A shedding game whose rules you are not allowed to be told. You learn by breaking them and getting penalized.","sections":[{"h":"The one thing you may say out loud","b":"The dealer opens with the traditional line: 'The only rule I may tell you is this one.' Everything else, new players must deduce from penalties. Do not explain the rules. That IS the game."},{"h":"Goal","b":"Be the first to play all your cards. The winner of each hand becomes the next dealer and gets to invent one new secret rule."},{"h":"Setup","b":"Deal 5 to 7 cards each, stock face down, one card face up."},{"h":"The underlying game","b":"Underneath the ceremony it's Crazy Eights: play a card matching the top of the discard pile in suit or rank, or draw if you can't."},{"h":"A starter rule set (for the dealer's eyes)","b":"Say 'have a nice day' when you play a 7. Say 'Mao' when you play your second-to-last card. Reverse direction on a King. Skip the next player on an Ace. Never say the word 'game' or the number of the card you played. Don't touch the discard pile with your left hand. Speaking out of turn is a penalty."},{"h":"Penalties","b":"When someone breaks a rule, the dealer says 'penalty card \u2014 failure to greet the seven' and hands them a card. You name the infraction but never explain the rule behind it. A player may not be penalized for breaking a rule that was created after their last turn."},{"h":"Point of order","b":"Any player may call 'point of order' to pause play and discuss anything \u2014 except the rules. This is entirely for the dealer's amusement."},{"h":"Playing it kindly","b":"Mao is genuinely funny with a group that finds confusion fun, and genuinely miserable for anyone who doesn't. Read the room, keep the rule set small, and let new players win a hand."}],"variants":["Bartok: the same idea but the winner announces their new rule out loud, which makes it welcoming instead of hazing.","Cap the rule set at seven so hands don't take forty minutes.","Cumulative Mao: rules carry over between sessions, which gets absurd fast."],"cheat":{"goal":"Shed your cards. You are not allowed to be told the rules.","setup":"Deal 5-7 each. Underneath, it's Crazy Eights.","key":["Penalty card for every infraction","Name the infraction, never the rule","Winner invents one new secret rule"],"gotcha":"Nobody may be penalised for a rule created after their last turn."}},{"id":"memory","name":"Memory","aka":["Concentration","Pelmanism","Pairs","Match Match"],"cat":"kids","players":[1,8],"best":"2-4","time":[10,20],"age":3,"diff":1,"needs":"1 standard 52-card deck and table space","tags":["kids","family","memory","solo-friendly","quiet","brain"],"blurb":"Flip two, hope they match. The purest working-memory test in the deck, and small children routinely destroy adults at it.","sections":[{"h":"Goal","b":"Collect the most pairs."},{"h":"Setup","b":"Shuffle and lay all 52 cards face down in a grid. For young kids use only 20 or 24 cards (10-12 pairs)."},{"h":"Play","b":"On your turn, flip two cards face up so everyone can see them. If they match in rank, take the pair and go again. If they don't, turn them back face down in exactly the same spots and play passes left."},{"h":"Ending","b":"Play until the table is clear. Most pairs wins."}],"variants":["Match by rank AND color for a harder game.","Solo mode: clear the grid in as few flips as possible and try to beat your record.","Speed Memory: a timer runs and the pair count at time's up decides it."],"cheat":{"goal":"Collect the most pairs.","setup":"All 52 face down in a grid. Use 20-24 cards for young kids.","key":["Flip two","Match = keep them and go again","No match = flip back in the SAME spots"],"gotcha":"Turn non-matches back exactly where they were, or the game falls apart."}},{"id":"nertz","name":"Nertz","aka":["Nerts","Pounce","Racing Demon","Peanuts"],"cat":"speed","players":[2,8],"best":"4","time":[20,40],"age":10,"diff":2,"needs":"One full deck per player, each with a DIFFERENT back design","tags":["chaotic","fast","loud","group","party","real-time"],"blurb":"Competitive multiplayer solitaire played all at once, at speed, with everyone shouting. Nobody takes turns.","sections":[{"h":"Goal","b":"First player to 100 points. Every player uses their own deck with a distinct back so cards can be sorted out later."},{"h":"Setup","b":"Each player shuffles their own deck and lays out: a 'Nertz pile' of 13 cards face down with the top one face up, plus 4 cards face up in a row (your work piles). The rest stays in your hand as your stock."},{"h":"Play \u2014 everyone at once","b":"There are no turns. Play as fast as you can. In the middle of the table, anyone may start a communal foundation pile by playing an Ace, then build UP on it in suit (A-2-3...K). Any player may play onto any foundation at any time."},{"h":"Your own tableau","b":"Your 4 work piles build DOWN in alternating colors, like Klondike. You can move whole sequences between work piles. Empty work piles must be refilled from your Nertz pile. Deal three cards at a time from your stock to a personal waste pile, playing the top card whenever it's useful."},{"h":"Calling Nertz","b":"The moment your Nertz pile is empty, slam your hand down and yell 'Nertz!' Play stops immediately, everywhere."},{"h":"Scoring","b":"Each player sorts the middle piles by card back and counts their own: +1 point per card played to the foundations, -2 points for every card still in your Nertz pile. The player who called Nertz gets a +10 bonus."}],"variants":["Team Nertz with partners sharing a score.","Play to 50 for a shorter game.","Solitaire Nertz: a single player racing a timer."],"cheat":{"goal":"First to 100. Everyone plays at once \u2014 no turns.","setup":"One deck each with different backs. 13-card Nertz pile, 4 work piles, rest in hand.","key":["Centre foundations: Ace up, in suit","Work piles: down, alternating colours","+1 per card to the centre","-2 per card left in your Nertz pile","+10 for calling Nertz"],"gotcha":"Anyone can play on any centre pile at any moment \u2014 speed beats planning."}},{"id":"oh-hell","name":"Oh Hell","aka":["Oh Heck","Up and Down the River","Blackout","Nomination Whist"],"cat":"trick","players":[3,7],"best":"4-5","time":[30,50],"age":8,"diff":2,"needs":"1 standard 52-card deck, paper for scoring","tags":["strategy","classic","group","good-for-mixed-skill"],"blurb":"Bid exactly how many tricks you'll take \u2014 no more, no less. Hand sizes grow and shrink, and the dealer isn't allowed to make it easy.","sections":[{"h":"Goal","b":"Most points after the final hand. You only score by nailing your bid exactly."},{"h":"Setup","b":"Hand 1 deals 1 card each, hand 2 deals 2, and so on up to the maximum the deck allows, then back down to 1. (Shorter version: just go up, or just down.) After dealing, flip the next card to set trump; on the last hand where the deck runs out, play with no trump."},{"h":"Bidding","b":"Starting left of the dealer, everyone bids the number of tricks they will take, including 0. The dealer bids last and may NOT bid a number that makes the total bids equal the number of tricks available \u2014 so someone is always going to be wrong. That's the whole game."},{"h":"Play","b":"Left of dealer leads. Follow suit if you can, otherwise play anything. Highest trump wins, else highest card of the led suit."},{"h":"Scoring","b":"Hit your bid exactly: 10 points plus 1 per trick taken. Miss by any amount: 0 points (or in the harsher version, minus 1 per trick over or under). A successful bid of 0 scores 10."}],"variants":["Score 10 + tricks only on exact bids; some groups score 5 + tricks.","No-trump on every hand for a purer skill game.","Blind bidding: everyone bids simultaneously on a count of three."],"cheat":{"goal":"Bid your tricks exactly. Miss by one and you get nothing.","setup":"Hand sizes climb 1,2,3\u2026 then back down. Flip a card for trump.","key":["Exact bid = 10 + tricks","Miss = 0","Dealer bids last"],"gotcha":"The dealer may not bid the number that makes the bids add up to the tricks available."}},{"id":"old-maid","name":"Old Maid","aka":["Scabby Queen","Black Peter"],"cat":"kids","players":[2,8],"best":"3-5","time":[10,15],"age":4,"diff":1,"needs":"51 cards (remove one Queen)","tags":["kids","family","easy-to-teach","bluffing-lite","fast"],"blurb":"Pair everything up and pray you aren't stuck holding the odd Queen at the end.","sections":[{"h":"Goal","b":"Don't be the player left holding the unmatched Queen."},{"h":"Setup","b":"Remove one Queen from the deck (usually a black one), leaving 51 cards. Deal them all out; uneven hands are fine."},{"h":"Play","b":"Everyone starts by laying down any pairs they were dealt. Then, going clockwise, each player fans their cards face down and offers them to the player on their left, who draws one blindly. If it makes a pair, they lay it down."},{"h":"Ending","b":"Play continues until all pairs are laid down and one player is left holding the Old Maid. That player loses; everyone else wins."},{"h":"The real skill","b":"How you hold your fan. Wiggling the Old Maid, or leaving it slightly proud, is the entire game for children."}],"variants":["Remove an Ace or a Joker instead so the 'maid' is a different card.","Play with two odd cards for a bigger group.","Add a rule that the losing player deals the next hand."],"cheat":{"goal":"Don't be holding the odd Queen.","setup":"Remove one Queen (51 cards). Deal them all out.","key":["Lay down pairs","Draw blind from the player on your right"],"gotcha":"How you fan your cards is the whole game \u2014 don't telegraph the maid."}},{"id":"omaha","name":"Omaha","aka":["Pot-Limit Omaha","PLO","Omaha Hold'em"],"cat":"casino","players":[2,10],"best":"6-9","time":[45,180],"age":18,"diff":3,"needs":"1 standard deck, chips, a dealer button","tags":["poker","gambling","strategy","hard","big-group"],"blurb":"Hold'em with four hole cards and one unforgiving rule: exactly two of them play. Huge hands, huge pots, huge mistakes.","sections":[{"h":"Goal","b":"Win chips with the best five-card hand at showdown, or by betting everyone out."},{"h":"Setup","b":"Same structure as Hold'em \u2014 dealer button, small blind, big blind. Deal FOUR cards face down to each player."},{"h":"The rule that catches everyone","b":"You must use EXACTLY two of your four hole cards and exactly three of the five community cards. Not one, not three. If the board shows four hearts and you hold the ace of hearts, you do NOT have a flush unless you hold a second heart."},{"h":"Betting rounds","b":"Preflop, flop (three community cards), turn (a fourth), river (a fifth) \u2014 identical to Hold'em."},{"h":"Pot-limit betting","b":"Omaha is usually played pot-limit: your maximum raise is the size of the pot after you call. Work it out as call amount + current pot + all bets on the table. Ask the dealer for 'pot' if you're unsure \u2014 it's a normal request."},{"h":"Hand values run higher","b":"With four cards you make six two-card combinations, so everyone connects with the board far more often. Two pair is usually worthless. The nuts get made constantly, and drawing to a non-nut flush is how bankrolls disappear."}],"variants":["Omaha Hi-Lo (Eight or Better): the pot splits between the best high hand and the best low hand of 8-high or lower.","Big O / Five-Card Omaha: five hole cards, still exactly two play.","Limit Omaha for a gentler bankroll."],"cheat":{"goal":"Best five-card hand, Hold'em structure.","setup":"FOUR hole cards each, 5 community cards.","key":["Pot-limit betting is standard","Max raise = the pot after your call"],"gotcha":"Exactly two hole cards plus exactly three board cards. Ace of hearts alone is not a flush."}},{"id":"palace","name":"Palace","aka":["Shithead","Karma","Idiot","Shed"],"cat":"shedding","players":[2,6],"best":"3-5","time":[15,30],"age":10,"diff":2,"needs":"1 deck (2 decks for 5+ players)","tags":["party","social","easy-to-teach","swingy","no-equipment"],"blurb":"You play from a hand, then from face-up cards, then blind from face-down cards. Special ranks flip the whole game sideways.","sections":[{"h":"Goal","b":"Be the first to get rid of all nine of your cards. The last player left is the loser (and deals next time)."},{"h":"Setup","b":"Deal each player 3 cards face down in a row \u2014 don't look at them. Then 3 more face up on top of those. Then 3 to their hand. Players may swap between their hand and their face-up row before play starts. Remaining cards form the draw pile."},{"h":"Play","b":"The player with the lowest card starts. Play a card equal to or higher than the top of the discard pile. You may play multiple cards of the SAME rank at once. After playing, draw back up to three cards while the draw pile lasts. If you can't play, pick up the entire discard pile and add it to your hand."},{"h":"Special cards","b":"2 \u2014 resets the pile; can be played on anything and the next player may play anything. 10 \u2014 burns the pile: the whole discard pile goes out of the game and the same player plays again. 7 \u2014 the next player must play a 7 or LOWER. (Some groups also use 8 as 'invisible' \u2014 the next player matches the card beneath it.)"},{"h":"Four in a row","b":"If four cards of the same rank end up stacked consecutively on the discard pile \u2014 from one play or several \u2014 the pile burns, exactly like a 10."},{"h":"The three stages","b":"Once the draw pile is gone and your hand is empty, you play from your 3 face-up cards. When those are gone, you play your 3 face-down cards blind, one at a time \u2014 flip it and hope. If it's too low, you pick up the pile and must clear your hand again before going back to the face-down cards."}],"variants":["Add jokers as an unbeatable 'pick up the pile' card for the next player.","Aces can be played on anything and reset the pile, like 2s.","Play with 4 or 5 cards in each row for a longer game."],"cheat":{"goal":"Shed all nine of your cards.","setup":"3 face down, 3 face up on top, 3 in hand. Swap before play.","key":["Play equal or higher","2 = reset","10 = burn the pile, play again","7 = next player must go lower","4 of a rank in a row = burn"],"gotcha":"Can't play? You pick up the entire pile."}},{"id":"pinochle","name":"Pinochle","aka":["Partnership Auction Pinochle"],"cat":"trick","players":[2,4],"best":"4","time":[45,90],"age":12,"diff":3,"needs":"A 48-card pinochle deck (two each of 9, 10, J, Q, K, A in every suit)","tags":["strategy","partners","classic","melding","midwest","long-game"],"blurb":"Bid, meld, then fight for the counters. Two of every card means the ties matter and the melds are half the score.","sections":[{"h":"Goal","b":"First partnership to 1,500 points. Points come from melds you show before play, plus counters you capture during play."},{"h":"The deck and card order","b":"48 cards: two copies each of 9, 10, J, Q, K, A in all four suits. Ranking is unusual \u2014 A, 10, K, Q, J, 9. The 10 sits between the Ace and the King."},{"h":"Deal and bidding","b":"Deal 12 cards to each player in packets of 3 or 4. Starting left of the dealer, players bid or pass; bidding usually opens at 250 and rises in tens. The high bidder names trump."},{"h":"The pass","b":"The bidder's partner passes them 4 cards, and the bidder passes 4 back. Pass your partner what their bid needs \u2014 usually aces and trump."},{"h":"Melding","b":"Everyone lays their melds face up and scores them, then takes the cards back into hand. RUN (A-10-K-Q-J of trump) 150. Royal marriage (K-Q of trump) 40, plain marriage 20. Pinochle (J of diamonds + Q of spades) 40, double pinochle 300. Aces around (one in each suit) 100, kings around 80, queens around 60, jacks around 40. Dix (9 of trump) 10 each. Double melds score far more than twice \u2014 double run is 1,500."},{"h":"Play \u2014 two rules people forget","b":"You must follow suit AND you must beat the current winning card if you can. If you're void in the led suit you must trump if you hold trump. There is no discarding your way out of trouble."},{"h":"Counters","b":"Each Ace is 11, each 10 is 10, each King 4, each Queen 3, each Jack 2, nines are 0. Last trick is worth 10. That's 250 counters on the table each hand."},{"h":"Making the bid","b":"The bidding team adds their meld and their counters. If the total is less than the bid, they score nothing and the bid is subtracted from their score instead. The other team always keeps what they earned."}],"variants":["Simplified counters: Ace, 10 and King are 1 point each, last trick 1 \u2014 25 per hand.","Two-handed pinochle: deal 12 each and draw from a stock after each trick.","Double-deck pinochle: 80 cards, 4 players, bids start around 500.","Cutthroat (three-handed) pinochle, every player for themselves."],"cheat":{"goal":"First partnership to 1,500.","setup":"48-card pinochle deck. Deal 12 each, bid, name trump, pass 4 cards each way.","key":["Order: A, 10, K, Q, J, 9","Run 150 \u00b7 pinochle 40 \u00b7 aces around 100","Counters: A=11, 10=10, K=4, Q=3, J=2; last trick 10","250 counters per hand"],"gotcha":"You must follow suit AND beat the winning card if you can. Trump if you're void."}},{"id":"pitch","name":"Pitch","aka":["Setback","High Low Jack","Auction Pitch"],"cat":"trick","players":[2,7],"best":"4","time":[30,45],"age":10,"diff":2,"needs":"1 standard 52-card deck, paper for scoring","tags":["strategy","classic","partners-optional","no-equipment"],"blurb":"Bid for the right to name trump by 'pitching' your lead card. Only four points exist each hand, so every one of them matters.","sections":[{"h":"Goal","b":"First to 11 points (or 21 for a longer game)."},{"h":"Setup","b":"Deal 6 cards to each player in packets of 3. Aces high."},{"h":"Bidding","b":"Starting left of the dealer, players bid 2, 3, or 4 (the number of points they'll take) or pass. Each bid must beat the last. The dealer may 'steal' a bid by matching it. The winner pitches \u2014 leads their first card, and that card's suit is trump."},{"h":"Play","b":"You must follow suit OR play trump \u2014 trump is always legal. If you can't follow suit and have no trump, play anything. Highest trump wins the trick, otherwise highest card of the led suit."},{"h":"The four points","b":"HIGH: the highest trump dealt, to whoever was dealt it. LOW: the lowest trump dealt, to whoever was dealt it. JACK: the Jack of trump, to whoever captures it in a trick (nobody scores if it wasn't dealt). GAME: total the card values you captured (A=4, K=3, Q=2, J=1, 10=10) and the highest total scores it."},{"h":"Scoring","b":"Everyone scores the points they earned. But if the bidder fails to make their bid, they SUBTRACT the amount they bid \u2014 that's the 'setback'. Going negative is normal and fine."}],"variants":["Partnership Pitch with 4 players in two teams.","10-point Pitch adds the 10 of trump and 3 of trump as scoring cards.","Smudge: bidding 4 and making it scores double."],"cheat":{"goal":"First to 11. Only four points exist each hand.","setup":"Deal 6 each. Bid 2-4, winner leads and that card sets trump.","key":["High: highest trump dealt","Low: lowest trump dealt","Jack: J of trump, to whoever captures it","Game: most card points (A=4, K=3, Q=2, J=1, 10=10)"],"gotcha":"Trump is always a legal play, even if you could follow suit."}},{"id":"poker-rankings","name":"Poker Hand Rankings","aka":["Hand Rankings","What Beats What"],"cat":"casino","players":[2,10],"best":"Any","time":[1,2],"age":8,"diff":1,"needs":"Nothing \u2014 this is a reference card","tags":["reference","poker","cheat-sheet"],"blurb":"What beats what, best to worst. Keep this open when you're teaching someone.","sections":[{"h":"1. Royal Flush","b":"A-K-Q-J-10, all the same suit. The best hand in poker and rarer than you think."},{"h":"2. Straight Flush","b":"Five cards in sequence, all one suit \u2014 like 8-7-6-5-4 of hearts."},{"h":"3. Four of a Kind","b":"Four cards of the same rank, plus one kicker."},{"h":"4. Full House","b":"Three of a kind plus a pair. Compare the trips first: 9-9-9-2-2 beats 8-8-8-A-A."},{"h":"5. Flush","b":"Five cards of the same suit, not in sequence. Compare highest card down."},{"h":"6. Straight","b":"Five cards in sequence, mixed suits. Aces play high (A-K-Q-J-10) or low (5-4-3-2-A), but never wrap around."},{"h":"7. Three of a Kind","b":"Three matching cards plus two kickers. Called a set or trips."},{"h":"8. Two Pair","b":"Two different pairs plus a kicker. Compare the higher pair first."},{"h":"9. One Pair","b":"Two matching cards plus three kickers."},{"h":"10. High Card","b":"Nothing at all. Ace-high beats King-high, and so on down."},{"h":"Ties","b":"Suits never break ties in standard poker. If two hands are identical in rank, the pot is split."}],"variants":["In lowball (razz, 2-7), the rankings are inverted and the worst hand wins.","With wild cards, five of a kind exists and beats a royal flush."],"cheat":{"goal":"Know what beats what.","setup":"Best five cards win. Suits never break ties.","key":["Royal flush > straight flush > quads","Full house > flush > straight","Trips > two pair > pair > high card"],"gotcha":"Aces play high or low in a straight (A-K-Q-J-10 or 5-4-3-2-A) but never wrap around."}},{"id":"president","name":"President","aka":["Scum","Asshole","Daifugo","Landlord","Capitalism"],"cat":"shedding","players":[4,8],"best":"5-7","time":[20,45],"age":12,"diff":1,"needs":"1 standard 52-card deck","tags":["party","big-group","social","drinking-optional","easy-to-teach"],"blurb":"A brutal little climbing game with a social hierarchy attached. Win a hand and the loser hands you their best card next deal.","sections":[{"h":"Goal","b":"Shed your cards first and become President. Finish last and you're the Scum, who has to serve everyone."},{"h":"Card order","b":"2 is highest, then A, K, Q, J, 10, down to 3. Suits don't matter."},{"h":"Setup","b":"Deal the whole deck out as evenly as possible. On the first hand, whoever holds the 3 of clubs leads."},{"h":"Play","b":"The leader plays any single card, or a set of matching cards (a pair, a triple, four of a kind). Everyone after must play the SAME NUMBER of cards at a HIGHER rank, or pass. Once you pass you're out for that round. When everyone else passes, the last player to play clears the pile and leads a fresh one."},{"h":"Finishing order","b":"The first player out is President, second is Vice President, and so on down to Scum (last). Keep the order \u2014 it drives the next hand."},{"h":"The exchange","b":"After the first hand, before play begins: the Scum gives the President their two BEST cards, and the President gives back any two cards they don't want. The Vice Scum and Vice President exchange one card the same way. It's deeply unfair, which is the point."},{"h":"Seating and service","b":"Traditionally the President sits at the head of the table and the Scum shuffles and deals every hand."}],"variants":["Bombs: four of a kind (or a 2) can be played on anything to clear the pile immediately.","Completing a set of four in the pile clears it and the player who did it leads again.","Playing the exact same rank as the last play 'skips' the next player.","As a drinking game, the Scum drinks whenever the President tells them to."],"cheat":{"goal":"Shed first to become President. Finish last and you're Scum.","setup":"Deal the whole deck. First hand, the 3\u2663 leads.","key":["2 is high, then A, K \u2026 down to 3","Match the count: singles beat singles, pairs beat pairs"],"gotcha":"After hand one, Scum hands the President their two best cards and gets junk back."}},{"id":"pyramid","name":"Pyramid","aka":["Bluff Pyramid"],"cat":"party","players":[3,10],"best":"5-7","time":[15,30],"age":21,"diff":1,"needs":"1 standard deck, drinks or forfeits","tags":["party","drinking","bluffing","adults","fast","big-group"],"blurb":"A face-down pyramid, a hand of secret cards, and the freedom to lie about all of it.","sections":[{"h":"Setup","b":"Build a face-down pyramid in the middle: 5 cards across the bottom, then 4, 3, 2, and 1 on top. Deal 4 cards face down to each player \u2014 look at them but don't show anyone."},{"h":"Play","b":"Flip the pyramid cards one at a time, working from the bottom row up. When a card is revealed, any player may claim to hold a matching rank, lay a card face DOWN, and assign penalties: 1 for a bottom-row card, up to 5 for the top."},{"h":"Calling bluffs","b":"The person being penalized may call the bluff. Flip the played card: if it matches, the caller takes double. If it was a lie, the bluffer takes double. Either way the card is spent and the bluffer draws a replacement."},{"h":"Ending","b":"The game ends when the top card is flipped and resolved. Some groups then reveal all remaining hands for a final round of penalties."},{"h":"Playing it dry","b":"Use points instead of drinks \u2014 lowest total at the end wins. The bluffing works exactly the same."}],"variants":["Deal a bigger pyramid (6 rows) for a longer game.","Give every player 5 cards for more bluffing material.","'Truth pyramid': no bluffing allowed, pure luck, better for mixed groups."],"cheat":{"goal":"Offload penalties by matching pyramid cards.","setup":"Face-down 5-4-3-2-1 pyramid, 4 cards each.","key":["Bottom row worth 1, top worth 5","Play face down and claim a match"],"gotcha":"Called and lying = you take double. Called and honest = they do."}},{"id":"pyramid-solitaire","name":"Pyramid Solitaire","aka":["Solitaire Thirteen"],"cat":"solitaire","players":[1,1],"best":"1","time":[5,15],"age":8,"diff":2,"needs":"1 standard 52-card deck","tags":["solo","quiet","fast","math","one-player"],"blurb":"Clear a pyramid by pairing cards that add up to 13. Short, tidy, and often unwinnable.","sections":[{"h":"Goal","b":"Remove all 28 cards from the pyramid."},{"h":"Setup","b":"Deal 28 cards face up in a pyramid: 1 card on top, then rows of 2, 3, 4, 5, 6, and 7, each row overlapping the one above. The remaining 24 cards are the stock."},{"h":"Card values","b":"Ace = 1, Jack = 11, Queen = 12, King = 13, everything else face value."},{"h":"Play","b":"Remove any pair of exposed cards totaling 13 \u2014 a 9 with a 4, a Queen with an Ace, and so on. Kings are worth 13 on their own and can be removed alone. A card is 'exposed' only when no cards overlap it from the row below."},{"h":"The stock","b":"Flip stock cards one at a time to a waste pile; the top waste card can pair with an exposed pyramid card or with the next stock card. Standard rules allow one to three passes through the stock."},{"h":"Winnability","b":"Only around 5-10% of deals are winnable with one stock pass, so this is a game you play quickly and often."}],"variants":["Allow unlimited passes through the stock for a much friendlier game.","Relaxed rule: cards partially covered by one card may still be paired.","Tut's Tomb / Giza: variations with different stock layouts."],"cheat":{"goal":"Clear all 28 pyramid cards.","setup":"28 cards in a pyramid, 24 in stock.","key":["Pair cards totalling 13","A=1, J=11, Q=12, K=13","Kings clear alone"],"gotcha":"A card is only playable when nothing overlaps it."}},{"id":"red-or-black","name":"Red or Black","aka":["High Low","Higher or Lower","Guessing Game"],"cat":"party","players":[2,15],"best":"5-10","time":[5,15],"age":8,"diff":1,"needs":"1 standard deck","tags":["party","big-group","fast","easy-to-teach","icebreaker","drinking-optional"],"blurb":"The simplest thing you can do with a deck. Perfect filler while you wait for the rest of the group to show up.","sections":[{"h":"Basic version","b":"Going around the circle, each player calls red or black before their card is flipped. Wrong guessers take a forfeit or a point against them; right guessers hand one out."},{"h":"Higher or lower","b":"Flip one card face up. The next player calls whether the following card will be higher or lower. Wrong ends their run; right lets them keep going. Count how many correct calls in a row each player can chain."},{"h":"Streak version","b":"Play as a team: how many correct calls can the whole table chain together before someone misses? Try to beat your record."},{"h":"As a warm-up","b":"This is the game you play in the first five minutes to get a group talking before starting something with actual rules."}],"variants":["Add suits as a third, harder guess worth triple.","Elimination: one wrong guess and you're out, last player standing wins.","Use it as the opening phase of Ride the Bus."],"cheat":{"goal":"Call the next card.","setup":"Just a deck. Go around the circle.","key":["Red or black, or higher/lower","Chain correct calls for a streak"],"gotcha":"It's the five-minute filler while people arrive \u2014 don't over-rule it."}},{"id":"ride-the-bus","name":"Ride the Bus","aka":["Bus Driver","Pyramid Bus"],"cat":"party","players":[3,8],"best":"4-6","time":[20,40],"age":21,"diff":1,"needs":"1 standard deck, drinks or forfeits","tags":["party","drinking","adults","easy-to-teach","luck","no-strategy"],"blurb":"Four guessing questions, then a pyramid, then one poor soul rides the bus alone.","sections":[{"h":"Phase 1 \u2014 the four questions","b":"Going around the table, each player answers four questions in a row, drawing a card after each: (1) Red or black? (2) Higher or lower than your first card? (3) Inside or outside the first two? (4) What suit? Guess right and you hand out a penalty; guess wrong and you take one. Keep your four cards face up in front of you."},{"h":"Phase 2 \u2014 the pyramid","b":"Deal a face-down pyramid from the remaining deck: 5 cards on the bottom row, then 4, 3, 2, 1. Flip them one row at a time, starting from the bottom. When a card is flipped, anyone holding a matching rank may lay it down and hand out penalties equal to the row number (row 1 = 1, up to row 5 = 5 at the top). You can bluff a card you don't have \u2014 but if someone calls you and you're lying, you take double."},{"h":"Phase 3 \u2014 riding the bus","b":"Whoever has the most cards left in front of them when the pyramid is done is the bus driver. Deal them a row of face-down cards (usually 5 to 10). They flip one at a time. Number card: safe, move on. Face card or Ace: take a penalty and start the row over from the beginning. They keep going until they clear the whole row."},{"h":"Playing it dry","b":"Everything works with any forfeit \u2014 points, chores, silly dares. The bus ride is genuinely tense either way."}],"variants":["Shorter bus: 4 cards instead of 8.","Only Kings and Aces restart the bus row.","Two drivers race side by side and the first to finish stops."],"cheat":{"goal":"Survive four guesses, a pyramid, then the bus.","setup":"Four questions each, then a 5-4-3-2-1 pyramid.","key":["Red/black \u2192 higher/lower \u2192 inside/outside \u2192 suit","Pyramid rows worth 1 to 5","Most cards left = bus driver"],"gotcha":"Bluffing in the pyramid costs double if you're called."}},{"id":"rummy-500","name":"Rummy 500","aka":["500 Rum","Pinochle Rummy"],"cat":"rummy","players":[2,8],"best":"3-4","time":[30,60],"age":8,"diff":2,"needs":"1 deck (2 decks for 5+ players), paper for scoring","tags":["classic","family","group","strategy","no-equipment"],"blurb":"Rummy with a twist that changes everything: you can take the whole discard pile, as long as you use the card you dug for.","sections":[{"h":"Goal","b":"First player to 500 points."},{"h":"Setup","b":"Deal 7 cards each (10 each with 2 players). Stock face down, one card face up to start the discard pile. Spread the discard pile so all cards are visible."},{"h":"Play","b":"On your turn: draw the top stock card, OR take any card from the discard pile \u2014 but if you reach deeper than the top card, you must take every card above it too, and you must immediately meld the card you reached for. Then meld or lay off if you want, and finish by discarding one card."},{"h":"Melds","b":"Sets of three or more of a rank, or runs of three or more in a suit. Melds stay face up in front of you. You may lay off cards onto ANY player's melds, and the points go to you."},{"h":"Ending a hand","b":"The hand ends when a player plays their last card, or when the stock runs out and no one wants the discard pile."},{"h":"Scoring","b":"Count the melds in front of you: face cards 10, Aces 15, number cards face value. Subtract the value of the cards still in your hand. Yes, your score can go negative."}],"variants":["Persian Rummy uses jokers as wild cards worth 20.","Require a minimum first meld value (like 30) before you can lay anything down.","Play to 200 for a shorter game."],"cheat":{"goal":"First to 500 points.","setup":"Deal 7 each (10 with two players). Spread the discard pile face up.","key":["Aces 15, faces 10, numbers face value","Subtract cards left in hand"],"gotcha":"Digging into the discard pile means taking every card above it AND melding the one you reached for immediately."}},{"id":"screw-your-neighbor","name":"Screw Your Neighbor","aka":["Chase the Ace","Ranter-Go-Round","Cuckoo"],"cat":"party","players":[3,12],"best":"5-8","time":[10,20],"age":8,"diff":1,"needs":"1 standard 52-card deck, 3 tokens per pl
