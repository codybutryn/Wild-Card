h an Ace, and so on. Kings are worth 13 on their own and can be removed alone. A card is 'exposed' only when no cards overlap it from the row below."},{"h":"The stock","b":"Flip stock cards one at a time to a waste pile; the top waste card can pair with an exposed pyramid card or with the next stock card. Standard rules allow one to three passes through the stock."},{"h":"Winnability","b":"Only around 5-10% of deals are winnable with one stock pass, so this is a game you play quickly and often."}],"variants":["Allow unlimited passes through the stock for a much friendlier game.","Relaxed rule: cards partially covered by one card may still be paired.","Tut's Tomb / Giza: variations with different stock layouts."]},{"id":"red-or-black","name":"Red or Black","aka":["High Low","Higher or Lower","Guessing Game"],"cat":"party","players":[2,15],"best":"5-10","time":[5,15],"age":8,"diff":1,"needs":"1 standard deck","tags":["party","big-group","fast","easy-to-teach","icebreaker","drinking-optional"],"blurb":"The simplest thing you can do with a deck. Perfect filler while you wait for the rest of the group to show up.","sections":[{"h":"Basic version","b":"Going around the circle, each player calls red or black before their card is flipped. Wrong guessers take a forfeit or a point against them; right guessers hand one out."},{"h":"Higher or lower","b":"Flip one card face up. The next player calls whether the following card will be higher or lower. Wrong ends their run; right lets them keep going. Count how many correct calls in a row each player can chain."},{"h":"Streak version","b":"Play as a team: how many correct calls can the whole table chain together before someone misses? Try to beat your record."},{"h":"As a warm-up","b":"This is the game you play in the first five minutes to get a group talking before starting something with actual rules."}],"variants":["Add suits as a third, harder guess worth triple.","Elimination: one wrong guess and you're out, last player standing wins.","Use it as the opening phase of Ride the Bus."]},{"id":"ride-the-bus","name":"Ride the Bus","aka":["Bus Driver","Pyramid Bus"],"cat":"party","players":[3,8],"best":"4-6","time":[20,40],"age":21,"diff":1,"needs":"1 standard deck, drinks or forfeits","tags":["party","drinking","adults","easy-to-teach","luck","no-strategy"],"blurb":"Four guessing questions, then a pyramid, then one poor soul rides the bus alone.","sections":[{"h":"Phase 1 \u2014 the four questions","b":"Going around the table, each player answers four questions in a row, drawing a card after each: (1) Red or black? (2) Higher or lower than your first card? (3) Inside or outside the first two? (4) What suit? Guess right and you hand out a penalty; guess wrong and you take one. Keep your four cards face up in front of you."},{"h":"Phase 2 \u2014 the pyramid","b":"Deal a face-down pyramid from the remaining deck: 5 cards on the bottom row, then 4, 3, 2, 1. Flip them one row at a time, starting from the bottom. When a card is flipped, anyone holding a matching rank may lay it down and hand out penalties equal to the row number (row 1 = 1, up to row 5 = 5 at the top). You can bluff a card you don't have \u2014 but if someone calls you and you're lying, you take double."},{"h":"Phase 3 \u2014 riding the bus","b":"Whoever has the most cards left in front of them when the pyramid is done is the bus driver. Deal them a row of face-down cards (usually 5 to 10). They flip one at a time. Number card: safe, move on. Face card or Ace: take a penalty and start the row over from the beginning. They keep going until they clear the whole row."},{"h":"Playing it dry","b":"Everything works with any forfeit \u2014 points, chores, silly dares. The bus ride is genuinely tense either way."}],"variants":["Shorter bus: 4 cards instead of 8.","Only Kings and Aces restart the bus row.","Two drivers race side by side and the first to finish stops."]},{"id":"rummy-500","name":"Rummy 500","aka":["500 Rum","Pinochle Rummy"],"cat":"rummy","players":[2,8],"best":"3-4","time":[30,60],"age":8,"diff":2,"needs":"1 deck (2 decks for 5+ players), paper for scoring","tags":["classic","family","group","strategy","no-equipment"],"blurb":"Rummy with a twist that changes everything: you can take the whole discard pile, as long as you use the card you dug for.","sections":[{"h":"Goal","b":"First player to 500 points."},{"h":"Setup","b":"Deal 7 cards each (10 each with 2 players). Stock face down, one card face up to start the discard pile. Spread the discard pile so all cards are visible."},{"h":"Play","b":"On your turn: draw the top stock card, OR take any card from the discard pile \u2014 but if you reach deeper than the top card, you must take every card above it too, and you must immediately meld the card you reached for. Then meld or lay off if you want, and finish by discarding one card."},{"h":"Melds","b":"Sets of three or more of a rank, or runs of three or more in a suit. Melds stay face up in front of you. You may lay off cards onto ANY player's melds, and the points go to you."},{"h":"Ending a hand","b":"The hand ends when a player plays their last card, or when the stock runs out and no one wants the discard pile."},{"h":"Scoring","b":"Count the melds in front of you: face cards 10, Aces 15, number cards face value. Subtract the value of the cards still in your hand. Yes, your score can go negative."}],"variants":["Persian Rummy uses jokers as wild cards worth 20.","Require a minimum first meld value (like 30) before you can lay anything down.","Play to 200 for a shorter game."]},{"id":"screw-your-neighbor","name":"Screw Your Neighbor","aka":["Chase the Ace","Ranter-Go-Round","Cuckoo"],"cat":"party","players":[3,12],"best":"5-8","time":[10,20],"age":8,"diff":1,"needs":"1 standard 52-card deck, 3 tokens per player","tags":["party","big-group","easy-to-teach","fast","drinking-optional"],"blurb":"One card each. Don't be lowest. You can force a swap with the person next to you, and they can't say no.","sections":[{"h":"Goal","b":"Don't hold the lowest card at the end of the round. Everyone starts with 3 tokens; last player with tokens wins."},{"h":"Card order","b":"King is high, Ace is low."},{"h":"Setup","b":"Deal ONE card to each player, face down. Look at it, keep it hidden."},{"h":"Play","b":"Starting left of the dealer, each player either keeps their card or swaps it with the player on their left \u2014 who has no choice. The person being swapped with may only refuse by showing a KING, which blocks the trade."},{"h":"The dealer","b":"The dealer goes last and has no neighbor to swap with, so instead they may cut the deck and take the top card, hoping to improve."},{"h":"The reveal","b":"Everyone flips their card. The lowest card loses a token. Ties mean everyone tied loses one. Deal again."},{"h":"Elimination","b":"Lose all three tokens and you're out. Play until one player remains."}],"variants":["Getting passed an Ace means you must reveal it immediately.","As a drinking game, the lowest card drinks instead of losing a token.","Play for a small pot instead of tokens."]},{"id":"seven-card-stud","name":"Seven-Card Stud","aka":["Stud","Seven-Stud"],"cat":"casino","players":[2,8],"best":"5-7","time":[45,120],"age":18,"diff":2,"needs":"1 standard deck, chips","tags":["poker","gambling","strategy","memory","classic"],"blurb":"The poker that ruled before Hold'em. No community cards \u2014 you watch what everyone else is showing and remember it.","sections":[{"h":"Goal","b":"Make the best five-card hand out of your seven cards."},{"h":"Setup","b":"Everyone antes. Deal each player two cards face down and one face up."},{"h":"Third street","b":"The player showing the LOWEST up card must post a forced bet (the 'bring-in'). Betting proceeds clockwise."},{"h":"Fourth through sixth street","b":"Deal one more up card to each player, with a betting round after each. From fourth street on, the player showing the best partial hand acts first."},{"h":"Seventh street","b":"Deal a final card face down to each remaining player, then a final betting round."},{"h":"Showdown","b":"Make your best five cards out of your seven. Best hand wins the pot."},{"h":"Why it's a memory game","b":"Four of everyone's seven cards are visible before they're folded. Tracking which cards are dead \u2014 how many kings are already showing \u2014 is most of the skill."}],"variants":["Razz: seven-card stud where the LOWEST hand wins.","Stud Hi-Lo (Eight or Better): the pot splits between the best high hand and the best qualifying low.","Five-Card Stud: a leaner, older version with one down card and four up."]},{"id":"sevens","name":"Sevens","aka":["Fan Tan","Domino","Parliament","Laying Out Sevens"],"cat":"shedding","players":[3,8],"best":"4-6","time":[10,20],"age":6,"diff":1,"needs":"1 standard 52-card deck","tags":["easy-to-teach","kids","family","fast","no-equipment"],"blurb":"Build all four suits outward from the sevens. Almost no rules, and kids get it instantly \u2014 but there's real blocking strategy underneath.","sections":[{"h":"Goal","b":"Be the first to play every card from your hand."},{"h":"Setup","b":"Deal the entire deck out as evenly as possible. Some players may have one extra card \u2014 that's fine."},{"h":"Play","b":"The player holding the 7 of diamonds starts by playing it to the middle. Going clockwise, each turn you must play exactly one card: either another 7 (starting that suit's row) or a card that extends an existing row by one rank up or down. So once the 7 of hearts is down, the 6 and 8 of hearts become playable, then the 5 and 9, and so on out to Ace and King."},{"h":"Passing","b":"If you have no legal play you must pass. If you DO have a legal play you must make it \u2014 you can't pass to hold a card back."},{"h":"Scoring","b":"First player out wins. For a longer game, everyone else scores penalty points equal to the number of cards left in their hand and you play to an agreed limit."}],"variants":["Allow one voluntary pass per player per hand \u2014 this makes blocking much stronger.","Play with a 'pay a chip to pass' rule and settle the pot at the end.","Start with all four sevens on the table for a faster, gentler game with young kids."]},{"id":"slapjack","name":"Slapjack","aka":["Slaps","Heart Attack"],"cat":"kids","players":[2,8],"best":"3-5","time":[10,20],"age":4,"diff":1,"needs":"1 standard 52-card deck","tags":["kids","fast","reflexes","loud","family"],"blurb":"One rule: when a Jack shows up, slap it. Perfect for kids too young for Egyptian Ratscrew.","sections":[{"h":"Goal","b":"Win all 52 cards."},{"h":"Setup","b":"Deal the entire deck out face down. Players never look at their cards."},{"h":"Play","b":"Going clockwise, each player flips their top card into one central pile. Flip it away from yourself so you don't see it first."},{"h":"The slap","b":"The instant a Jack lands on top of the pile, everyone races to slap it. First hand on the pile takes the whole thing, shuffles it into their stack, and starts the next round."},{"h":"Bad slaps","b":"Slap a non-Jack and you give one card from your stack to the player who flipped it."},{"h":"Elimination","b":"Run out of cards and you're out \u2014 but you stay at the table for one more chance to slap a Jack and get back in."}],"variants":["Add doubles and sandwiches as slappable, which turns it into Egyptian Ratscrew.","Slap on any face card for younger, slower groups.","Play with two decks for a big crowd."]},{"id":"snap","name":"Snap","aka":[],"cat":"kids","players":[2,8],"best":"3-5","time":[10,20],"age":4,"diff":1,"needs":"1 standard 52-card deck","tags":["kids","fast","reflexes","loud","family"],"blurb":"Flip cards, and the instant two match, yell SNAP. That's the whole game, and it is extremely loud.","sections":[{"h":"Goal","b":"Win all the cards."},{"h":"Setup","b":"Deal the deck out face down. Nobody looks."},{"h":"Play","b":"Going clockwise, each player flips their top card into their OWN face-up pile in front of them. Watch all the piles."},{"h":"Snap","b":"When the top cards of any two piles match in rank, the first player to shout 'Snap!' takes both piles and adds them to the bottom of their face-down stack."},{"h":"Snap pool","b":"If two players snap at the same time, the two piles go to the middle as a 'snap pool'. When a later card matches the top of the snap pool, the first player to yell 'Snap pool!' takes the whole thing."},{"h":"Ending","b":"A player with no cards is out. Last player standing wins."}],"variants":["One central pile instead of individual ones \u2014 simpler for very young kids.","Penalty rule: a false snap costs you your top card to each opponent.","Match by suit instead of rank for a slower game."]},{"id":"spades","name":"Spades","aka":[],"cat":"trick","players":[4,4],"best":"4","time":[30,60],"age":10,"diff":2,"needs":"1 standard 52-card deck","tags":["strategy","partners","classic","no-equipment"],"blurb":"Partnership trick-taking built on the bid. Spades are always trump, and promising more than you can deliver is how you lose.","sections":[{"h":"Goal","b":"First partnership to 500 points wins. You get there by bidding exactly how many tricks you'll take \u2014 and then taking exactly that many."},{"h":"Setup","b":"Partners sit across from each other. Deal all 52 cards, 13 to each player. Aces are high. Spades are permanently trump."},{"h":"Bidding","b":"Starting left of the dealer, each player states how many tricks they expect to win (0 through 13). Add the two partners' bids together \u2014 that's the team's contract. A bid of 0 is 'nil' (see below)."},{"h":"Play","b":"Player left of the dealer leads. Follow suit if you can; otherwise play anything, including a spade to trump the trick. Highest spade wins, or if no spades were played, the highest card of the led suit. You cannot LEAD a spade until spades have been broken (played on a trick where the leader played another suit) \u2014 or until spades are all you hold."},{"h":"Scoring","b":"Make your contract: 10 points per bid trick. Each extra trick beyond the bid is a 'bag' worth 1 point. Miss your contract: lose 10 points per bid trick. Collect 10 bags across the game and you're penalized 100 points \u2014 so overbidding and underbidding both hurt."},{"h":"Nil and blind nil","b":"Bidding nil means you promise to win ZERO tricks. Succeed and your team gets +100; fail and it's -100. Your partner still plays their own bid normally and should cover you. Blind nil (bid before looking at your cards) is worth \u00b1200 and is usually only worth it when you're far behind."}],"variants":["Cutthroat Spades: 3 players, no partnerships, deal 17 each and remove one card.","Suicide Spades: one partner on each team must bid nil every hand.","Whiz: you must bid either nil or the exact number of spades in your hand."]},{"id":"speed","name":"Speed","aka":["Spit","Slam"],"cat":"speed","players":[2,2],"best":"2","time":[5,15],"age":8,"diff":1,"needs":"1 standard 52-card deck","tags":["two-player","fast","real-time","reflexes","kids"],"blurb":"No turns, no waiting. Both players dump cards onto the middle piles as fast as their hands move.","sections":[{"h":"Goal","b":"Be the first to get rid of all your cards."},{"h":"Setup","b":"Deal each player 15 cards face down as a draw pile and 5 cards as their hand \u2014 20 each. The remaining 12 cards go in the middle: two face down as the 'flip' cards, with a replacement stack of 5 beside each."},{"h":"Starting","b":"Both players say go and flip the two center cards simultaneously."},{"h":"Play","b":"There are no turns. Play any card from your hand onto either center pile if it is one rank higher or lower than that pile's top card (Aces wrap around to Kings and 2s). Refill your hand to 5 from your draw pile as fast as you can. Both players do this at the same time, constantly."},{"h":"Stuck","b":"If neither player can play, both count down and flip one new card from each of the side replacement piles onto the center piles to restart the action."},{"h":"Winning","b":"The first player to run out of cards entirely \u2014 hand and draw pile \u2014 wins. Best of three is standard."}],"variants":["Spit: a similar real-time game where you play from solitaire-style rows and the winner takes the smaller center pile.","Four-player Speed with two center piles per pair.","Slow Speed for kids: alternate turns instead of playing simultaneously."]},{"id":"spider","name":"Spider Solitaire","aka":["Spider"],"cat":"solitaire","players":[1,1],"best":"1","time":[20,45],"age":10,"diff":3,"needs":"2 standard decks (104 cards)","tags":["solo","strategy","quiet","brain","hard","one-player"],"blurb":"The hard one. Build eight complete King-to-Ace runs in suit, with almost nowhere to put anything.","sections":[{"h":"Goal","b":"Assemble eight complete sequences of King down to Ace in a single suit. Each completed run is removed from play."},{"h":"Setup","b":"Use two decks (104 cards). Deal ten columns: the first four get 6 cards, the remaining six get 5 \u2014 54 cards total, only the top of each column face up. The remaining 50 cards are the stock."},{"h":"Play","b":"Build DOWN in the tableau regardless of suit (a 9 of any suit goes on any 10). But you may only MOVE a group of cards together if they're all the same suit and in sequence. Flip face-down cards when they're exposed. Empty columns can hold any card."},{"h":"Dealing","b":"When you're stuck, deal one card from the stock to every column at once \u2014 ten cards per deal, five deals total. You cannot deal if any column is empty, so don't leave a hole when you're about to need one."},{"h":"Difficulty levels","b":"One suit (all spades) is a gentle introduction. Two suits is a solid challenge. Four suits is genuinely hard \u2014 win rates hover around 30-50% even with good play."}],"variants":["One-suit and two-suit versions using duplicated suits.","Spiderette: a one-deck version with seven columns.","Unlimited undo, which turns it into a solvable puzzle."]},{"id":"spoons","name":"Spoons","aka":["Pig","Donkey","Tongue"],"cat":"party","players":[3,13],"best":"6-8","time":[10,20],"age":6,"diff":1,"needs":"4 cards per player from a standard deck, plus spoons (one fewer than the number of players)","tags":["party","big-group","kids","chaotic","fast","family"],"blurb":"Musical chairs with playing cards. Collect four of a kind, grab a spoon, and watch the table erupt.","sections":[{"h":"Goal","b":"Don't be the player left without a spoon. Losing spells out S-P-O-O-N-S one letter at a time; spell the whole word and you're out."},{"h":"Setup","b":"Pull 4 cards of one rank per player (so with 6 players, use 24 cards: all four Aces, Kings, Queens, Jacks, 10s and 9s). Put spoons in the middle of the table \u2014 one fewer than the number of players. Deal 4 cards to each player."},{"h":"Play","b":"The dealer draws from the stock, keeps or passes a card, and slides one card face down to their left. Everyone does the same simultaneously and continuously \u2014 this is a constant flow, not turns. Never hold more than 4 cards. The last player discards to a trash pile."},{"h":"Grabbing","b":"As soon as you have four of a kind, quietly take a spoon. The moment anyone takes a spoon, everyone else may grab. The player left without one takes a letter."},{"h":"The sneaky part","b":"The real fun is taking a spoon so subtly nobody notices, then watching the panic ripple around the table."}],"variants":["Play without spoons \u2014 the loser is the last to touch their nose or say a code word.","'Silent Spoons': no talking allowed, disqualification for speaking.","Add a rule that any player who grabs a spoon without having four of a kind takes two letters."]},{"id":"texas-holdem","name":"Texas Hold'em","aka":["Hold'em","Holdem"],"cat":"casino","players":[2,10],"best":"6-9","time":[45,180],"age":18,"diff":2,"needs":"1 standard deck, chips, a dealer button","tags":["poker","gambling","strategy","bluffing","big-group","party"],"blurb":"The poker everyone means when they say poker. Two cards each, five in the middle, four rounds of betting.","sections":[{"h":"Goal","b":"Win chips \u2014 either by having the best five-card hand at showdown, or by betting everyone else out of the pot."},{"h":"Setup","b":"Give each player a stack of chips. A dealer button marks the nominal dealer and moves one seat left each hand. The two players left of the button post forced bets: the small blind and the big blind (usually half and full minimum bet)."},{"h":"The deal and preflop","b":"Each player gets two cards face down (hole cards). Starting left of the big blind, players fold, call the big blind, or raise. Betting continues around until everyone still in has matched the largest bet."},{"h":"The flop","b":"Burn one card and deal three community cards face up. A new betting round starts with the first active player left of the button. Checking is allowed if nobody has bet."},{"h":"Turn and river","b":"Burn and deal a fourth community card (the turn), bet again. Burn and deal a fifth (the river), bet a final time."},{"h":"Showdown","b":"Remaining players make the best five-card hand using any combination of their two hole cards and the five community cards \u2014 including using zero of their own cards ('playing the board'). Best hand takes the pot; identical hands split it."},{"h":"Betting basics","b":"No-limit means you can bet any amount up to your whole stack at any time. A raise must be at least the size of the previous bet or raise. If you bet everything you're all-in, and you can only win the portion of the pot you matched \u2014 extra chips go into a side pot."}],"variants":["Omaha: four hole cards, and you must use exactly two of them plus three from the board.","Limit Hold'em: fixed bet sizes each round.","Tournament play: blinds rise on a timer and you're out when your chips are gone."]},{"id":"thirty-one","name":"Thirty-One","aka":["Blitz","Scat","Cadillac"],"cat":"rummy","players":[2,9],"best":"4-6","time":[15,30],"age":8,"diff":1,"needs":"1 standard 52-card deck, 3 tokens or coins per player","tags":["party","easy-to-teach","gambling-optional","group","fast"],"blurb":"Get three cards of one suit as close to 31 as you can. Three lives each, and knocking at the right moment is the whole art.","sections":[{"h":"Goal","b":"Be the last player with a life left. Everyone starts with 3 tokens."},{"h":"Card values","b":"Aces are 11, face cards are 10, number cards are face value. Only cards of the SAME SUIT count together."},{"h":"Setup","b":"Deal 3 cards each. Flip one card up to start the discard pile."},{"h":"Play","b":"On your turn, draw one card from the stock or discard pile, then discard one \u2014 you always hold exactly three. Your score is the total of your highest single suit. Three of a kind counts as 30.5, which beats everything except 31."},{"h":"Knocking","b":"Instead of drawing, you may knock (rap the table). Everyone else gets one more turn, then all hands are revealed. The LOWEST hand loses a token. If the knocker has the lowest hand, they lose TWO tokens."},{"h":"Instant win","b":"Hit exactly 31 and reveal it immediately \u2014 everyone else loses a token on the spot."},{"h":"Riding the bus","b":"When you lose your last token, you're 'on the bus' \u2014 you get one more hand. Lose again and you're out."}],"variants":["Play for real stakes with a small ante per token lost.","Deal 4 cards for a looser, higher-scoring game.","Rule that the knocker must have 17+ to knock."]},{"id":"three-card-brag","name":"Three-Card Brag","aka":["Brag"],"cat":"casino","players":[2,8],"best":"4-6","time":[20,45],"age":18,"diff":2,"needs":"1 standard deck, chips","tags":["gambling","bluffing","poker","british","fast"],"blurb":"Britain's older, meaner cousin to poker. Three cards, no draw, and you can bet blind without ever looking.","sections":[{"h":"Goal","b":"Win the pot with the best three-card hand, or by making everyone else fold."},{"h":"Setup","b":"Everyone antes. Deal 3 cards face down to each player."},{"h":"Hand rankings, best to worst","b":"PRIAL (three of a kind \u2014 and 3-3-3 is the best hand in the game, beating A-A-A), RUNNING FLUSH (three in sequence, same suit), RUN (three in sequence), FLUSH (three of a suit), PAIR, HIGH CARD. Note that A-2-3 is the highest run, then A-K-Q, down to 4-3-2."},{"h":"Betting","b":"Starting left of the dealer, each player either folds or matches the current stake. Raises are allowed. You may play 'blind' \u2014 never looking at your cards \u2014 and a blind player only pays HALF the current stake, which is the game's signature move."},{"h":"Seeing","b":"Heads-up at the end, a player may pay double the current stake to 'see' the other player and force a showdown. The best hand takes the pot; if the seer doesn't win outright, they lose."},{"h":"Blind play","b":"A blind player cannot be 'seen' \u2014 the other player must either keep betting or fold. That's why going blind is scary to play against."}],"variants":["Wild cards ('floaters') like the black 2s.","Seven-card brag: deal seven and make two three-card hands.","Nine-card brag with three hands and prial bonuses."]},{"id":"trash","name":"Trash","aka":["Garbage","Ten-Card Solitaire"],"cat":"kids","players":[2,4],"best":"2-3","time":[15,30],"age":5,"diff":1,"needs":"1 deck for 2 players, 2 decks for 3-4","tags":["kids","family","easy-to-teach","numbers","learning"],"blurb":"Fill ten slots numbered 1 through 10 with the right cards. Great for teaching number order, and genuinely fun for adults too.","sections":[{"h":"Goal","b":"Be the first to fill all ten of your card slots in order. Each round, the winner plays with one fewer slot the next round; first to win a round with a single slot wins the game."},{"h":"Setup","b":"Deal 10 cards face down to each player in two rows of five. These are your slots, positions 1 through 10 reading left to right."},{"h":"Play","b":"Draw the top card of the stock (or the top of the discard pile). If it's an Ace through 10, place it face up in its matching slot and pick up whatever card was there face down \u2014 then keep going with that card. Kings are wild and can go anywhere. Queens and Jacks are dead: discard them and your turn ends."},{"h":"Ending a turn","b":"Your turn ends when you draw a card you can't place \u2014 a Queen, a Jack, or a number whose slot is already filled. Discard it face up."},{"h":"Winning a round","b":"First player to fill all ten slots wins the round. Everyone reshuffles; the winner deals themselves one fewer card next round (9, then 8, and so on)."}],"variants":["Jokers as extra wilds.","Play 'blitz' rounds where everyone starts at 5 cards.","Allow players to steal a visible discard on their turn only."]},{"id":"war","name":"War","aka":["Battle"],"cat":"kids","players":[2,4],"best":"2","time":[15,45],"age":4,"diff":1,"needs":"1 standard 52-card deck","tags":["kids","family","two-player","no-strategy","easy-to-teach"],"blurb":"Zero decisions, pure luck, and somehow every five-year-old loves it. Highest card takes the pile.","sections":[{"h":"Goal","b":"Win all the cards."},{"h":"Setup","b":"Split the deck evenly, face down. Nobody looks at their cards."},{"h":"Play","b":"Both players flip their top card at the same time. Higher card takes both. Aces are high. Add the won cards to the bottom of your pile."},{"h":"War","b":"When the flipped cards tie, it's war: each player puts three cards face down and then one face up. The higher face-up card wins everything on the table. If those tie too, do it again."},{"h":"Ending","b":"Play until one player has every card. That can take a long time \u2014 most families set a timer and whoever has more cards wins."}],"variants":["Speed it up: on a war, put down only ONE card face down instead of three.","Three-player War with the highest of three cards taking the pile.","'Peace': lowest card wins, which surprises kids and keeps it fresh."]},{"id":"werewolf","name":"Werewolf","aka":["Ultimate Werewolf","Lupus in Tabula"],"cat":"party","players":[8,24],"best":"12-16","time":[30,60],"age":12,"diff":2,"needs":"One card per player and a moderator","tags":["party","big-group","social-deduction","bluffing","no-deck-needed","hidden-roles","talking"],"blurb":"Mafia in a village with more roles and more theater. Same skeleton, bigger cast, better stories.","sections":[{"h":"Goal","b":"Villagers win by killing all werewolves. Werewolves win when they equal the number of villagers left."},{"h":"Roles from a standard deck","b":"Assign one card per player. A solid 12-player setup: 3 werewolves (Kings), 1 Seer (Ace), 1 Doctor/Healer (Queen), 1 Hunter (Jack), 6 villagers (number cards). Roughly 1 werewolf per 4 players is the balance point."},{"h":"What each role does","b":"WEREWOLVES wake together each night and choose a victim. SEER wakes and points at one player; the moderator silently signals whether they're a werewolf. DOCTOR wakes and points at someone to protect that night (usually can't protect the same person twice in a row). HUNTER, when killed by any means, immediately takes one other player down with them. VILLAGERS have no night power and only their judgment."},{"h":"Night","b":"Moderator has everyone close their eyes, then calls each role awake in sequence: werewolves, seer, doctor. Keep the order the same every night so nobody reads timing."},{"h":"Day","b":"The moderator narrates the death. The village discusses and votes someone out. The accused usually gets a short defense before the vote \u2014 this is where the game lives."},{"h":"Running a good game","b":"Give the dead players a job (timekeeping, note-taking) so they stay engaged. Cap discussion at 5 minutes. Encourage the moderator to narrate deaths dramatically; the flavor is half the appeal."}],"variants":["Add a Cupid who links two lovers who win or die together.","Add a Tanner/Jester who wins alone if lynched.","One Night Ultimate Werewolf: no eliminations, one night, one vote, ten minutes."]},{"id":"whist","name":"Whist","aka":["Classic Whist"],"cat":"trick","players":[4,4],"best":"4","time":[30,45],"age":8,"diff":1,"needs":"1 standard 52-card deck","tags":["classic","partners","quiet","easy-to-teach"],"blurb":"The 18th-century ancestor of Bridge and Spades. No bidding, no bowers \u2014 just clean trick-taking that anyone can learn in two minutes.","sections":[{"h":"Goal","b":"First partnership to 5 points (or 7, or 9 \u2014 agree first)."},{"h":"Setup","b":"Partners across. Deal all 52 cards, 13 each. The dealer turns their LAST card face up \u2014 its suit is trump for the hand \u2014 then picks it into their hand before the first trick."},{"h":"Play","b":"Player left of the dealer leads any card. Follow suit if you can; if not, play anything. Highest trump takes the trick, otherwise highest card of the led suit. Winner leads next."},{"h":"Scoring","b":"Each partnership counts tricks won. The first 6 tricks are 'the book' and score nothing. Every trick past 6 is 1 point. So a 9-4 hand scores 3 points."},{"h":"Honours (optional)","b":"If a partnership was dealt all four of A, K, Q, J of trump they score 4 extra points; three of the four scores 2. Many groups skip this."}],"variants":["Knock-out Whist: start with 7 cards, lose a card each hand, last player standing wins.","Solo Whist: individual play with declared contracts.","German Whist for 2 players, using a face-up stock to draw from."]}];

  let mem = {};
  let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e) { ok = false; }
  return {
    get(k, d){ try { const v = ok ? localStorage.getItem(k) : mem[k]; return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set(k, v){ const s = JSON.stringify(v); try { ok ? localStorage.setItem(k,s) : (mem[k]=s); } catch(e){ mem[k]=s; } }

})();

/* ---- search: name, aka, tags, blurb, and "6 people" style queries -------
   A query can carry a table size: "4 players", "games for 6 people", or a
   bare "6". Lift that out, match it against the game's range, and search on
   whatever words remain. A bare number only counts as a table size inside a
   plausible range, so "Rummy 500" is still findable by name. */
const COUNT_WORD   = /\b(?:players?|people|ppl|person)\b/;
const COUNT_WORD_G = /\b(?:players?|people|ppl|person)\b/g;
const FILLER       = /\b(?:for|with|and|a|an|the|of|to|play|game|games)\b/g;
const MAX_TABLE    = 20;

function parseQuery(q){
  q = q.toLowerCase().trim();
  if(!q) return { count:null, words:[] };
  const n = q.match(/\b(\d+)\b/);
  const c = n ? +n[1] : null;
  const isCount = c !== null && c >= 1 && c <= MAX_TABLE
                  && (COUNT_WORD.test(q) || /^\d+$/.test(q));
  // filler words are only stripped once a count was found, so that a plain
  // title search stays literal
  let rest = isCount
    ? q.replace(/\b\d+\b/g,' ').replace(COUNT_WORD_G,' ').replace(FILLER,' ')
    : q;
  rest = rest.replace(/\s+/g,' ').trim();
  return { count: isCount ? c : null, words: rest ? rest.split(' ') : [] };
}

function matches(g, parsed){
  const { count, words } = parsed;
  if(count !== null && (count < g.players[0] || count > g.players[1])) return false;
  if(!words.length) return true;
  const hay = [g.name, g.blurb, g.needs, ...(g.aka||[]), ...g.tags, CATS[g.cat]].join(' ').toLowerCase();
  return words.every(w => hay.includes(w));
}

function filtered(){
  const parsed = parseQuery(state.q);
  return GAMES.filter(g => (!state.cat || g.cat === state.cat) && matches(g, parsed));
}

/* ---- rendering ---- */
function gameCard(g){
  const wrap = el('div', 'gcard-wrap');
  const btn = el('button', 'gcard');
  btn.type = 'button';
  btn.innerHTML = `
    <h3>${esc(g.name)}</h3>
    ${g.aka && g.aka.length ? `<p class="aka">also called ${g.aka.map(esc).join(' &middot; ')}</p>` : ''}
    <p class="blurb">${esc(g.blurb)}</p>
    <div class="meta">
      <span class="pill cat">${esc(CATS[g.cat])}</span>
      <span class="pill">${playerLabel(g)}</span>
      <span class="pill">${timeLabel(g)}</span>
      <span class="pill">${diffLabel(g)}</span>
    </div>`;
  btn.onclick = () => openGame(g.id);

  const on = state.favs.has(g.id);
  const fav = el('button', 'fav');
  fav.type = 'button';
  fav.innerHTML = on ? '&#9829;' : '&#9825;';
  fav.setAttribute('aria-pressed', on);
  fav.setAttribute('aria-label', (on ? 'Remove ' : 'Save ') + g.name);
  fav.onclick = () => toggleFav(g.id);

  wrap.append(btn, fav);
  return wrap;
}

function renderList(node, games, emptyMsg){
  node.innerHTML = '';
  if(!games.length){ node.appendChild(el('div','empty', emptyMsg)); return; }
  const frag = document.createDocumentFragment();
  games.forEach(g => frag.appendChild(gameCard(g)));
  node.appendChild(frag);
}

function renderBrowse(){
  const games = filtered();
  renderList($('#list'), games,
    '<b>Nothing matches</b>Try a shorter search, or clear the category filter.');
  $('#resultCount').textContent = `${games.length} game${games.length === 1 ? '' : 's'}`;
  $('#resetFilters').classList.toggle('hide', !state.cat && !state.q);
}

function renderCats(){
  const row = $('#catRow'); row.innerHTML = '';
  const mk = (id, label) => {
    const b = el('button','chip', label);
    b.setAttribute('aria-pressed', state.cat === id);
    b.onclick = () => { state.cat = state.cat === id ? null : id; renderCats(); renderBrowse(); };
    return b;
  };
  Object.entries(CATS).forEach(([id, label]) => {
    if(GAMES.some(g => g.cat === id)) row.appendChild(mk(id, label));
  });
}

function renderFavs(){
  const games = GAMES.filter(g => state.favs.has(g.id));
  renderList($('#favList'), games,
    '<b>Nothing saved yet</b>Tap the heart on any game to keep it here for later.');
  $('#favCount').textContent = games.length ? `${games.length} saved` : '';
}

function toggleFav(id){
  state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
  store.set('dr:favs', [...state.favs]);
  renderBrowse(); renderFavs();
  if(state.pickResults) renderList($('#pickList'), state.pickResults, '');
  const d = $('#detail');
  if(d.classList.contains('open') && d.dataset.id === id) syncDetailFav(id);
  toast(state.favs.has(id) ? 'Saved' : 'Removed');
}

function openGame(id, fromPop){
  const g = GAMES.find(x => x.id === id);
  if(!g) return;
  const related = GAMES.filter(x => x.id !== g.id && x.cat === g.cat).slice(0, 4);
  $('#dBody').innerHTML = `

      <p class="blurb">${esc(g.blurb)}</p>
    </div>
    <div class="statgrid">
      <div class="stat"><b>${g.players[0] === g.players[1] ? g.players[0] : g.players[0] + '–' + g.players[1]}</b><span>Players</span></div>
      <div class="stat"><b>${esc(String(g.best))}</b><span>Best</span></div>
      <div class="stat"><b>${timeLabel(g).replace(' min','')}</b><span>Minutes</span></div>
      <div class="stat"><b>${g.age}+</b><span>Ages</span></div>

    ${g.sections.map(s => `<section class="rule"><h4>${esc(s.h)}</h4><p>${esc(s.b)}</p></section>`).join('')}
    ${g.variants && g.variants.length ? `<div class="varbox"><h4>Variants &amp; house rules</h4><ul>${g.variants.map(v => `<li>${esc(v)}</li>`).join('')}</ul></div>` : ''}
    ${related.length ? `<div class="related"><h4>More ${esc(CATS[g.cat].toLowerCase())}</h4><div class="list" id="relList"></div></div>` : ''}
  `;
  if(related.length) renderList($('#relList'), related, '');
  const d = $('#detail');
  if(!d.classList.contains('open')) lastFocus = document.activeElement;
  d.dataset.id = id;
  d.classList.add('open');
  d.scrollTop = 0;
  syncDetailFav(id);
  document.body.style.overflow = 'hidden';
  if(!fromPop && location.hash !== '#' + id){ history.pushState({ id }, '', '#' + id); pushes++; }
  $('#dBack').focus();
}

function syncDetailFav(id){
  const on = state.favs.has(id);
  const b = $('#dFav');
  b.innerHTML = on ? '&#9829; Saved' : '&#9825; Save';
  b.setAttribute('aria-pressed', on);
}

/* Closing is two jobs: tear the view down, and unwind the history entry we
   pushed on the way in. dismissDetail() is the user-facing one — it goes
   back, so the browser's own Back button stays in step. closeDetail() is the
   teardown, called directly only when there is no entry to unwind. */
function closeDetail(){
  const d = $('#detail');
  if(!d.classList.contains('open')) return;
  d.classList.remove('open');
  d.removeAttribute('data-id');
  document.body.style.overflow = '';
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

function dismissDetail(){
  if(pushes > 0){ history.back(); return; }   // popstate does the teardown
  if(location.hash) history.replaceState({}, '', location.pathname + location.search);
  closeDetail();
}

function trapFocus(e, root){
  const f = [...root.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(n => n.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

/* ---- picker ---- */
function renderPickerControls(){
  $('#pVal').textContent = state.pick.players;
  $('#pMinus').disabled = state.pick.players <= 1;
  $('#pPlus').disabled = state.pick.players >= 20;

  const ts = $('#timeSeg'); ts.innerHTML = '';
  TIME_OPTS.forEach(o => {
    const b = el('button', null, o.label);
    b.setAttribute('aria-pressed', state.pick.time === o.id);
    b.onclick = () => { state.pick.time = o.id; savePick(); renderPickerControls(); };
    ts.appendChild(b);
  });

  const vs = $('#vibeSeg'); vs.innerHTML = '';
  VIBES.forEach(v => {
    const b = el('button', null, v.label);
    b.setAttribute('aria-pressed', state.pick.vibes.has(v.id));
    b.onclick = () => {
      state.pick.vibes.has(v.id) ? state.pick.vibes.delete(v.id) : state.pick.vibes.add(v.id);
      savePick(); renderPickerControls();
    };
    vs.appendChild(b);
  });
}

function savePick(){
  store.set('dr:pick', { players: state.pick.players, time: state.pick.time, vibes: [...state.pick.vibes] });
}

function pickResults(){
  const { players, time, vibes } = state.pick;
  return GAMES.filter(g => {
    if(players < g.players[0] || players > g.players[1]) return false;
    if(time && g.time[0] > time) return false;
    if(vibes.size){
      const active = VIBES.filter(v => vibes.has(v.id));
      if(!active.some(v => v.test(g))) return false;
    }
    return true;
  }).sort((a, b) => {
    // closest to the sweet spot first, then shorter games
    const fit = g => Math.abs(((g.players[0] + g.players[1]) / 2) - players);
    return fit(a) - fit(b) || a.time[0] - b.time[0];
  });
}

function runPicker(){
  const r = pickResults();
  state.pickResults = r;
  renderList($('#pickList'), r,
    '<b>Nothing fits that exactly</b>Try widening the time, or dropping a vibe.');
  $('#pickCount').textContent = r.length
    ? `${r.length} game${r.length === 1 ? '' : 's'} work for ${state.pick.players} player${state.pick.players === 1 ? '' : 's'}`
    : '';
}

/* ---- tabs ---- */
function setTab(tab){
  state.tab = tab;
  ['browse','picker','favs'].forEach(t => $('#view-' + t).classList.toggle('hide', t !== tab));
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  $('#searchWrap').classList.toggle('hide', tab !== 'browse');
  $('#catRow').classList.toggle('hide', tab !== 'browse');
  if(tab === 'favs') renderFavs();
  if(tab === 'picker') renderPickerControls();
  window.scrollTo(0, 0);
}

/* ---- wire it up ---- */
$('#q').addEventListener('input', e => {
  state.q = e.target.value.trim();
  $('#searchWrap').classList.toggle('has', !!state.q);
  renderBrowse();
});
$('#clearQ').onclick = () => { $('#q').value = ''; state.q = ''; $('#searchWrap').classList.remove('has'); renderBrowse(); $('#q').focus(); };
$('#resetFilters').onclick = () => { state.cat = null; state.q = ''; $('#q').value = ''; $('#searchWrap').classList.remove('has'); renderCats(); renderBrowse(); };
$('#dBack').onclick = dismissDetail;
$('#pMinus').onclick = () => { state.pick.players = Math.max(1, state.pick.players - 1); savePick(); renderPickerControls(); };
$('#pPlus').onclick  = () => { state.pick.players = Math.min(20, state.pick.players + 1); savePick(); renderPickerControls(); };
$('#pickGo').onclick = runPicker;
$('#pickRandom').onclick = () => {
  const r = pickResults();
  if(!r.length){ runPicker(); return; }
  openGame(r[Math.floor(Math.random() * r.length)].id);
};
$('#dFav').onclick = () => toggleFav($('#detail').dataset.id);
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.addEventListener('keydown', e => {
  const d = $('#detail');
  if(d.classList.contains('open')){          // the dialog owns the keyboard
    if(e.key === 'Escape') dismissDetail();
    else if(e.key === 'Tab') trapFocus(e, d);
    return;
  }
  if(e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); setTab('browse'); $('#q').focus(); }
});
window.addEventListener('popstate', () => {
  if(pushes > 0) pushes--;
  const id = location.hash.slice(1);
  if(id && GAMES.some(g => g.id === id)) openGame(id, true); else closeDetail();
});

/* ---- boot ---- */
GAMES.sort((a, b) => a.name.localeCompare(b.name));
$('#gcount').textContent = GAMES.length + ' games';
renderCats(); renderBrowse(); renderPickerControls();
if(location.hash.slice(1)) openGame(location.hash.slice(1));

/* ---- offline: only when actually served over http(s) ---- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
